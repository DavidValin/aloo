name: Release

# Triggers when a tag is pushed. A guard job verifies the tagged
# commit is reachable from the main branch before building.
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if git branch -r --contains "$GITHUB_REF" | grep -qE '(^|/)main$'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $GITHUB_REF is not reachable from main. Skipping release." >&2
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # Linux glibc
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            arch: aarch64
            use_cross: true
          # Linux musl (static)
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            arch: x86_64-musl
            use_cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            arch: aarch64-musl
            use_cross: true
          # macOS
          - target: x86_64-apple-darwin
            runner: macos-14
            os: macos
            arch: x86_64
            use_cross: false
          - target: aarch64-apple-darwin
            runner: macos-14
            os: macos
            arch: aarch64
            use_cross: false
          # Windows
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            arch: x86_64
            use_cross: false
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            os: windows
            arch: aarch64
            use_cross: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cpal's ALSA backend needs the system dev headers to link against on
      # native (non-cross) Linux builds; cross's Docker images bring their
      # own sysroot for the cross-compiled targets below.
      - name: Install ALSA dev headers (Linux, native build only)
        if: matrix.runner == 'ubuntu-latest' && matrix.use_cross == false
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # PKG_CONFIG_ALLOW_CROSS/PKG_CONFIG_ALL_STATIC only actually reach the
      # build container for x86_64-unknown-linux-musl - see Cross.toml's
      # [target.x86_64-unknown-linux-musl.env] passthrough list, which is
      # the only target that declares them. Setting them here unconditionally
      # is harmless for every other cross target (aarch64-unknown-linux-gnu,
      # aarch64-unknown-linux-musl): with no matching passthrough entry,
      # `cross` never forwards them into those containers.
      - name: Build (cross)
        if: matrix.use_cross
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_ALL_STATIC: "1"
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.use_cross == false
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Archive artifact (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/aloo staging/aloo
          chmod +x staging/aloo
          tar -czf "aloo-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tgz" -C staging aloo

      - name: Archive artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aloo.exe" "staging/aloo.exe"
          tar -czf "aloo-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tgz" -C staging aloo.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aloo-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}
          path: aloo-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tgz

  build-freebsd:
    name: Build (x86_64-unknown-freebsd)
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          arch: x86_64
          prepare: |
            pkg install -y rust pkgconf alsa-lib
          run: |
            cd $GITHUB_WORKSPACE
            cargo build --release --locked
            mkdir -p staging
            cp target/release/aloo staging/aloo
            chmod +x staging/aloo
            tar -czf aloo-${{ github.ref_name }}-freebsd-x86_64.tgz -C staging aloo

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aloo-${{ github.ref_name }}-freebsd-x86_64
          path: aloo-${{ github.ref_name }}-freebsd-x86_64.tgz

  build-netbsd:
    name: Build (x86_64-unknown-netbsd)
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          arch: x86_64
          prepare: |
            /usr/sbin/pkg_add -u rust pkgconf alsa-lib
          run: |
            cd $GITHUB_WORKSPACE
            cargo build --release --locked
            mkdir -p staging
            cp target/release/aloo staging/aloo
            chmod +x staging/aloo
            tar -czf aloo-${{ github.ref_name }}-netbsd-x86_64.tgz -C staging aloo

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aloo-${{ github.ref_name }}-netbsd-x86_64
          path: aloo-${{ github.ref_name }}-netbsd-x86_64.tgz

  build-openbsd:
    name: Build (x86_64-unknown-openbsd)
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          arch: x86_64
          prepare: |
            pkg_add rust
          run: |
            cd $GITHUB_WORKSPACE
            cargo build --release --locked
            mkdir -p staging
            cp target/release/aloo staging/aloo
            chmod +x staging/aloo
            tar -czf aloo-${{ github.ref_name }}-openbsd-x86_64.tgz -C staging aloo

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aloo-${{ github.ref_name }}-openbsd-x86_64
          path: aloo-${{ github.ref_name }}-openbsd-x86_64.tgz

  release:
    name: Create release & upload assets
    needs: [guard, build, build-freebsd, build-netbsd, build-openbsd]
    if: always() && needs.guard.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: assets/*
