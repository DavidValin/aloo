[[user_story.technical_behavior]]
id = "TB-216"
description = "The attach backend answers from what its viewer reported the three questions CrosstermBackend answers by querying its own stdout - which in a daemon is /dev/null: terminal size, window size, and cursor position (whose real implementation would block reading a Device Status Report reply from a stdin nobody is writing to). A zero dimension reported mid-resize is clamped to 1 rather than trusted."
