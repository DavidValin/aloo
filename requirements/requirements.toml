[[user_story.acceptance_criteria]]
id = "AC-123"
description = "Forging continuity needs the retired identity's private keys, which knowing its public fingerprint does not give. A bundle with no certificate, one signed by different keys, or a genuine certificate lifted onto another bundle all fail to verify, and a failure leaves the existing pin exactly as it was and opens the ordinary review."
evidence = "docs/PROTOCOL.md 12.6; src/crypto/pq.rs verify_continuity; identity_continuity.feature 'A stranger taking the nickname cannot fake continuity'; tests an_unrelated_identity_cannot_prove_continuity, a_certificate_signed_by_the_wrong_keys_is_refused, a_certificate_does_not_transfer_to_another_bundle"

[[user_story.acceptance_criteria]]
id = "AC-124"
description = "`aloo --export-identity-card <prefix> <nickname>` writes a small self-signed file pairing a nickname with an identity, shareable by any means. Importing one pins that nickname as verified before first contact - the one thing pinning alone can never do, since a first sighting has nothing to compare against."
