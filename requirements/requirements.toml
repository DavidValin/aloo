# ============================================================================
# US-038 - Run aloo as a resumable background daemon
# ============================================================================
[[user_story]]
id = "US-038"
title = "Run aloo as a resumable background daemon"
as_a = "user who wants to talk without keeping a terminal open"
i_want = "aloo to connect at boot, join the channels I care about and focus where my voice should go, then let me take the session over from any terminal and hand it back"
so_that = "the global push-to-talk shortcut is always live without me having to start and stay in the app"

[[user_story.acceptance_criteria]]
id = "AC-199"
description = "--otp with a nickname --focus makes sure an OTP session is running with that person: one that is already active is continued silently, with no invitation sent and no Accept/Reject popup on their side, since a session outlives disconnects and restarts and only /endotp ends one; only a peer with no live session is invited, and at most once per daemon run so a flapping connection cannot become a queue of popups."
evidence = "docs/SPEC.md 'Running in background mode' 'Focusing a person, with OTP'; docs/PROTOCOL.md 16.6; src/client/daemon.rs DaemonPlan::should_invite_otp; src/client/session.rs on_daemon_peer_appeared; tests an_already_active_otp_session_is_continued_not_re_invited, a_peer_with_no_otp_session_is_invited, without_otp_nobody_is_ever_invited, only_one_invitation_is_sent_per_daemon_run, someone_other_than_the_focused_peer_is_never_invited, a_channel_focus_never_invites_an_otp_session"

[[user_story.acceptance_criteria]]
id = "AC-200"
description = "--focus is a starting position, not a standing instruction: it is placed once, at the first opportunity (which for a person may be long after startup, since they have to appear first), and never re-applied. Someone who attaches, moves to another channel or DM and detaches again keeps that position - a focused peer reconnecting, or a focused channel being rejoined, does not drag the focus back. The join sound and notification still fire for those events; only the focus move is suppressed."
evidence = "docs/SPEC.md 'Running in background mode' 'Where your voice goes'; src/client/daemon.rs DaemonPlan::should_place_focus; src/client/session.rs apply_daemon_channel_focus, on_daemon_peer_appeared; tests the_focus_is_placed_once_and_then_left_alone, a_focused_peer_reappearing_does_not_re_steal_the_focus, a_focused_channel_being_rejoined_does_not_re_steal_the_focus, a_focus_still_waiting_for_its_peer_has_not_been_used_up"

[[user_story.technical_behavior]]
id = "TB-217"
description = "--channels takes a comma-separated list of name[:password] items. The colon is what makes it unambiguous - it is legal in neither a channel name nor a channel password, whereas a comma is legal in a password - and the name/password split is on the first colon, so a password may contain commas when it comes from a single daemon_channel= settings line. Empty list items are skipped so a stray comma costs nothing, an unusable channel name is refused with a reason, an empty password means none rather than the empty one, and a channel round-trips through its settings line unchanged."
evidence = "docs/SPEC.md 'Running in background mode' Channels; src/client/daemon.rs DaemonChannel::parse, parse_list, to_setting; src/validation.rs channel_name_is_valid, CHANNEL_PASSWORD_SYMBOLS; tests a_channel_without_a_password_parses_to_just_a_name, a_channel_password_may_itself_contain_commas, a_channels_list_splits_on_commas_and_passwords_on_colons, empty_items_in_a_channels_list_are_skipped_but_bad_names_are_not, a_single_channel_is_a_list_of_one, an_empty_password_means_no_password_rather_than_the_empty_one, an_unusable_channel_name_is_refused_with_a_reason, a_channel_round_trips_through_its_settings_line"

[[user_story.technical_behavior]]
id = "TB-218"
description = "--focus reads a channel: prefix as a channel and anything else as a nickname (dm: being the explicit spelling of the latter), refuses an empty value, and refuses --otp against a channel since OTP is provisioned pairwise and has no channel-wide form. A DM focus then follows the person wherever they appear, while a channel focus follows arrivals in that channel."
