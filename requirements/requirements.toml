[[user_story.technical_behavior]]
id = "TB-193"
description = "A mail spends the same per-contact sequential pad and passes the same stop-and-wait gate as live OTP sends - reserved only after otp --encrypt genuinely succeeds, cleared only by the server's OtpMailResult (or a late OtpMailDelivered), with one queued send drained per clearing. While a mail is unacknowledged nothing else can encrypt for that contact, which is exactly what keeps .last_sent naming the mail; a resend whose gate no longer names its seq is skipped rather than replaying bytes that may belong to a newer send."
evidence = "docs/PROTOCOL.md 17.2; src/client/otp_mail.rs handle_send, resend_pending, on_mail_result; src/client/otp_store.rs PendingOtpContent::Mail; tests pending_mail_content_round_trips_through_save_and_load, a_mails_last_sent_copy_replays_byte_identically_for_retry, a_mails_gate_clears_on_the_storage_ack_alone_never_needing_delivery, a_mails_gate_also_clears_on_a_refused_storage_ack; scenario features/messaging/otp_mail.feature 'A second mail is stored before the first is ever delivered'"

[[user_story.technical_behavior]]
id = "TB-194"
description = "The receiving side derives the pad contact from its own pinned key for the claimed sender and refuses - untouched and unacknowledged - a mail whose carried contact name does not reproduce it, and runs the per-contact sequence guard before otp --decrypt exactly as for live sends: a lower sequence re-acknowledges, a higher one waits for the earlier spend, and the sender's recovery scan re-fires on OtpMailDelivered so a live send refused while a mail was still ahead of it in pad order heals without fresh pad."
evidence = "docs/PROTOCOL.md 17.3, 17.4; src/client/otp_mail.rs MailGate, mail_gate, on_mail_deliver, on_mail_delivered; tests mail_gate_refuses_a_contact_mismatch_before_the_pad, mail_gate_reacknowledges_an_already_consumed_sequence, mail_gate_waits_for_an_earlier_spend, mail_gate_admits_only_the_exact_next_sequence; scenario features/messaging/otp_mail.feature 'A mail sealed for a different identity never touches the pad'"

[[user_story.technical_behavior]]
id = "TB-195"
description = "A one-time pad is malleable, so the sealed payload carries an ML-DSA-87+RSA-4096 identity signature over a mail-specific domain tag, verified against the receiver's pinned bundle for the claimed sender after decrypt; a payload that fails verification, or whose sealed from/to disagree with the server's claimed routing, is discarded (with acknowledgement - its pad range is spent either way) and never believed."
evidence = "docs/PROTOCOL.md 17.2, 17.3; src/crypto/pq.rs sign_mail, verify_mail; src/client/otp_mail.rs on_mail_deliver; tests sign_mail_verifies_and_rejects_a_flipped_payload, mail_signature_domain_is_not_interchangeable_with_rotation; scenario features/messaging/otp_mail.feature 'A tampered mail fails its identity signature'"

[[user_story.technical_behavior]]
id = "TB-196"
description = "Mail ids are 16 random bytes as exactly 32 lowercase hex characters, validated on both sides before any filesystem path is built from one; the server additionally caps stored ciphertext size, requires storable nicknames, and records the sender's registered nickname as from - never the client's claim."
evidence = "docs/PROTOCOL.md 17.2; src/crypto/otp.rs new_mail_id, mail_id_is_valid; src/server/mail.rs MailStore::store, on_mail_send; tests mail_ids_are_lowercase_hex_and_validated_strictly, store_rejects_a_malformed_mail_id_before_touching_disk, store_rejects_oversized_ciphertext, on_mail_send_records_the_registered_sender_nickname; scenario features/messaging/otp_mail.feature 'Mail ids are validated before any path is built from them'"

[[user_story.technical_behavior]]
id = "TB-197"
description = "Server mail routing is idempotent and claimant-checked: a retried id overwrites byte-identically and re-acknowledges (or answers OtpMailDelivered if the mail was already delivered and deleted), an OtpMailAck is honored only from the stored recipient nickname, and a delivery receipt is forgotten only by the stored sender nickname."
evidence = "docs/PROTOCOL.md 17.2, 17.3; src/server/mail.rs on_mail_send, mark_delivered, forget_receipt; tests store_is_idempotent_for_a_retried_id, on_mail_send_answers_a_retry_after_delivery_with_delivered, mark_delivered_refuses_a_claimant_other_than_the_recipient, forget_receipt_only_for_the_original_sender"

[[user_story.acceptance_criteria]]
id = "AC-292"
description = "Every received mail is unread the moment it arrives, and stays that way until its reader is opened (`/mailbox`, Enter on its row); reading it, and only reading it, marks it read, persisted so the count survives a restart. A line written before this concept existed loads as already read - the safe, quiet default - so upgrading never surfaces a stampede of \"new\" mail that predates it."
evidence = "docs/PROTOCOL.md 17; src/client/otp_mail_store.rs ReceivedMailRef::read, OtpMailStore::mark_read, unread_received_count; src/client/otp_mail.rs handle_read; tests a_freshly_stored_mail_is_unread, mark_read_flips_the_flag_and_is_idempotent, unread_received_count_counts_only_the_ones_still_unread, the_read_flag_round_trips_through_save_and_load, a_line_written_before_read_existed_loads_as_read"

