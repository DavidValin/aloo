# ============================================================================
# US-055 - Voice only autoplays where you're actually looking
# ============================================================================
[[user_story]]
id = "US-055"
title = "Voice only autoplays where you're actually looking"
as_a = "user with more than one channel or DM active at once"
i_want = "an incoming voice message to only play itself automatically in the channel/DM I currently have open"
so_that = "voice from a conversation I'm not looking at doesn't play over whatever I'm actually doing, and I can still tell it arrived"

[[user_story.acceptance_criteria]]
id = "AC-357"
description = "A voice stream's autoplay is suppressed - in addition to the existing muted/trust-gated reasons (`suppress_playback_from`) - whenever the channel/DM it arrived in is not the one currently on screen (`is_viewing_channel`/`is_viewing_dm`), checked at `channel::on_stream_start`/`direct_message::on_stream_start`. Whatever that combined `suppress_playback` was at arrival sets the row's `LogEntry.listened` (`false` if suppressed, `true` if it autoplayed live) - our own sent voice always starts `listened: true`, since the marker below only ever means something received. A row's log line ends with a red \"not listened\" marker, flush to the right edge, for exactly as long as `!entry.outgoing && !entry.listened` - cleared (`listened = true`) the moment the row is manually replayed (`Enter` in `handle_messages_key`, alongside the existing `owed_receipt` payoff). An OTP voice message never live-streams (`docs/PROTOCOL.md` §16.2 - it is captured and encrypted whole, only then sent), so it has no `*StreamStart` to decide this at; `otp::finish_incoming_file`'s `OtpIncomingKind::Voice` arm computes the identical `suppress_playback_from(...) || !is_viewing_dm(...)` once the clip is fully decrypted, pushes the decoded PCM straight to the mixer itself (there being no per-chunk decrypt worker to do it) when that is `false`, and hands the result to `UiState::on_direct_voice_message` - `on_direct_message`'s counterpart for a body that carries its own listened decision instead of always starting `true` - so an OTP voice message autoplays, and shows the same marker when it doesn't, exactly like a `pq_hybrid` one."
evidence = "src/client/channel.rs, direct_message.rs on_stream_start (widened suppress_playback); src/client/tui/channel.rs, direct_message.rs on_channel_stream_start/on_direct_stream_start (suppress_playback param -> listened); src/client/otp.rs finish_incoming_file's OtpIncomingKind::Voice arm (suppress_playback, the mixer push, on_direct_voice_message); src/client/tui/direct_message.rs on_direct_voice_message, push_incoming_dm; src/client/tui/ui.rs LogEntry.listened, render_messages's MessageBody::Voice arm (the marker), handle_messages_key's Enter arm; tests on_channel_stream_start_sets_listened_from_suppress_playback, log_own_voice_stream_start_channel_always_starts_listened, a_received_unlistened_voice_row_shows_a_red_not_listened_marker, a_listened_voice_row_shows_no_marker, an_outgoing_voice_row_never_shows_the_marker_even_if_listened_were_somehow_false (ui_channel_test.rs), replaying_a_clip_marks_it_listened (ui_test.rs), on_direct_voice_message_sets_listened_from_the_caller, an_unlistened_otp_voice_row_shows_a_red_not_listened_marker, a_listened_otp_voice_row_shows_no_marker (ui_direct_message_test.rs); features/voice/voice_listened_marker.feature's three OTP scenarios (cucumber)"

# ============================================================================
# US-056 - A settings file that documents its own options
# ============================================================================
[[user_story]]
id = "US-056"
title = "A settings file that documents its own options"
as_a = "user setting up aloo for the first time"
i_want = "~/.aloo/settings, the moment it's created, to already list every option there is"
so_that = "I can find and edit any of them by hand without having to know they exist or go read the source"

[[user_story.acceptance_criteria]]
id = "AC-356"
description = "The very first time `~/.aloo/settings` is created (`Settings::load_or_create`'s not-found branch), it is written as two `#`-commented sections in order - `# client options` then, after a blank line, `# server options` - listing every option that exists in the app, scalar or accumulating. A scalar option gets one real, live line (unset written blank/off rather than omitted, the same \"always written\" precedent `server_smtp_host=` already set). An accumulating, one-line-per-entry option (`muted_voice`, `daemon_channel`, `direct_punch_to`, `direct_punch_channel`, `server_superadmin`) has nothing real to pre-populate, so it gets one `#`-commented example line instead, showing its exact syntax (a fake nickname/host for `direct_punch_to`) without taking effect - `Settings::parse` already skips `#`-prefixed lines, so these examples never populate anything on reload. Every ordinary write after that first run (`Settings::save`, via `update`/`remember_connection`/`update_muted_voice`/`--server` recording its bind and port) patches that file's own existing lines in place (`Settings::patch_into`) instead of regenerating it: every comment, blank line, section header and hand-chosen key order a user left in the file survives, only the value half of a line whose key actually changed is rewritten, and a key with no line yet is appended. A key this build doesn't recognize at all is left exactly as found. `Settings::save` falls back to the old dense, unsectioned, no-comments form (`Settings::dense_contents`) only when there is no existing file at all to patch against."
evidence = "src/settings.rs Settings::scaffold_contents, load_or_create, patch_into, dense_contents; tests the_first_run_scaffold_is_split_into_client_and_server_sections_in_order, a_blank_line_separates_the_client_and_server_sections, an_ordinary_save_after_the_first_run_preserves_the_scaffolds_comments_and_order, the_scaffold_shows_every_accumulating_key_as_a_commented_example_that_never_loads (settings_test.rs)"

