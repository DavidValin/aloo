[[user_story.acceptance_criteria]]
id = "AC-368"
description = "A logged-in user changes their own password with `/password <old> <new>` (ClientMessage::ChangePassword) - reachable for any connected account, gated on nothing client-side. The server re-checks `old` exactly like Auth would (never trusting the credentials this same connection originally authenticated with) before calling UsersRegistry::change_password; a wrong `old` refuses with ChangePasswordResult { ok: false } and leaves the real password untouched, and the connection itself is unaffected either way - unlike a failed Auth, it stays open. Needs a server (UiAction::needs_server) - there is no meaning for a password without a registry to hold one."
