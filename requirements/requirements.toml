# ============================================================================
# US-028 - Losing a key today does not expose what was said yesterday
# ============================================================================
[[user_story]]
id = "US-028"
title = "Losing a key today does not expose what was said yesterday"
as_a = "user of the quantum-resistant identity"
i_want = "the keys that unlock my messages thrown away as I go"
so_that = "someone who later steals my keybundle still cannot read what I already said"

[[user_story.acceptance_criteria]]
id = "AC-116"
description = "A pq_hybrid identity splits into a durable signing half (ML-DSA-87 + RSA-4096, in the keybundle file, pinned by contacts, never rotated) and an encryption half (ML-KEM-1024 + X25519) that is regenerated per peer relationship as messages are exchanged. Messages seal to the peer's current rotated key; a peer who has not rotated yet is still reachable on the bootstrap key from their bundle. Each relationship rotates independently."
evidence = "docs/PROTOCOL.md 13.10; src/crypto/pq.rs PqEncapKeys, generate_encryption_keys; src/client/pq_rekey.rs PqOwnKeys, PqPeerKeys; pq_hybrid_forward_secrecy.feature 'A message still reaches its recipient after keys have rotated'; tests a_message_opens_under_the_key_the_peer_rotated_to, the_bootstrap_key_still_opens_a_message_from_a_peer_who_never_rotated, rotation_is_independent_per_peer"

[[user_story.acceptance_criteria]]
id = "AC-117"
description = "A superseded encryption key is destroyed once it falls out of the retention window, so neither the keys still held nor the keybundle file on disk can open a message that was sealed to it. The exception, documented rather than hidden, is a first message exchanged before either side has rotated: that one is sealed to the bootstrap key the file does hold."
evidence = "docs/PROTOCOL.md 13.10; src/client/pq_rekey.rs PqOwnKeys::rotate_for, candidates_for, PQ_KEY_RETENTION; pq_hybrid_forward_secrecy.feature 'A stolen keybundle does not open yesterday''s message'; tests a_key_pushed_out_of_the_retention_window_cannot_open_its_message, forgetting_a_peer_drops_their_keys"

[[user_story.acceptance_criteria]]
id = "AC-118"
description = "Every rotation is signed by the sender's durable identity (both ML-DSA-87 and RSA-PSS) rather than by the key it replaces, so each one is independently verifiable against the bundle a contact already pinned - no chain to break, and no resume mechanism needed across a reconnect. A rotation signed by anyone else, or one whose generation is not newer than the last accepted, is dropped and leaves the trusted key untouched."
evidence = "docs/PROTOCOL.md 13.10; src/crypto/pq.rs sign_rotation, verify_rotation; src/client/pq_rekey.rs PqPeerKeys::install; src/client/session.rs handle_pq_key_rotated; pq_hybrid_forward_secrecy.feature 'A rotation is only trusted if the identity itself signed it'; tests a_rotation_is_trusted_only_if_the_identity_signed_it, an_older_rotation_generation_is_not_installed"

[[user_story.acceptance_criteria]]
id = "AC-119"
description = "A rotation commits to who it is for - both the recipient's live UserId and their durable identity fingerprint - so one peer cannot replay a rotation addressed to another as though it were meant for them."
evidence = "docs/PROTOCOL.md 13.10; src/crypto/pq.rs rotation_commitment; pq_hybrid_forward_secrecy.feature 'A rotation names who it is for'; test a_rotation_meant_for_one_peer_is_refused_by_another"

[[user_story.technical_behavior]]
id = "TB-164"
description = "Up to PQ_KEY_RETENTION superseded decryption keys are kept per peer so a burst of messages sent under one key, or a message already in flight when we rotate, still opens; anything older is discarded, and that bound is what the forward-secrecy guarantee rests on."
evidence = "docs/PROTOCOL.md 13.10; src/client/pq_rekey.rs PQ_KEY_RETENTION, candidates_for; pq_hybrid_forward_secrecy.feature 'A few recent keys are kept so a burst of messages still opens'; test recent_keys_are_retained_so_a_burst_still_opens"

[[user_story.technical_behavior]]
id = "TB-165"
description = "The per-recipient key wrap combines an ML-KEM-1024 shared secret with an X25519 shared secret from a per-send ephemeral keypair, via HKDF-SHA256 - so recovering the wrapped key needs both, and the ephemeral half gives forward secrecy on the sender's side too. This replaces the RSA-OAEP classical half used before rotation existed: X25519 keygen is fast enough to rotate per message, which RSA-4096 is not (the same pairing X-Wing uses, at a higher ML-KEM parameter set). RSA-4096 remains the classical hedge on the signing side."
evidence = "docs/PROTOCOL.md 13.3/13.10; src/crypto/pq.rs wrap_key_for, unwrap_key, hkdf_combine; tests the_wrap_needs_both_the_kem_and_the_x25519_halves, wrap_key_for_and_unwrap_key_round_trip"

[[user_story.technical_behavior]]
id = "TB-166"
description = "Rotation runs inline on the event loop rather than on a dedicated worker thread, because ML-KEM-1024 and X25519 keygen are microseconds - so pq_hybrid needs no rotation spinner and no carve-out exempting voice from per-message rotation. One trigger, session::request_rotation, drives it and is a no-op for the static modes."
evidence = "docs/PROTOCOL.md 13.10; src/client/session.rs request_rotation, request_rotation_if_pq_hybrid; src/client/pq_rekey.rs (module doc); test every_rotation_produces_new_keys_with_no_machinery_behind_it"

[[user_story.technical_behavior]]
id = "TB-167"
description = "The server relays RotateKey for the pq_hybrid mode and refuses it from the static ones, which have nothing to rotate; it still verifies nothing about the payload or signature, exactly as before."
evidence = "docs/PROTOCOL.md 7.5/13.10; src/server/mod.rs route_key_rotation; test rotate_key_is_rejected_from_a_non_rotating_sender"

# ============================================================================
