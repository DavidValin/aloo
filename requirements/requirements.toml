[[user_story.acceptance_criteria]]
id = "AC-360"
description = "`export::LogHistoryCursor` reads a surface's `.log` file back-to-front, one chunk at a time: `open` reads the whole file's text once (never the audio any `.wav` reference points at), reassembling a pasted multi-line message's unprefixed continuation lines back into the one record they belong to; `next_chunk` returns records oldest-first, skipping (not failing on) anything unparseable. `parse_log_entry` is `format_line`'s inverse, with necessarily lossy reconstruction where the two directions aren't symmetric: `System`/`Presence` are textually identical on disk and both come back as `System`; a `[file] <name>` reference comes back as plain `Text`, not a re-offered `MessageBody::File` (there is no live stream/size/status left to attach to it); a voice line becomes `MessageBody::VoiceOnDisk { duration_ms, wav_path }`, `wav_path` being `None` when the original autosave never managed to write the `.wav`; every reconstructed row's `sent_at` equals its `sent_at_utc`, and it starts `listened: true` regardless of voice content (the not-listened marker is about this session's live arrivals, not a verdict on old history)."
evidence = "src/client/export.rs group_into_records, parse_log_entry, LogHistoryCursor; src/client/tui/ui.rs MessageBody::VoiceOnDisk; tests history_cursor_reads_back_a_text_entry_written_by_autosave, history_cursor_reads_a_voice_entry_as_voice_on_disk_with_a_resolvable_wav_path, history_cursor_reads_a_voice_line_with_no_wav_reference_as_wav_path_none, history_cursor_reads_a_file_reference_as_plain_text, history_cursor_collapses_system_and_presence_into_system, history_cursor_reassembles_a_multiline_pasted_text_entry, history_cursor_skips_unparseable_lines, history_cursor_chunks_across_multiple_calls_newest_chunk_first, history_cursor_open_skips_already_loaded_records_from_the_end, history_cursor_on_a_missing_file_has_nothing_to_load (export_test.rs)"

