# ============================================================================
# US-033 - Layer one-time-pad encryption over an established pq_hybrid conversation, per contact
# ============================================================================
[[user_story]]
id = "US-033"
title = "Layer one-time-pad encryption over an established pq_hybrid conversation, per contact"
as_a = "user who wants an extra, independent layer of secrecy on top of pq_hybrid for a specific contact"
i_want = "the real otp command (github.com/DavidValin/otp-toolkit) to wrap and unwrap my pq_hybrid sends to that contact, provisioned only when I explicitly ask"
so_that = "even a future break of pq_hybrid alone does not expose that conversation, and I never send a message before the previous one was genuinely acknowledged"

[[user_story.acceptance_criteria]]
id = "AC-136"
description = "Two pq_hybrid peers who both provision an otp keychain contact for each other converge on the exact same contact name, derived deterministically from their two identity fingerprints regardless of who computes it first, and satisfying the otp CLI's own naming rules. The finished pq_hybrid send (Envelope.blocks[0]) is piped through the real otp command's --encrypt on the way out and --decrypt on the way in - aloo contains no one-time-pad cryptography or keychain-format code of its own."
evidence = "src/crypto/otp.rs contact_name_for; src/client/otp.rs wrap_outgoing, unwrap_incoming; src/client/otp_cli.rs encrypt, decrypt; tests contact_name_is_order_independent, contact_name_is_deterministic, contact_name_satisfies_the_otp_cli_naming_rules, a_message_encrypted_by_alice_decrypts_to_the_same_bytes_for_bob"

[[user_story.acceptance_criteria]]
id = "AC-137"
description = "A second OTP-wrapped message to a contact is never sent until a genuine P2pDeliveryAck naming the exact outstanding sequence has arrived from the peer over the network - a stale or mismatched ack does not clear the gate, and a message arriving while the gate is held is queued rather than dropped. The underlying otp command's own delivery-confirmation gate is only ever answered (-y) once that real ack is in hand, never blindly. A message held back this way always shows a status notice explaining it's queued, waiting for the previous one's acknowledgement - a held message and a lost one must never look identical to the user, which is exactly what let a stale, already-stuck gate go unnoticed during manual testing before this notice existed."
evidence = "src/client/otp_store.rs record_sent, record_acked, record_received; src/client/otp.rs send_or_queue, send_now, on_delivery_ack; src/p2p_proto.rs OtpEnvelope, OtpDeliveryAck; tests record_sent_sets_the_pending_ack_gate, record_acked_clears_the_gate_only_on_a_matching_sequence, a_second_encrypt_without_assume_delivered_fails_closed. What makes that ack believable rather than merely well-formed is AC-250's nonce proof."

[[user_story.acceptance_criteria]]
id = "AC-255"
description = "Escape abandons an in-progress pad from either side and at either phase. Generation and transfer between them run for minutes and consume four times the per-key size on the sender and twice it on the receiver, so a user who picked the wrong size must be able to stop rather than wait it out. Both background workers poll a shared per-peer flag and stop at a chunk boundary rather than being killed, so each unwinds having released its files - a thread torn down mid-write would leave exactly the partial state a cancel is meant to remove. Cancelling generation closes this side's end of the pad tool's stdin, which is what it is blocked on, so it exits non-zero and the caller sees a failed generation rather than a truncated pad presented as a real one. Everything staged is erased: the receiver's staging directory, the sender's pending halves, the store's setup record, and any promise still waiting on the peer's answer. A symmetric OtpPadCancel tells the other side, so whichever gives up, the other stops waiting and erases too rather than holding gigabytes for a handshake that will never complete. The keychain is never touched - a cancel during setup can only reach a pad that was staged and never adopted."
evidence = "src/client/otp.rs cancel_pad, on_pad_cancel; src/client/otp_pad.rs spawn_send_pad_worker's cancellation check; src/client/otp_cli.rs new_key_pair_with_progress's cancellation check; src/client/tui/ui.rs UiAction::CancelOtpPad and the keygen popup's Escape arm; src/p2p_proto.rs OtpPadCancel; src/client/session.rs SessionState.otp_cancelled and the CancelOtpPad/OtpPadCancel arms; tests escape_during_generation_or_transfer_cancels_the_pad, the_keygen_spinner_absorbs_every_key_except_escape"

[[user_story.acceptance_criteria]]
id = "AC-256"
description = "A pad's arrival is matched against the pad actually installed, not merely against the contact being provisioned. Those two look identical at the provisioned flag but must be answered oppositely: a re-delivery of the installed pad (its commit was lost) is re-verified silently so the sender can stop retrying, while a different pad offered for the same contact is a new proposal that has to be decided and, once accepted, actually installed. Conflating them let the sender install the new pad while the receiver returned early and kept the old one - two different pads under one contact name, which decode to plausible-looking garbage with nothing anywhere reporting an error, and which is the exact failure the two-phase commit exists to prevent. Which pad is installed is recorded as sha256 of its two half digests and persisted alongside the contact; a contact adopted from an existing keychain entry has none recorded and therefore always asks. Relatedly, a superseded proposal is retired from the user's decision queue when the pad it belonged to is superseded, so one /otp can never produce two decision popups, and accepting a stale one can never report digests for a staging directory that has already been erased."
evidence = "src/crypto/otp.rs pad_pair_digest; src/client/otp_store.rs OtpContactState.installed_pad_digest, mark_provisioned_with_pad, is_installed_pad; src/client/otp.rs on_pad_event's Received arm, on_pad_commit, on_pad_start's take_otp_invite_from; tests a_second_proposal_from_one_peer_replaces_the_first_rather_than_queueing, retiring_a_peers_proposal_removes_it_from_the_queue"

[[user_story.acceptance_criteria]]
id = "AC-257"
description = "The size of a pad is decided before it is generated, not after it has been transferred. /otp asks the initiator for a size, then sends an OtpSessionRequest carrying it; the deciding side sees 'wants to start a session with an NNN MB pad' and answers once, and only that answer starts generation. Nothing is generated or sent before it. This is the only moment the decision can do any good: by the time a pad has arrived, the cost it represents - minutes of transfer, several gigabytes of disk on both machines - has already been paid on both sides, so refusing then saves nobody anything, and generating first also spends that cost on a pad about to be declined. Consent is recorded per contact so the pad's later arrival needs no second decision; a pad arriving with no prior consent still raises a decision popup, as a safety net for an unsolicited one. A cancel abandons any promise still waiting on the peer's answer, so a late acceptance cannot start generating a pad the user has already cancelled."
evidence = "src/crypto/otp.rs OtpSessionRequestPayload.pad_size_mb; src/client/otp.rs send_session_request, confirm_generate, begin_promised_generation, on_session_request, accept_invite's fresh-pad consent branch, on_key_setup_ack's promised-generation arm, cancel_pad; src/client/session.rs SessionState.otp_awaiting_consent, otp_consented"

[[user_story.acceptance_criteria]]
id = "AC-254"
description = "A pad that cannot fit on disk is refused before generation starts, not discovered partway through it. otp --new-key-pair writes four files of the chosen size (both halves into both correspondents' key directories), so a pad costs four times its per-key size - a 2000MB pad is 8GB - and the check is made against the filesystem holding the keychain before the tool is spawned. The refusal names what was needed and what was available. Where free space cannot be determined the check fails open and generation proceeds: an unmeasurable filesystem is not a reason to refuse work that would have succeeded. The sending side's transfer bar reports bytes the link has actually drained (bytes read off disk minus what the link is still carrying), never bytes read - a bar drawn from disk reads reaches 100% while the peer is still near zero and then sits there for the whole real transfer, which is worse than showing nothing. The pad worker's in-flight bound is derived from p2p::PENDING_MAX rather than chosen independently: outbound_depth saturates at PENDING_MAX while a link is not yet Active, so a bound above it can never be reached, leaving the worker unthrottled and feeding a queue that discards its oldest entry - which destroys the front of the transfer rather than merely delaying it."
evidence = "src/client/otp_cli.rs free_space_bytes, keygen_disk_bytes; src/client/otp.rs confirm_generate's pre-flight check, human_bytes, refresh_pad_send_progress; src/client/otp_pad.rs PAD_INFLIGHT_FRAMES, OutgoingPad.read_bytes; src/client/session.rs the ticker's pad depth/progress republish; tests a_pads_disk_cost_is_four_times_its_per_key_size, free_space_is_reported_for_a_real_directory_and_absent_for_a_missing_one, the_inflight_bound_stays_under_what_the_link_queue_can_hold"

[[user_story.acceptance_criteria]]
id = "AC-253"
description = "Provisioning a pad has two slow phases, and the user watches both. Generation shows a spinner and a bar against the randomness it must read; when that finishes the same popup switches to the transfer rather than closing, with its own bar starting at zero against both halves of the pad (both cross the link, so the total is twice the per-key size). The receiving side opens the same popup as the pad starts arriving. This matters because the peer cannot be asked to accept until the whole pad has arrived and both sides agree the digests match (the two-phase commit), so without it the gap between generation ending and the invitation appearing - the entire transfer, minutes on a large pad - showed nothing at all on either screen and read as a failed handshake. Both bar and popup are per peer: a report for one contact never moves another's bar, a stale transfer ending never closes a popup that has moved on, and a late generation report cannot rewind a transfer bar it knows nothing about. Provisioning is no longer capped at 16MB per key: that ceiling was derived from how many chunks the link's queue held, which the streamed, disk-backed, self-pacing transport made irrelevant; what remains is a time estimate rather than a refusal."
evidence = "src/client/tui/ui.rs OtpPadPhase, OtpKeygenProgress.phase, begin_otp_pad_transfer, set_otp_pad_transfer_progress, close_otp_keygen_for, set_otp_keygen_progress's phase guard, render_otp_keygen_popup; src/client/otp_pad.rs PadEvent::SendProgress, PAD_PROGRESS_BYTES, PAD_CHUNK_BYTES, IncomingPad.received_bytes; src/client/otp.rs start_pad_send, on_pad_start, on_pad_chunk, on_pad_event, on_pad_verify, transfer_estimate; src/client/p2p_reliable.rs SEND_WINDOW, REORDER_BUFFER_LIMIT; tests the_popup_moves_from_generating_to_transferring_rather_than_closing, the_receiving_side_sees_its_own_transfer_progress, a_transfer_popup_only_answers_to_the_peer_it_is_reporting_on, a_late_generation_report_cannot_rewind_the_transfer_bar, a_pad_chunk_fits_one_unfragmented_datagram, reorder_buffer_bound_fails_the_link_rather_than_growing_unbounded"

[[user_story.acceptance_criteria]]
id = "AC-259"
description = "A pair who reach each other peer-to-peer and hold a one-time pad for each other can talk with no pq_hybrid identity of each other at all - the case with no server, a server that never introduced them, or one that has gone away. Neither side is gated on a keybundle: the pin is taken as it is, and whether it decodes only decides the framing (AC-082). Registration is what a keybundle would otherwise have bought, and the pad stands in for it on both sides. A link coming up to a peer whose pin does not decode registers them if a provisioned pad exists for the pair, and marks OTP active immediately - there is nothing left to negotiate, so /otp opens no round trip and the very first message rides the pad. An inbound pad-wrapped payload from a peer nobody introduced resolves the sender from the link's own nickname and this client's pin for it - never from anything the sender claims - and registers them only once otp --decrypt has actually opened something, which is what proves the claim. Registering is all either path does: it spends no pad, and the acknowledgement gate bounds an impostor taking the nickname to a single message (AC-250)."
evidence = "docs/PROTOCOL.md 7.1.5, 16.2; src/client/session.rs direct_peer_identity, register_pad_only_peer; src/client/otp.rs otp_sender_of, adopt_pad_verified_sender, handle_otp_command's Direct arm; tests a_serverless_pad_only_pair_registers_and_talks_without_any_pq_hybrid_identity, an_unreadable_key_on_either_side_means_direct_framing; scenario features/encryption/message_encryption.feature 'Two peers with a pad and no keybundles talk anyway'"

[[user_story.acceptance_criteria]]
id = "AC-260"
description = "Every OTP payload is layered the same way: the pad goes on the payload, and the pq_hybrid seal - where the pair has one - goes around the pad. seal(pad(payload)) under pqhybrid_otp, pad(payload) under direct_otp, for text, a file offer, a voice offer, and the /endotp notice and its ack alike; a file's and a voice message's content already worked this way, padded whole and sealed per chunk. Inverting the old pad-outside order matters twice over: a sealed envelope is ~6.4KB of ML-DSA/ML-KEM/RSA regardless of the message, so a short chat line used to spend about thirty-five times its own length of an irreplaceable pad, and a forgery now fails on the signature before a single pad byte is touched instead of after. What it costs is that the seal's binding becomes the outermost layer and would otherwise be readable, so nothing identifying is left in it: the room travels under the pad (an OtpInner header, checked after unwrapping, which is also the only place a Direct pair can carry it), and the recipient's fingerprint is signed but transmitted zeroed, with the recipient substituting their own back before verifying - the signatures, not the plaintext comparison, are what refuse a send bound to somebody else. send_id stays readable because it nonces the chunk. The /endotp notice is an ordinary stop-and-wait send in every mechanical respect - it arms the gate, is confirmed by the same proof-carrying OtpDeliveryAck every message earns, and a repeat of it is answered from the durable (seq, proof) record its acceptance left, never by spending more pad (AC-304); only the unpadded sealed fallback, for a pair whose pad is no longer usable, keeps the legacy sealed OtpEndSessionAck reply. The two provisioning payloads - OtpSessionRequest and OtpKeySetupAck - are deliberately not padded: they are what decides whether a usable pad exists at all, and the side receiving a setup ack has not yet committed the key it would need to open one."
evidence = "docs/PROTOCOL.md 16.2, 16.6; src/crypto/pq.rs seal_send_blinded, open_send_blinded; src/client/envelope.rs encrypt_blinded_envelope_for; src/client/session.rs decrypt_own_blinded_envelope; src/client/otp.rs OtpInner, build_otp_envelope, open_otp_envelope, frame_padded, send_end_notice_now, send_sealed_end_session_ack, apply_end_session, apply_end_session_ack, on_message's content dispatch; tests text_both_pq_hybrid_wraps_an_envelope_and_still_proves_its_ack, text_no_pq_hybrid_anywhere_uses_direct_and_still_proves_its_ack, end_session_both_pq_hybrid_travels_under_the_pad, end_session_no_pq_hybrid_anywhere_still_reaches_the_peer; scenarios features/encryption/message_encryption.feature 'The pad goes on the message and the seal goes around the pad', 'The outermost layer names neither its recipient nor its room', 'Ending a session travels under the pad it is ending'"

[[user_story.acceptance_criteria]]
id = "AC-252"
description = "Pure-OTP mode is reachable by every kind of send, not merely startable. Once /otp has provisioned a pair whose framing is Direct - one side announced no readable keybundle - a text, file or voice send must find that contact and use it: the contact is named the same way on both sides (from pq fingerprints under PqWrapped, from the two pinned public keys under Direct), a session's own pinned key is its encoded bundle, a stream-shaped send frames its offer by the pair's actual OtpFraming rather than assuming an envelope can be built, and its content chunks carry the pad ciphertext verbatim rather than being sealed to a keybundle the pair does not have - the content was already encrypted whole before the first chunk left, so the pad is the protection and the otp command's own decrypt verdict is the authentication. Anything less fails in the worst possible way: a session both ends display as active, with the shield prefix and the live key header, while messages either leave without the pad or are silently dropped. Mail is the one deliberate exception - it is acknowledged by a server that holds no pad, so its sender binding is an ML-DSA signature and a pure-OTP pair is refused outright rather than falling back to something weaker."
evidence = "src/client/otp.rs OtpFraming, framing_for, contact_name_for_peer, offer_envelope, send_now, otp_stream_key, otp_incoming_stream_key, send_file_offer, send_voice_offer, on_voice_offer, direct_voice_offer; src/client/voice_stream.rs DirectStreamKey::Pad, IncomingStreamKey::Pad, encrypt_direct_chunk; src/client/session.rs otp_own_pinned_der in both session constructors, the OTP arm of handle_accept_file_offer; src/client/otp_mail.rs check_recipient; tests text_the_mixed_pairing_is_symmetric, text_one_pq_hybrid_side_falls_to_direct_and_still_proves_its_ack, text_no_pq_hybrid_anywhere_uses_direct_and_still_proves_its_ack, file_one_pq_hybrid_side_proves_both_of_its_spends, file_no_pq_hybrid_anywhere_proves_both_of_its_spends, voice_one_pq_hybrid_side_proves_its_spend, voice_no_pq_hybrid_anywhere_proves_its_spend, mail_refuses_a_pure_otp_pair_rather_than_falling_back"

[[user_story.acceptance_criteria]]
id = "AC-250"
description = "Every acknowledgement that reopens the OTP send gate must prove the peer actually decrypted the message it names, not merely that it saw the packet. Each pad spend buries a fresh 16-byte nonce in front of its plaintext and the peer's OtpDeliveryAck carries sha256 of that nonce; an ack whose proof does not match what was recorded for the outstanding sequence leaves the gate closed and the message outstanding, exactly as if no ack had arrived. The nonce itself is never echoed - returning it in the clear would expose 16 bytes of known plaintext against known ciphertext, i.e. 16 bytes of recovered key - and the proof costs the receiver no pad at all, since an acknowledgement that spent pad would itself be a message needing one. The two spends that carry the user's bytes verbatim (a file's content phase and a voice message) have nowhere to bury a nonce and use the plaintext's own sha256 instead, which proves the same thing. The expectation is persisted alongside the gate it guards, so an ack arriving after a restart is still checkable; a record carrying no expectation (an OTP mail, acknowledged by the server rather than the peer, or a store written before this check existed) still clears normally rather than wedging the contact forever. The practical bound this creates: a peer holding a stolen identity key but not the pad extracts exactly one message before the gate closes for good, and even that one stays recoverable for the genuine contact (AC-147)."
evidence = "src/crypto/otp.rs ACK_NONCE_BYTES, AckProof, ack_proof_for, ack_proof_for_file; src/client/otp.rs wrap_outgoing, unwrap_incoming, UnwrapOutcome, send_now, send_file_offer, send_voice_offer, start_outgoing_file_content, on_message, on_file_offer, finish_incoming_file, on_delivery_ack; src/client/otp_store.rs OtpContactState.pending_ack_proof, record_sent, record_acked; src/p2p_proto.rs OtpDeliveryAck; docs/PROTOCOL.md 16.2; docs/SPEC.md 'Proving an acknowledgement, without spending pad to do it'; tests record_acked_refuses_an_ack_that_cannot_name_the_message, record_acked_still_clears_a_message_that_recorded_no_expectation, a_pending_ack_proof_survives_save_and_load, a_peer_without_the_pad_cannot_unblock_a_second_message, proving_one_contact_does_not_unblock_a_different_one, a_whole_file_spend_proves_itself_with_the_plaintexts_digest, direct_framing_carries_the_nonce_and_yields_the_senders_proof, two_messages_under_one_pad_have_different_proofs, a_refused_message_produces_no_proof_to_acknowledge_it_with, a_recovered_resend_still_proves_itself_with_the_original_nonce, an_acknowledgement_that_proves_itself_opens_the_gate_and_the_arrow, an_acknowledgement_that_cannot_prove_itself_changes_nothing, an_acknowledgement_for_a_different_sequence_does_not_open_this_gate, a_queued_message_is_released_only_by_an_ack_that_proves_itself, each_direction_keeps_its_own_gate, text_both_pq_hybrid_wraps_an_envelope_and_still_proves_its_ack, text_one_pq_hybrid_side_falls_to_direct_and_still_proves_its_ack, text_no_pq_hybrid_anywhere_uses_direct_and_still_proves_its_ack, text_the_mixed_pairing_is_symmetric, file_both_pq_hybrid_proves_both_of_its_spends, voice_both_pq_hybrid_proves_its_spend, file_one_pq_hybrid_side_proves_both_of_its_spends, file_no_pq_hybrid_anywhere_proves_both_of_its_spends, voice_one_pq_hybrid_side_proves_its_spend, voice_no_pq_hybrid_anywhere_proves_its_spend; message_encryption.feature"

[[user_story.acceptance_criteria]]
id = "AC-251"
description = "A message sent under the pad reports its delivery state - the row's -> arrow colour and the details popup's DELIVERED/UNDELIVERED label - from the pad's own proof-carrying OtpDeliveryAck (AC-250), never from an ordinary DeliveryReceipt. A receipt is an unsigned payload naming a msg_id with nothing binding it to the message's content, so on a pad-protected leg it is ignored for that purpose and the arrow stays gray until the verified ack arrives; a message that is not pad-protected is unaffected and still answers to its receipt exactly as before (AC-232/AC-236). Because consuming ordinarily implies decrypting, a Consumed receipt would otherwise be a back door into the same claim, so on a pad-protected leg it only ever records what the pad ack has already established - once that ack has landed, a later replay or save receipt reads normally again. The distinction is tracked per recipient rather than per row, since one channel send can reach some members under a pad and others not. The receiving side sends no redundant Decrypted receipt for a pad-wrapped text message at all: it would say exactly what the ack says, unprovenly, and the sender's row would discard it."
evidence = "src/client/tui/ui.rs DeliveryProof, DeliveryRecipient.awaits_pad_ack, mark_delivered, mark_awaiting_pad_ack; src/client/otp.rs send_now, send_file_offer, send_voice_offer, start_outgoing_file_content, on_message, on_delivery_ack; src/client/session.rs SessionState.otp_ack_rows, handle_p2p_event's Delivered arm; docs/PROTOCOL.md 7.2.1, 16.2; tests a_pad_protected_row_ignores_a_plain_receipt_and_waits_for_the_pad_ack, a_row_that_never_went_under_the_pad_still_answers_to_its_receipt, a_consumed_receipt_cannot_turn_a_pad_protected_row_green_on_its_own, text_both_pq_hybrid_wraps_an_envelope_and_still_proves_its_ack, text_no_pq_hybrid_anywhere_uses_direct_and_still_proves_its_ack"

[[user_story.acceptance_criteria]]
id = "AC-304"
description = "A resend of a message this side already accepted (an OtpDeliveryAck it sent was lost, so the peer's own single-outstanding-send gate is still waiting) is never met with silence: text, a file offer, and a voice offer all re-send the exact same recorded ack for their exact seq rather than dropping it, since nothing else would ever unstick that gate. Only the single most recently accepted message per contact can legitimately reappear this way - a genuinely stale replay older than that is still dropped in silence exactly as before, and the resend never re-decrypts anything or spends any further pad, matching AC-260's existing precedent for a repeated /endotp notice."
evidence = "docs/PROTOCOL.md 16.2; src/client/otp_store.rs OtpContactState.last_received_ack, record_last_received_ack, ack_to_resend; src/client/otp.rs on_message's duplicate branch, apply_otp_message's Content::Text arm, on_file_offer, on_voice_offer; tests a_duplicate_text_message_re_acks_the_same_proof_without_reprocessing, a_duplicate_file_offer_re_acks_the_same_proof_without_reprocessing, a_stale_replay_older_than_the_last_received_message_is_still_silently_dropped (otp_ack_wiring_test.rs), ack_to_resend_answers_only_the_exact_last_acked_sequence, record_last_received_ack_overwrites_rather_than_accumulates, last_received_ack_survives_save_and_load, a_line_written_before_last_received_ack_existed_still_loads (otp_store_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-307"
description = "The /endotp notice is an ordinary stop-and-wait send (`PendingOtpContent::EndNotice`): it arms the gate, is confirmed by the peer's proof-carrying OtpDeliveryAck (which also settles the durable pending_end_notice retry debt), and while unacknowledged is retried by recovering the exact ciphertext /endotp produced - via the same `recover_and_resend` pass every unacknowledged spend takes on reconnect - never by encrypting a second one. Re-encrypting on retry would spend a second, later range of the pad for a message the peer's decoder was never told to expect (the first ciphertext never reached them at all if they were offline), desyncing the two sides' offsets and making the retry itself fail to decrypt with a 'no valid metadata' offset-mismatch error - exactly what a peer who was offline when /endotp ran used to see the moment they reconnected. The on-reconnect notice pass (`resend_pending_end_notices`) never touches a contact whose gate is armed, precisely so it can never race the recovery pass into a double-spend. Net effect: a peer who was offline for /endotp sees the session end immediately on their next reconnect."
evidence = "docs/PROTOCOL.md 16.6; src/client/otp.rs send_end_notice_now, recover_and_resend_envelope, resend_pending_end_notices, on_delivery_ack's acked_end_notice settlement; src/client/otp_store.rs PendingOtpContent::EndNotice; tests a_pending_end_notice_after_an_offline_endotp_recovers_rather_than_re_encrypts, end_session_both_pq_hybrid_travels_under_the_pad, end_session_no_pq_hybrid_anywhere_still_reaches_the_peer (otp_ack_wiring_test.rs), an_end_notice_pending_send_round_trips_through_save_and_load (otp_store_test.rs); scenario message_encryption.feature 'An unconfirmed end notice is recovered on reconnect, never re-encrypted'"

[[user_story.acceptance_criteria]]
id = "AC-308"
description = "/endotp with a send still awaiting acknowledgement defers the notice rather than spending pad past it: the in-flight message keeps its place on the pad and its `--recover-last` safety copy (the `otp` tool keeps exactly one per contact - encrypting the notice would overwrite it, destroying the only way that message could ever be resent), the pause keeps the message's gate state intact, and the notice - recorded durably as owed - goes out as the gate's next occupant the moment the message's genuine ack arrives, on that link or any later reconnect. The user's own side still ends immediately. A peer who received the message but whose ack was lost converges through AC-304's recorded re-ack; a second /endotp while the notice is still owed is refused with 'already ended', spending nothing."
evidence = "docs/PROTOCOL.md 16.6; src/client/otp.rs handle_end_otp_command's deferral and already-ended guard, on_delivery_ack's owes_notice hook; src/client/otp_store.rs pause_session, pause_after_peer_ended (both keep the in-flight send); tests endotp_with_an_unacked_message_defers_the_notice_behind_it, a_deferred_notice_converges_even_when_only_the_messages_ack_was_lost, a_second_endotp_while_the_notice_is_still_owed_spends_nothing_more (otp_ack_wiring_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-309"
description = "Installing a genuinely new pad over an existing contact name - the two-phase network commit on either side, or a manual /contacts install - resets every aloo-level counter and remnant keyed to the old pad along with it: both sequence counters back to 0, the in-flight gate, the last-received-ack record, and any owed end notice. The `otp` tool's own per-contact state (sequences, offsets, the recover-last copy) resets wholesale with `--add-contact`, so keeping any aloo-side state was what left a replaced pad born desynced: stale counters silently dropped the new pad's every message, and a stale recorded proof could answer a new pad's sequence with the old pad's ack. Adopting an existing keychain entry, or resuming a paused session, resets nothing - those continue the same pad."
evidence = "src/client/otp_store.rs OtpStore::reset_for_new_pad; src/client/otp.rs on_pad_commit's install branch, on_pad_verify's commit branch; src/client/contacts.rs install_otp_key; tests reset_for_new_pad_zeroes_every_counter_and_remnant_of_the_old_pad (otp_store_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-311"
description = "A fresh pad's OtpPadCommit - the one provisioning payload whose loss splits the pair asymmetrically (the generator installed and active, the peer holding only staged bytes it was never authorised to install) - is owed durably against the contact name from the moment the generator installs its half, re-sent on every reconnect (`resend_pending_commits`, alongside the other three link-Active retry passes), and settled only by the peer's OtpPadCommitAck. The receiving side answers a repeated commit idempotently, finding its staged pad by the durable contact name the commit itself carries rather than by the sender's connection-lifetime UserId - so a commit retried across a reconnect still finds staging left behind under the dead id."
evidence = "docs/PROTOCOL.md 16.1; src/client/otp_store.rs OtpContactState.pending_commit, mark_commit_owed, clear_commit_owed, pending_commits; src/client/otp.rs resend_pending_commits, on_pad_commit_ack, on_pad_verify's mark_commit_owed, on_pad_commit's contact-name staging lookup; src/client/session.rs the link-Active handler's resend_pending_commits call; tests a_pending_commit_survives_save_and_load_and_clears_exactly_once (otp_store_test.rs), an_unconfirmed_pad_commit_is_resent_on_reconnect_until_acked (otp_provisioning_concurrency_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-312"
description = "A receiver killed in the window between `otp --decrypt` succeeding and the acceptance being persisted heals in place rather than desyncing: the sender's retry of that exact ciphertext is refused by the tool (its decrypt counter already moved), but the refusal is recognised as the crash shape by its precise signature - the tool's decrypt counter exactly one past the store's accepted count, the two advancing 1:1 from 0 with at most one orphan possible under stop-and-wait - and the orphaned plaintext, nonce included, is recovered whole from the tool's own received-side safety copy (--recover-last --received) and processed as if the decrypt had just happened: delivered, accepted, and acknowledged with its true proof, reopening the sender's gate normally. Anything not matching that exact shape is a genuine rejection and reported as one, keys untouched."
evidence = "docs/PROTOCOL.md 16.2; src/client/otp.rs recover_orphaned_decrypt, finish_opening_otp_envelope's Rejected arm; test a_decrypt_orphaned_by_a_crash_is_healed_from_the_tools_safety_copy (otp_ack_wiring_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-313"
description = "A sender killed in the window between `otp --encrypt` succeeding and the spend being recorded heals at the next startup rather than poisoning the pair: every spend writes ahead what it is about to be (`OtpContactState::encrypt_intent` - the content kind and its framing metadata, saved before the encrypt runs, retired by the `record_sent` that finalises it, and doubling as a same-process guard so a second send queues behind a mid-flight encrypt instead of racing the tool). An intent surviving into a new run is reconciled against the tool's own encrypt counter: still equal to the store's send count and nothing was spent - the intent is dropped, the message was simply never sent; one ahead and the spend is real but unrecorded - it is promoted to an ordinary recorded send (proof None, which record_acked tolerates) that the standard recovery machinery resends under the framing the intent announced, a mail spend additionally getting its retry reference rebuilt from the pinned identities. Any other shape drops the intent and touches nothing."
evidence = "src/client/otp_store.rs OtpContactState.encrypt_intent, set_encrypt_intent, clear_encrypt_intent, encrypt_in_flight, encrypt_intents, record_sent's retire; src/client/otp.rs reconcile_orphaned_sends, the intent writes in send_now/send_file_offer/send_voice_offer/start_outgoing_file_content/send_end_notice_now, send_or_queue's in-flight guard; src/client/otp_mail.rs the mail intent write, restore_orphaned_mail_ref; src/client/session.rs the startup reconcile call; tests a_spend_orphaned_by_a_crash_is_promoted_from_its_write_ahead_intent, an_intent_whose_encrypt_never_ran_is_dropped_not_promoted (otp_ack_wiring_test.rs), an_encrypt_intent_round_trips_and_record_sent_retires_it (otp_store_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-314"
description = "A file's or voice message's *content* spend behaves like every other occupant of the single shared sequence space, in all three lives it can have. Consumed normally: `finish_incoming_file` advances the receiver's expectation and records the durable (seq, proof) alongside its acknowledgement - without which the sender's very next message was silently dropped as out-of-order, wedging the pair for good. Retried with the slot already consumed (the ack was lost): the retried `OtpFileContentSeq` is re-answered from that record at no cost, like any other repeated spend. Retried against a receiver who restarted after accepting (the in-memory registration died with the process): the announcement alone re-registers the transfer generically (`OtpIncomingKind::Recovered`) - the bytes land under the OTP working directory and are named in a notice, the spend is acknowledged, and the pads stay in lockstep; only what the content was (filename, destination, voice duration) is beyond recovering."
evidence = "docs/PROTOCOL.md 16.2; src/client/otp.rs finish_incoming_file's record_received/record_last_received_ack, on_content_seq; src/client/file_transfer.rs OtpIncomingKind::Recovered; src/client/session.rs the OtpFileContentSeq delegation; tests file_round_trip's follow-up-text and retried-announcement assertions (file_both_pq_hybrid_proves_both_of_its_spends and siblings), a_content_transfer_is_re_registered_from_its_retry_after_a_restart (otp_ack_wiring_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-315"
description = "An /endotp notice whose spend is already fully recorded (record_sent completed, saved to disk) survives the initiating side's own process restart before the peer ever confirms - not merely a network blip continuing the same in-memory session, but otp_store genuinely dropped and reloaded from the same file, exactly as a real startup does. Reconciliation finds nothing to heal (the encrypt fully completed before the restart, so there is no orphaned write-ahead intent), the reload is a pure continuation of the same durable state, and the reconnect retry still recovers and delivers the exact same ciphertext - never re-encrypting - to a peer whose own decoder is still exactly where it was left, decrypting cleanly."
evidence = "docs/PROTOCOL.md 16.6; src/client/otp_store.rs OtpStore::path (exposed for the restart simulation); src/client/otp.rs reconcile_orphaned_sends, recover_and_resend, resend_pending_end_notices; test an_end_notice_survives_the_initiators_own_process_restart (otp_ack_wiring_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-316"
description = "A file or voice send's *content* phase - staged as plaintext the instant its offer safely leaves (send_file_offer/send_voice_offer), but not itself encrypted until the peer's FileAccepted arrives - survives the sender's own process restart in that exact window, whether the restart happens before FileAccepted is ever seen or after an old process already saw it and died before acting. The staging (contact name and plaintext path) is persisted the moment the offer is sent, not left to the in-memory own_file_targets map alone; on the next reconnect, resume_pending_content_sends resolves the peer fresh and re-enters the same accept-handling path a live FileAccepted would (begin_file_content), so a peer who already accepted before this side ever noticed needs to do nothing at all. No pad is ever at risk either way - the content's own spend only ever happens after this resolves - and a resumed attempt racing a genuinely re-delivered FileAccepted for the same stream is never queued twice."
evidence = "docs/PROTOCOL.md 16.2; src/client/otp_store.rs OtpStore::PendingContentSend, stage_content_send, take_content_send, content_sends (persisted to a sibling file, tolerant of one predating the feature); src/client/otp.rs begin_file_content, resume_pending_content_sends, start_outgoing_file_content's take_content_send call and has_queued_stream guard, send_file_offer/send_voice_offer's stage_content_send call; src/client/session.rs FileAccepted delegating to begin_file_content, the LinkStatusChanged handler's resume_pending_content_sends call; tests a_staged_content_send_survives_save_and_load_in_its_own_sibling_file, taking_a_staged_content_send_clears_it_and_reports_absence_afterward, a_store_with_no_pending_content_sibling_file_loads_with_nothing_staged (otp_store_test.rs), a_voice_recording_survives_the_senders_own_restart_while_awaiting_accept, otp_out_queue_never_double_queues_the_same_streams_content (otp_ack_wiring_test.rs); scenario message_encryption.feature 'A voice recording survives the sender's own restart while awaiting acceptance'"

[[user_story.acceptance_criteria]]
id = "AC-374"
description = "A fresh pad's OtpPadCommit install failing on the receiving side - the local `otp` binary unreachable, a full disk, or any other install error - never deletes the staged pad or acknowledges a commit it did not actually honor. The staged bytes and the commit's map entry are left exactly as they were, and nothing is sent back, so the sender's durable retry (AC-311's `resend_pending_commits`, on every reconnect) finds the same genuinely usable staged pad and tries the install again once the underlying failure clears - the same self-healing an idempotent repeat commit already gets, now honestly extended to a repeat that has never actually succeeded once. Before this, an unconditional delete on failure left the next retried commit finding nothing staged, which the idempotent-repeat branch (meant for a commit already installed) then falsely acknowledged - so the peer never got another chance, and the sender's belief that the exchange fully succeeded (it marks its own side live from the moment its own half installs, AC-311, well before hearing back at all) diverged permanently from a receiver holding nothing for that contact."
evidence = "docs/PROTOCOL.md 16.1; src/client/otp.rs on_pad_commit's borrow-then-install-then-remove ordering; src/client/session.rs SessionState::stage_incoming_pad_for_test, has_staged_incoming_pad_for_test, set_otp_binary_path_for_test, otp_cli_cfg_for_test; tests a_failed_install_keeps_the_staged_pad_and_sends_no_ack, a_retried_commit_after_the_binary_recovers_installs_for_real (otp_pad_commit_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-375"
description = "A message that fails to decrypt for any reason other than otp's own metadata rejection (AC-312's Rejected path) - the contact never actually installed on this side's keychain, the otp binary unreachable, or any other error unwrap_incoming's decrypt call surfaces - is never silently dropped. It produces the same kind of visible notice a metadata rejection already does, naming who it was from and what went wrong, so a receive that fails for this reason is never indistinguishable from a message that simply never arrived at all - exactly the shape a real remote failure report traced back to (both users' key exchange appeared to succeed, but every message the sender then sent failed to decrypt on the other side with nothing shown for it)."
evidence = "src/client/otp.rs UnwrapOutcome::Failed(String), unwrap_incoming's exhaustive match over OtpCliOutcome/io::Error, finish_opening_otp_envelope's Failed arm; test a_message_for_a_contact_never_installed_produces_a_visible_notice_not_silence (otp_ack_wiring_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-376"
description = "/otp, /new-otp-mail-key, and /mail all refuse locally, before touching the network or opening any popup, when the local otp binary is not available - checked fresh every time rather than cached, so a binary installed or removed mid-session is reflected immediately. /otp and /new-otp-mail-key already refused this way through handle_provisioning_command's own binary_available check; /mail's compose view used to open unconditionally, deferring the same failure to send time (or, for a mail whose recipient check never ran, past it silently) - it is now gated by the identical check before UiState::open_otp_mail is ever reached, via a dedicated RequestOpenOtpMail action the session answers rather than the UI layer deciding for itself."
evidence = "src/client/otp.rs handle_provisioning_command's otp_cli::binary_available check; src/client/otp_mail.rs handle_open_otp_mail; src/client/tui/ui.rs UiAction::RequestOpenOtpMail, submit_input's /mail arm; src/client/session.rs handle_ui_action's RequestOpenOtpMail arm; tests otp_is_refused_locally_without_the_binary, new_otp_mail_key_is_refused_locally_without_the_binary, new_otp_mail_key_reaches_the_next_guard_when_the_binary_is_available, mail_compose_is_refused_locally_without_the_binary, mail_compose_opens_when_the_binary_is_available (otp_binary_guard_test.rs); scenarios otp_mail.feature 'The /mail command refuses to open without the local otp binary', 'The /mail command opens a full-screen mail compose view'"

[[user_story.acceptance_criteria]]
id = "AC-377"
description = "A DM text row's logged encryption scheme always matches what the send actually performed, even when a session starts or ends in the gap between the row being logged (push_outgoing_dm, on the UI thread, at submit time, reading is_otp_active at that exact instant) and the send being genuinely processed (the session task, once the queued action reaches it, re-checking is_otp_active independently via contact_name_for_sending). That gap is bounded by however long it takes the peer's confirmation to round-trip back - near-zero on loopback, real network RTT remotely - so the same race is far easier to hit over a real connection than in a local test. Both send paths correct the row to the scheme genuinely used the moment they decide it: the otp path (send_now) restamps it to the pad spend about to happen, and the plain-envelope fallback restamps it to an ordinary envelope, so a row can never go on claiming a pad spend that never happened, or the reverse."
evidence = "src/client/tui/direct_message.rs UiState::set_dm_message_crypto; src/client/otp.rs send_now's pre-spend restamp; src/client/direct_message.rs handle_send_text's plain-envelope restamp; tests a_message_logged_before_the_session_activates_is_corrected_to_otp_once_actually_sent, a_message_logged_while_active_is_corrected_to_plain_once_the_session_has_ended (otp_ack_wiring_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-378"
description = "Two people running /otp with each other closely enough together that neither side's proposal has arrived when the other sends its own - an ordinary thing for two real people to do, and one a real network's latency makes far easier to hit than a loopback test - resolves to exactly one survivor, deterministically, before either side has generated or streamed a single byte of a fresh pad. `on_session_request` checks whether this side already has its own fresh-pad proposal awaiting the peer's answer for the same contact (`otp_awaiting_consent`); if so, the numerically smaller identity fingerprint wins (`own_pad_wins_glare`, the same deterministic tie-break the small-inline-key path already used for a pad small enough to send in one message) - the losing side's own proposal is withdrawn and it sees the winner's proposal as an ordinary invite, while the winning side never even shows the loser's proposal as a decision to make. Before this, the streamed-pad path (what any real, human-chosen pad size actually uses) had no glare resolution at all: both sides could independently generate and stream their own pad to the other, and each could independently commit the peer's pad under the same contact name - leaving each side's keychain holding a genuinely different pad for what both believe is the one shared contact, so every message either side sent afterward would fail to decrypt on the other, permanently, with no way out but /endotp and a fresh /otp."
evidence = "src/client/otp.rs on_session_request's glare check, on_key_setup_ack's otp_awaiting_consent cleanup on any refusal; src/client/session.rs SessionState::has_awaiting_otp_consent_for_test, pq_peer_keys_mut; tests simultaneous_first_time_proposals_resolve_to_exactly_one_survivor, the_losers_refusal_ack_is_handled_cleanly_after_the_early_withdrawal (otp_pad_glare_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-379"
description = "A manual key install from /contacts is refused outright - before it ever touches the keychain - while this exact contact name has a negotiation genuinely in flight: this side's own fresh-pad proposal still awaiting the peer's answer (otp_awaiting_consent), or the peer's own proposal to us sitting unanswered as an open invite popup. otp --add-contact itself refuses once either side has actually installed something under a name, so this race could never corrupt a pad in place - but letting a manual install win it turns the negotiated side's own eventual install into a permanent, unexplained failure, or (for the streamed-pad path's retry-safety, AC-374) an endless retry against a conflict that can never resolve itself, since nothing ever removes a manually-installed contact on its own. Refused locally instead, the same way a second /otp is refused while one is already in flight - scoped to an exact contact-name match, so an unrelated contact's install is never blocked by it."
evidence = "src/client/contacts.rs handle_install_otp_key's otp_awaiting_consent/otp_invite_open guard; src/client/session.rs SessionState::id_store_ref, stage_awaiting_otp_consent_for_test; tests a_manual_install_is_refused_while_our_own_proposal_is_awaiting_consent, a_manual_install_is_refused_while_the_peers_invite_is_open, a_manual_install_for_a_different_contact_is_unaffected (otp_install_race_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-380"
description = "A message that cannot be decrypted because the receiving side genuinely has no keychain entry for that contact any more (deleted, or otherwise gone) ends the session on the receiving side immediately - paused locally exactly as an incoming /endotp would, since nothing about the durable per-contact state (sequences, the last-received-ack record, any owed end notice) means anything once the keychain entry it tracked is gone. The receiving side also tries to tell the sender directly with a real, sealed OtpEndSession notice, so both sides converge on ended rather than the sender being left to believe the session is alive while every message they send here keeps failing to decrypt, forever, with nothing on their side ever explaining why. That notice needs a readable pq_hybrid identity for the sender to seal to; a pad-only pair (OtpFraming::Direct, whose one and only shared secret was the very pad that is now gone) has no such channel and, by design, no server relay either - for that pairing only the receiving side converges, and the sender finds out only because her own sends here now go forever unacknowledged, exactly as an undelivered send to an unreachable peer already looked before this existed, not worse. A decrypt failure with the contact still genuinely present (a transient otp/disk/binary hiccup) must never trigger any of this - only a confirmed-missing contact does."
evidence = "src/client/otp.rs finish_opening_otp_envelope's has_contact check, end_session_for_missing_contact, try_notify_peer_session_ended, pause_session_locally (shared with apply_end_session); tests a_missing_contact_on_receipt_ends_the_session_on_both_sides, a_transient_decrypt_failure_with_the_contact_still_present_does_not_end_the_session (otp_ack_wiring_test.rs); scenarios message_encryption.feature 'A message decrypts normally while both sides still hold the key', 'A message the recipient can no longer decrypt ends his own side of the session'"

[[user_story.acceptance_criteria]]
id = "AC-381"
description = "Deleting an OTP key from /contacts - the live key alone, a whole device (cascading both purposes), or a whole contact (every device) - ends any session that key was backing, immediately: is_otp_active is cleared for the affected peer and a status notice announces it, not just the keychain entry and the durable otp_store record. Before this, none of the three deletion paths ever touched the in-memory active flag: the compose bar kept showing OTP as protecting the contact, every send still routed through the OTP path and failed at encrypt time against a keychain entry that no longer existed, /otp refused to restart ('already active - use /endotp first'), and /endotp itself did not help either - it checks otp_store, which the deletion had also already cleared, so it took the 'no active session' branch and returned without ever clearing the flag. Only a reconnect (re-deriving the flag from scratch) ever recovered. Scoped precisely: deleting a mail key never touches an unrelated live session (mail has no active toggle of its own at all), and deleting a key for a contact with nothing active shows no spurious ended notice."
evidence = "src/client/contacts.rs end_active_otp_session_after_key_removed, and its call from handle_delete_otp_key/handle_delete_contact_device/handle_delete; tests deleting_the_live_key_ends_an_active_session_and_clears_the_stuck_state, deleting_a_key_with_no_active_session_shows_no_ended_notice, deleting_the_mail_key_never_affects_an_active_live_session, deleting_the_whole_device_ends_its_active_session_too, deleting_the_whole_contact_ends_its_active_session_too (otp_delete_while_active_test.rs); scenarios message_encryption.feature 'Deleting a key with no active session shows no ended notice', 'Deleting an active session's own key ends it locally, not just the keychain'"

[[user_story.acceptance_criteria]]
id = "AC-382"
description = "Receiving a peer's end-of-session notice for a contact - a genuine /endotp, or the substitute notice end_session_for_missing_contact sends when it discovers this side's own contact is gone (AC-380) - also settles this side's own outstanding end-notice bookkeeping for that same contact, if any: pending_end_notice and the gate its own notice armed (pending_unacked_out_seq/pending_content/pending_ack_proof, only when what is actually pending is the end notice itself) are cleared right there, not left to a later /otp to clean up. Before this, a side that had also independently run its own /endotp on the same contact - most notably when the peer's substitute notice arrives instead of the OtpDeliveryAck/OtpEndSessionAck that side's own send was actually waiting for - stayed stuck believing an acknowledgement was still owed: every further send to that contact kept refusing with 'the session is ending', and a repeated /endotp kept saying 'already ending', even though the UI already showed the session had ended."
evidence = "src/client/otp_store.rs OtpContactState::pending_end_notice/pending_unacked_out_seq's doc, OtpStore::clear_own_pending_end_notice_send; src/client/otp.rs pause_session_locally (calls clear_end_notice and clear_own_pending_end_notice_send unconditionally); test a_substitute_end_notice_also_settles_this_sides_own_pending_end_notice (otp_ack_wiring_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-383"
description = "OTP mail survives a storage failure instead of giving up on it: when the server refuses to store an uploaded mail (OtpMailResult{ok: false}), the mail stays exactly AwaitingServerAck (never marked Failed) and the contact's stop-and-wait gate stays closed on that exact sequence number - clearing it used to be justified as 'the pad bytes are spent either way, so the contact must not wedge forever', but that let the next mail spend past the refused one, which the receiver's next_expected_in_seq could then never satisfy (only that exact ciphertext ever could, per the oldest-first rule), permanently and silently blocking every mail after it on the receiving side. Instead the mail is retried immediately with the exact same recovered ciphertext (never a fresh encode, so no extra pad is spent), and again on every later reconnect (resend_pending) if that attempt also fails - durable across a full process restart, since the state this relies on (OtpMailStore's persisted status, OtpStore's persisted gate) is disk-backed and resend_pending already runs at every fresh login, not only a live reconnect."
evidence = "src/client/otp_mail.rs on_mail_result's failure branch, resend_one (shared by on_mail_result and resend_pending); tests a_refused_storage_ack_leaves_the_mail_pending_and_the_gate_closed, a_refused_storage_ack_immediately_retries_the_exact_same_ciphertext (otp_mail_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-384"
description = "/new-otp-mail-key always proceeds to the fresh-generate confirmation, even when a mail key already exists for that contact - unlike /otp, which legitimately resumes an already-provisioned contact (that round trip is what turns a session back on after /endotp), mail has no session to resume, only a key that is either usable or isn't; a mail key running low is exactly the situation a user runs /new-otp-mail-key in, and refusing it outright left no way back except a manual /contacts delete first. The actual install step genuinely replaces the old key: commit_pending_setup (the proposing side's own half) and on_pad_commit (the accepting side's received half) both remove any existing contact under that name immediately before otp --add-contact, which otherwise refuses to overwrite one outright - the same mechanism also retroactively fixes an equivalent, previously-broken case for live sessions (one side deletes its own key and re-runs /otp; the peer's still-existing copy needed the same replace and used to fail forever against it). A pad-only (Direct-framed) mail contact still refuses unconditionally, regardless of whether a key already exists - there is no channel to share a freshly generated one over, so replacing it can only ever be done manually from /contacts, exactly like first provisioning it. Concurrent /new-otp-mail-key from both sides (or one side's mail key and the other's live key colliding for the identical peer) resolves through the same glare check (AC-378), keyed by contact_name regardless of purpose, with no separate mechanism needed."
