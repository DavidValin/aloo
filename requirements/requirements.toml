[[user_story.acceptance_criteria]]
id = "AC-363"
description = "A `MessageBody::VoiceOnDisk` row's audio is only ever read from disk the moment `Enter` replays that specific row - never up front. With a resolvable `wav_path`, `voice::decode_wav_to_mono` decodes it there, the row mutates into an ordinary `Voice { duration_ms, pcm }` in place (so a second replay of the same row is instant and it then participates in the ordinary listened/receipt machinery), and playback proceeds exactly like a `Voice` row that arrived live. With `wav_path: None` (the original autosave never wrote the `.wav`) or a file that no longer decodes, nothing plays and a status notice explains why instead of a silent no-op."
