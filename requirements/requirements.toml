[[user_story.acceptance_criteria]]
id = "AC-141"
description = "The top-right status notice clears on its own 30 seconds after it was pushed (STATUS_NOTICE_TIMEOUT, driven by the session ticker), so a stale outcome never squats on the corner of the screen. Every OTP error/confirmation shown there is also logged as a line in the relevant peer's own DM room, so the history of a session's setup (and any failure) isn't lost the moment that notice clears - marking the room unread exactly like any other DM arrival if it isn't the one currently open. While a mutual-consent OTP session is active with the DM's peer, every real message in that room (not the app's own system lines about the session itself) is shown with a shield prefix, so the user always knows which conversation is currently under the extra pad layer."
