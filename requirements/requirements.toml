# ============================================================================
# US-048 - Give OTP mail its own key, independent of live sessions
# ============================================================================
[[user_story]]
id = "US-048"
title = "Give OTP mail its own key, independent of live sessions"
as_a = "user who wants to send someone OTP mail"
i_want = "mail to use a keychain key entirely its own, separate from any live /otp session with the same person, and to be unable to write or send one until that key exists"
so_that = "a live session ending, never starting, or being spent down by ordinary chat has no bearing on whether I can still mail someone - and I always know which key protected which conversation"

[[user_story.acceptance_criteria]]
id = "AC-294"
description = "OTP mail always encrypts and decrypts with its own independent keychain entry (`crypto::otp::contact_name_for_mail`/`contact_name_for_keys_mail`, distinguished from a live session's name by a `mail-` prefix that can never collide with it), never a live `/otp` session's key - even when both exist for the same pair."
evidence = "docs/PROTOCOL.md 17.1; src/crypto/otp.rs contact_name_for_mail, contact_name_for_keys_mail, OtpPurpose; src/client/otp_mail.rs check_recipient (mail-send path), the mail-receive contact-name derivation; tests a_live_otp_key_alone_is_not_enough_to_send_mail, a_mail_key_installed_under_its_own_name_lets_mail_through, having_both_keys_still_resolves_to_the_mail_key_specifically (otp_mail_recipient_check_test.rs)"

[[user_story.technical_behavior]]
id = "TB-249"
description = "A mail-purpose contact name is derived by wrapping the same sort/truncate/hex-join `contact_name_for`/`contact_name_for_keys` already use for a live session, then prefixing the result with `mail-` - never a parallel reimplementation. Since a live contact name is always lowercase hex plus `-`, the `mail-` prefix can never collide with one, which is what lets every existing keychain-name-keyed structure (`OtpStore`, `pending_setup_dir`, every `otp_cli` call) isolate the two purposes for free, with no schema change and no new collision to defend against."
evidence = "src/crypto/otp.rs contact_name_for_mail, contact_name_for_keys_mail, OtpPurpose::of_contact_name; tests installing_a_mail_key_is_independent_of_the_live_key (contacts_test.rs)"

[[user_story.acceptance_criteria]]
