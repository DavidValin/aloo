[[user_story.acceptance_criteria]]
id = "AC-111"
description = "A pq_hybrid send - text, file offer, voice stream or file transfer - is sealed as one setup naming its recipient, its room and its send counter, plus the content in chunks under the key that setup authorises. A one-chunk send is the whole of a text message; a stream is the same construction with more chunks."
evidence = "docs/PROTOCOL.md; src/crypto/pq.rs seal_send, seal_setup, seal_chunk; pq_hybrid_sends.feature 'A sealed message reaches the person it was sealed for'; tests encrypt_then_decrypt_hybrid_round_trips, a_stream_of_chunks_opens_under_its_setups_key"

[[user_story.acceptance_criteria]]
id = "AC-112"
description = "A send names the identity it was sealed for, so a legitimate recipient cannot re-wrap it and pass it off as a message addressed to somebody else - the third party's own open fails closed rather than yielding a message they were never sent."
evidence = "docs/PROTOCOL.md; src/crypto/pq.rs SendBinding.recipient_fp, open_setup; pq_hybrid_sends.feature 'A message sealed for someone else is refused'; tests a_send_sealed_for_one_recipient_does_not_open_for_another, open_setup_rejects_a_setup_sealed_for_someone_else"

[[user_story.acceptance_criteria]]
id = "AC-113"
description = "A send is bound to the room it belongs to: a private message replayed into a channel (or a channel message into a private room) is refused, because the receiving side compares the binding's channel against the payload the send actually arrived on."
evidence = "docs/PROTOCOL.md; src/crypto/pq.rs SendBinding.channel; src/client/session.rs decrypt_own_envelope; pq_hybrid_sends.feature 'A private message replayed into a channel is refused'; test a_private_send_does_not_open_as_a_channel_send"

[[user_story.acceptance_criteria]]
id = "AC-114"
description = "A send that already arrived once is refused if it arrives again: a send_id must strictly exceed everything already accepted from that peer. Gaps are expected and accepted, since the counter is per connection rather than per recipient."
evidence = "docs/PROTOCOL.md; src/client/replay.rs ReplayGuard; pq_hybrid_sends.feature 'A message that already arrived once is refused the second time'; tests a_repeated_send_id_is_refused, a_gap_in_send_ids_is_accepted"

[[user_story.acceptance_criteria]]
id = "AC-115"
description = "A voice or file stream is sealed by the identical construction a text message uses: one setup, then chunks. The setup travels once (P2pPayload::StreamKeySetup, reliably) rather than being repeated in every chunk, so a chunk carries ciphertext only and stays under SAFE_DATAGRAM_BYTES instead of fragmenting."
evidence = "docs/PROTOCOL.md; src/p2p_proto.rs P2pPayload::StreamKeySetup; src/client/voice_stream.rs PqStreamOut, ChunkDecryptor::install_setup; pq_hybrid_sends.feature 'Streamed content is sealed exactly like a text message'; test a_stream_of_chunks_opens_under_its_setups_key"

[[user_story.technical_behavior]]
id = "TB-160"
description = "There is one seal/open pair for every pq_hybrid content type - text, file offers, voice and file chunks all go through seal_setup/open_setup plus seal_chunk/open_chunk, with seal_send/open_send as the one-chunk convenience. No content type has a layout of its own."
evidence = "docs/PROTOCOL.md; src/crypto/pq.rs (SendSetup, HybridSend); src/client/envelope.rs encrypt_hybrid_envelope_for; src/client/voice_stream.rs build_chunk_recipients; pq_hybrid_sends.feature 'Streamed content is sealed exactly like a text message'"

[[user_story.technical_behavior]]
id = "TB-161"
description = "Every chunk's AES-256-GCM nonce is the deterministic big-endian send_id ++ seq, unique for the life of one send's freshly-random k_data - so no chunk needs fresh OS randomness, and two chunks of one send never repeat a nonce."
evidence = "docs/PROTOCOL.md; src/crypto/pq.rs chunk_nonce; pq_hybrid_sends.feature 'Two chunks of one send never repeat a nonce'; tests same_plaintext_produces_different_ciphertext_under_different_seq, decrypting_a_chunk_with_the_wrong_seq_fails"

[[user_story.technical_behavior]]
id = "TB-162"
description = "Every RSA signature this app produces uses RSA-PSS with SHA-256 and a random salt (crypto::sign/verify), not PKCS#1 v1.5 - covering both the pq_hybrid send commitment's classical half and rsa_per_msg's key-rotation signature, since both go through that one pair."
evidence = "docs/PROTOCOL.md; src/crypto/mod.rs sign, verify; tests signing_the_same_payload_twice_gives_different_signatures, a_pss_signature_does_not_verify_against_tampered_bytes, sign_verify_roundtrip"

[[user_story.technical_behavior]]
id = "TB-163"
description = "A pq_hybrid stream's chunks may outrun the reliable setup they depend on (voice chunks travel unreliably), so a receiver holds up to MAX_PENDING_CHUNKS of them and replays the backlog in arrival order once the setup verifies; beyond that bound further chunks are dropped rather than buffered without limit."
