description = "A daemon resolves what to run as flag-first, then daemon_* keys in ~/.aloo/settings, then the last connection made from the connect screen (~/.aloo/.cache, host/port and the keybundle it used), then built-in defaults - and writes the merged result back, so a later bare aloo --daemon reproduces it. With no server named anywhere it refuses to start rather than guessing; --server-pwd (or daemon_server_password) is the one login credential a headless start needs, and with a server but no password anywhere run refuses to start rather than dialling in with an empty one; a malformed channel or focus is reported rather than ignored."
