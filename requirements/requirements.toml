title = "Leave a channel"
as_a = "member of a channel"
i_want = "to stop being a member of it without disconnecting entirely"
so_that = "I can step away from a conversation I'm done with while staying connected to the rest"

[[user_story.acceptance_criteria]]
id = "AC-109"
description = "Typing /leave and pressing Enter leaves whichever channel the channel selector names, public or private, and drops it from that selector - it holds exactly the channels the user is in. A public channel stays listed in the /channels directory to rejoin from."
