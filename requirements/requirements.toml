[[user_story.acceptance_criteria]]
id = "AC-194"
description = "/endotp's notice to the peer is never a one-shot best-effort send: if they are offline, or the notice's delivery is never confirmed, it is retried automatically every time a direct link to them becomes reachable again - exactly the same durable-retry shape AC-142 already gives a pad invitation still owed to a peer - so a peer who was offline when the session ended still learns about it, however long that takes, the moment they reconnect. The debt is recorded against the contact name (not the connection), so it survives both a fresh UserId and an app restart, and is durably persisted to the same flat store file every other per-contact OTP record is, tolerant of being loaded from a file written before this field existed. It clears only once the peer's own acknowledgement genuinely arrives."
evidence = "src/client/otp_store.rs OtpContactState.pending_end_notice, OtpStore::end_session, clear_end_notice, pending_end_notices; src/client/otp.rs resend_pending_end_notices, on_end_session_ack; src/client/session.rs handle_p2p_event's LinkStatusChanged Active arm; docs/PROTOCOL.md 16.6; tests a_pending_end_notice_survives_save_and_load, clear_end_notice_reports_whether_anything_was_owed, pending_end_notices_yields_only_contacts_still_owed_one, a_line_written_before_pending_end_notice_existed_still_loads_as_false; verified manually with two clients (docs/TESTING.md 'Known coverage gaps' - resend_pending_end_notices' live wiring needs a live socket, same as AC-147's own gap)"

[[user_story.technical_behavior]]
id = "TB-212"
description = "Ending a session (either side's /endotp, or the receiving side converging after being told) is a pause, not a reset: the keychain entry, both sequence counters, and - critically - any send still awaiting its acknowledgement all survive it untouched. An in-flight send's pad was already spent, so the peer's decoder is waiting on exactly that ciphertext; abandoning it at the pause would leave them permanently unable to decrypt anything this side says afterwards. Only a pad still owed from an unfinished setup is dropped (it was never installed anywhere, so dropping it costs nothing), and only the initiating side records a notice as owed. Starting genuinely clean is instead the job of installing a new pad, which resets everything (AC-309)."
evidence = "src/client/otp_store.rs OtpStore::mark_end_requested, pause_after_peer_ended; src/client/otp.rs decide_end_otp, EndOtpDecision; tests mark_end_requested_owes_the_notice_and_touches_nothing_else, pause_after_peer_ended_keeps_the_inflight_send_and_owes_no_notice_of_its_own, pausing_one_contacts_session_does_not_touch_another_contacts_state (otp_store_test.rs)"

[[user_story.technical_behavior]]
id = "TB-188"
description = "otp itself has no integrity check on its ciphertext and no way to detect a duplicate input - feeding otp --decrypt the same ciphertext a second time (confirmed directly against the real binary) does not error, it silently advances past the correct pad range and returns garbage. Since AC-147's recovery deliberately creates situations where a message the peer may have already decrypted successfully gets resent (only the acknowledgement was lost), the receiving side's own per-contact sequence counter must reject a resend of an already-accepted sequence before otp --decrypt ever runs on it, not after - a read-only check separate from (and ordered strictly before) the existing accept-and-advance step, which only commits once decryption and local delivery have actually succeeded."
evidence = "src/client/otp_store.rs OtpStore::is_next_expected; src/client/otp.rs on_message (is_next_expected checked before unwrap_incoming); tests is_next_expected_is_read_only, is_next_expected_rejects_a_resend_of_an_already_accepted_sequence"

[[user_story.acceptance_criteria]]
id = "AC-153"
description = "While a mutual-consent OTP session is active with a DM's peer, a 1-line header renders above that room's message log naming the session ('OTP SESSION' highlighted) and the peer ('with <nickname>' in yellow), followed by each direction's live pad position - 'Receive Key (dec): <Seq> <Offset> <remaining>MB' and 'Send Key (enc): <Seq> <Offset> <remaining>MB' - Seq/Offset always grey, remaining green at or above 0.5MB and red below it, so a pad running low is visible before it actually runs out. The figures are populated the instant the session starts (on both the initiator's and the accepter's side), refreshed again the instant this contact's pad is actually spent by a genuine send or receive in either direction, and refreshed roughly once a second besides for as long as that room stays open, so they never require a manual check to stay current."
evidence = "src/client/otp_cli.rs ContactDetail, show_contact, parse_show_contact; src/client/otp.rs refresh_otp_key_status, poll_key_status; src/client/tui/ui.rs UiState.otp_key_status, set_otp_key_status, otp_key_status_for; src/client/tui/direct_message.rs render_private_room, render_otp_header, push_otp_key_spans, OTP_KEY_LOW_THRESHOLD_BYTES; src/client/session.rs tick loop (otp::poll_key_status); docs/PROTOCOL.md 16.5; tests show_contact_reports_the_initial_pad_position, show_contact_advances_offset_and_sequence_after_an_encrypt, show_contact_is_none_for_an_unknown_contact, the_otp_header_is_not_shown_without_an_active_session, the_otp_header_shows_the_highlighted_title_and_yellow_nickname, the_otp_header_colors_remaining_key_red_below_the_threshold_and_green_at_or_above_it"

[[user_story.technical_behavior]]
id = "TB-192"
description = "otp --show-contact is the only place the real otp command reports each direction's byte offset into its pad - '--status --porcelain' (the interface every other read here uses) has no such field - and its own exit code cannot be used to detect a missing contact (verified directly against the installed binary: it prints an error to stderr but still exits 0), unlike --status's exit 1. So show_contact parses the command's human-readable 'Label: value' output instead of an exit code, and treats an output that doesn't start with 'Contact:' as 'no such contact' rather than trusting the process result."
evidence = "src/client/otp_cli.rs show_contact, parse_show_contact, ContactDetail; tests show_contact_is_none_for_an_unknown_contact"

[[user_story.technical_behavior]]
id = "TB-182"
description = "Per-contact OTP state (provisioned, the pending-ack sequence, the next outgoing/expected-incoming sequence) is a small flat file under ~/.aloo/, saved synchronously after every mutation rather than batched - unlike id_store's laxer cadence - because losing this state must never let aloo pass -y to otp --encrypt without real proof of delivery. A malformed line is skipped rather than failing the whole load."
evidence = "src/client/otp_store.rs OtpStore, OtpContactState; tests loading_a_missing_file_starts_empty_not_an_error, mark_provisioned_round_trips_through_save_and_load, a_malformed_line_is_skipped_rather_than_failing_the_whole_load, setup_payload_round_trips_through_the_wire_encoding, setup_ack_payload_round_trips_through_the_wire_encoding"

[[user_story.technical_behavior]]
id = "TB-183"
description = "The otp CLI subprocess wrapper maps the real binary's exit codes (0 success, 3 KEYCHAIN_REDELIVERED - no new key consumed, re-invoke - any other value an error) to a typed outcome, and parses --status --porcelain's stable key=value fields (including enc_ack_outstanding/dec_ack_outstanding) as the ground truth for whether a contact's previous message still awaits confirmation. The binary is only ever detected (PATH/ALOO_OTP_BIN/settings), never fetched, downloaded, or built."
evidence = "src/client/otp_cli.rs OtpCliConfig::resolve, binary_available, status, encrypt, decrypt; tests binary_available_is_true_for_the_real_installed_otp, status_is_none_for_an_unknown_contact, recover_last_sent_replays_without_consuming_key"

[[user_story.technical_behavior]]
id = "TB-184"
description = "An OTP session proposal that has not yet been answered (Content::OtpKeySetup carrying fresh pad bytes, or Content::OtpSessionRequest carrying none) is staged as a PendingOtpInvite in UI state rather than acted on immediately - nothing is written to the keychain and no reply is sent until the user's Accept/Reject reaches client::otp::accept_invite/reject_invite. Raw pad bytes held in that staged invite are zeroized on drop, the same standard crypto::otp::OtpKeySetupPayload holds itself to. The 'OTP session started at <timestamp>' notice formats the local wall-clock time when it can be read safely, falling back to labeled UTC when it can't (time::OffsetDateTime::now_local's own documented multithreading restriction, which this async app always trips)."
evidence = "src/client/tui/ui.rs PendingOtpInvite, push_otp_invite, take_otp_invite; src/client/otp.rs on_key_setup, on_session_request, format_now; tests an_invite_holding_key_material_is_zeroized_on_drop, format_now_never_panics_and_always_returns_something"

[[user_story.technical_behavior]]
id = "TB-185"
description = "Every piece of this app's local state - id_store, the connect cache, settings, and the OTP layer's own otp_store/otp/.keychain/ - lives under one directory, resolved from ALOO_HOME when set (the exact directory, never joined with .aloo) or else the platform home directory joined with .aloo. Two aloo clients on the same machine - the ordinary way to test or demo two peers before deploying across real machines, and how a stuck OTP ack-gate from exactly this kind of collision was first found - otherwise silently share that directory: harmless for most of those stores, but actively corrupting for the OTP layer, whose keychain and per-contact ack-gate state each only ever represent one party's own view."
evidence = "src/platform.rs aloo_dir, resolve_aloo_dir; tests resolve_aloo_dir_prefers_aloo_home_over_the_derived_dot_aloo, resolve_aloo_dir_treats_an_empty_aloo_home_as_unset, resolve_aloo_dir_falls_back_to_home_dot_aloo_when_aloo_home_is_unset"

[[user_story.technical_behavior]]
id = "TB-186"
description = "A freshly generated one-time-pad (2MB by default, both keys combined) is never sent as a single pq_hybrid envelope - it rides one UDP datagram with no fragmentation of its own below this layer, and a payload that size silently fails the underlying send (past the OS's ~65KB ceiling, discarded rather than erroring, since transmission uses best-effort try_send_to). Instead it is split into many small OtpKeySetupChunk envelopes and reassembled on the receiving side by OtpKeySetupReassembly, keyed per sender, before ever being staged as an invite. A chunk that does not continue the accumulation in progress for that sender (wrong contact_name, wrong total_len, or an offset that doesn't pick up exactly where the last accepted chunk left off) is rejected rather than spliced in, so a stale or unrelated attempt can never produce a corrupted 'complete' payload."
evidence = "src/crypto/otp.rs OtpKeySetupChunk, OtpKeySetupReassembly; src/client/otp.rs send_key_setup_chunked, on_key_setup, OTP_SETUP_CHUNK_BYTES; src/client/session.rs SessionState.otp_incoming_setup; tests key_setup_chunk_round_trips_through_the_wire_encoding, reassembly_of_a_multi_megabyte_pad_split_into_many_small_chunks_matches_the_original, reassembly_is_not_complete_until_the_last_chunk_lands, reassembly_rejects_a_chunk_that_does_not_continue_it"

[[user_story.technical_behavior]]
id = "TB-187"
description = "otp --remove-contact <name> deletes a keychain entry outright (pad material and all) and is only ever invoked in response to something already authenticated over the pq_hybrid channel - the peer's own signed report that they have no matching key. A failure to remove is treated as best-effort (logged, not fatal): the worst case is the next --add-contact failing the exact same way it already was, not corruption. Removing a name that never existed is itself still an error the caller must check, unlike --has-contact's plain boolean."
evidence = "src/client/otp_cli.rs remove_contact; tests remove_contact_deletes_an_existing_contact, remove_contact_on_an_unknown_contact_fails, a_removed_contacts_name_can_be_reprovisioned_from_scratch"

[[user_story.acceptance_criteria]]
id = "AC-243"
description = "Under an active OTP session the message details popup reports the pad rather than the envelope under it: which sequence that message is, the pad offset its key bytes start at, and the key file they came out of (<contact>_enc.key for a message sent, <contact>_dec.key for one received). The figures are the pad's position before that message spent its own key, recorded on the row when it is logged - the live figures describe some later message by the time anyone opens the popup."
evidence = "docs/PROTOCOL.md 16; src/client/tui/ui.rs MessageCrypto::Otp, UiState::message_crypto; src/client/otp_cli.rs OtpKeyStatus, contact_key_paths; src/client/otp.rs refresh_otp_key_status, on_message; tests an_otp_message_reports_the_pad_position_and_key_file_it_used, an_incoming_otp_message_reports_the_decryption_pad; scenario features/encryption/message_encryption.feature 'A message details popup names the pad position it spent'"

[[user_story.acceptance_criteria]]
id = "AC-249"
description = "Agreeing a pad session opens the room it is with, on both sides, the moment the handshake completes (UiState::open_otp_session): the two people just deliberately agreed to it, and the conversation it was for is what either of them wants next. Resuming a still-live session because its peer reconnected is not that moment and never moves the view - nobody asked for it, and taking the screen off whatever is being read would be wrong."
