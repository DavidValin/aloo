# ============================================================================
# US-049 - Recognise a peer's key across their several devices
# ============================================================================
[[user_story]]
id = "US-049"
title = "Recognise a peer's key across their several devices"
as_a = "user who runs aloo on more than one machine, or who talks to peers who do"
i_want = "a pq_hybrid identity pin and an OTP/pad relationship to be scoped to a specific device rather than to a nickname alone, additively across as many devices as a nickname actually has"
so_that = "reconnecting from a new device is never confused with an unrelated key change or an impersonator, an old device's pin is never disturbed by trusting a new one, and a one-time pad - which can only ever be safely spent from one place - is never silently corrupted by two devices racing to use the same one"

[[user_story.acceptance_criteria]]
id = "AC-317"
description = "A serverless, pad-only (`Direct`-framed) pair's device claim rides as cleartext wire metadata on every message (`sender_device_id`, alongside `channel`/`seq`, never inside the padded payload), checked against `OtpContactState::bound_peer_device_id` strictly *before* the destructive `otp --decrypt` ever runs. Nothing bound yet: the claim is provisionally accepted and, only once decryption genuinely succeeds, binds the pad to it. Already bound to a different device: refused before any pad byte is touched - no decrypt, no offset movement, no ack - and the sender's message stays exactly as outstanding as any other never-acked send, recoverable and undamaged, until the actually-bound device answers. This is what makes rule 3 (\"an OTP-only mismatch cannot communicate; exchange keys via the existing methods\") literal for the case where the pad *is* the whole identity - a copied pad/key file used from two machines at once is refused rather than merged, since a pad has no safe multi-device story."
evidence = "docs/PROTOCOL.md 16.2; src/client/otp.rs finish_opening_otp_envelope, on_message/on_file_offer/on_voice_offer's sender_device_id threading; src/client/otp_store.rs OtpContactState.bound_peer_device_id, bound_peer_device_id, bind_peer_device; src/p2p_proto.rs P2pPayload::OtpEnvelope/OtpFileOffer/OtpVoiceOffer.sender_device_id; tests a_mismatched_device_claim_is_refused_before_the_pad_is_touched, a_refused_claim_leaves_the_senders_outstanding_send_untouched_and_it_still_delivers, the_pad_binds_to_the_first_device_that_genuinely_decrypts (otp_ack_wiring_test.rs); scenario features/direct_punch/becoming_a_real_peer.feature 'A copied pad claimed from a different device is held, not delivered' - reference table no-server row 3, driven through the real pad-only session harness end to end"

[[user_story.acceptance_criteria]]
id = "AC-320"
description = "`direct_punch_to` names a specific device with an optional `+<device_id>` suffix on its nickname field (`<nickname>[+<device_id>],<host>[:<port>],<frequency>`), split at the first `+` in that field; an unsuffixed line is unaffected - `device_id` is simply `None`, exactly as every line behaved before this syntax existed. An empty suffix (`bob+,host,every_1m`) is refused rather than silently becoming the reserved empty-string \"unbound\" sentinel `IdStore` uses internally, and the device half gets the same tab/newline injection guard the nickname half already has. `target_key` - nickname alone when unsuffixed, `nickname+device_id` when suffixed - is what a save/load round trip and the scheduler's own bookkeeping key on, and it round-trips losslessly through `to_setting_value`."
evidence = "docs/PROTOCOL.md 12.5, §7.1.5; src/settings.rs DirectPunchTarget::parse, to_setting_value, target_key; tests a_plus_suffix_on_the_nickname_names_a_specific_device, a_target_with_no_device_suffix_parses_with_no_device_id, target_key_is_nickname_alone_when_unsuffixed_and_qualified_when_suffixed, an_empty_device_suffix_is_refused, a_device_suffix_containing_a_tab_or_newline_is_refused, a_device_suffixed_target_round_trips_through_to_setting_value (settings_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-321"
description = "Two `direct_punch_to` lines for the same nickname but different devices produce genuinely distinct `UserId`s (`direct_peer_id`'s hash folds in the device id behind a separator byte only when one is given, so an unsuffixed line's id is byte-identical to before this parameter existed), distinct links, and - since each device's raw pairing key already differs (device-pinning plan §1's ordinary additive multi-device flow) - distinct pads; each is independently queryable by its own `target_key`. `PunchDatagram` carries no device id of its own (a wire-format change this plan deliberately avoids), so an incoming `DirectPing`/`DirectPong` naming a shared nickname is disambiguated by the address it actually arrived from against each candidate target's own resolved address - never guessed at when ambiguous, and never touching a sibling device's target. The one-nickname-one-link convergence a server-assigned `UserId` normally triggers (`set_direct_peer_id`) declines rather than guesses when more than one device is configured for that nickname, since nothing at that point says which configured device the server just named; both targets are left exactly as configured, each still independently reachable."
evidence = "docs/PROTOCOL.md §7.1.5; src/client/p2p.rs direct_peer_id, DirectTarget.nickname/device_id, resolve_incoming_direct_target, set_direct_peer_id, set_target_peer_id, direct_nickname_of, direct_device_id_of; src/client/session.rs direct_peer_identity; tests two_devices_sharing_a_nickname_get_distinct_user_ids_and_are_each_configured, an_incoming_ping_naming_a_shared_nickname_is_routed_by_the_address_it_arrived_from, a_second_device_stays_unreachable_until_a_device_suffixed_line_is_added (direct_punch_test.rs, reference table no-server row 6); scenario features/direct_punch/serverless_punching.feature 'A second device stays unreachable until a device-suffixed line is added' - the same row driven through the real PeerLinkManager"

