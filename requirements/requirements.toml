[[user_story.technical_behavior]]
id = "TB-274"
description = "A recording - a chime, a replayed voice message, an OTP clip: anything delivered by MixerCmd::Push rather than MixerCmd::PushLive - is exempt from every part of the jitter buffer's latency management. It is never trimmed however long it is, never made to wait for a prebuffer however short it is, and never treated as having fallen behind when it runs dry; it plays in full, immediately, and only then retires. Which kind a source is cannot be inferred from whether it is finished: a recording is pushed whole and finished only afterwards, so in that window it is indistinguishable from a live source carrying a large backlog - inferring it that way trimmed every chime and every replayed message down to its last few milliseconds, and stalled any clip shorter than the prebuffer target. Only the sender knows, so only the sender says."
