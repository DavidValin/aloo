[[user_story.acceptance_criteria]]
id = "AC-385"
description = "A genuine spend that leaves a contact with nothing left in either direction (enc_key_remaining and dec_key_remaining both zero) - live or mail, checked right after every genuine encrypt/decrypt (send_now, send_file_offer, send_voice_offer, on_file_offer, on_voice_offer, start_outgoing_file_content for live; handle_send and on_mail_deliver for mail) - never deletes anything: neither the keychain entry nor aloo's own per-contact bookkeeping is removed just because it emptied out (only a user's own explicit /contacts delete, or a later /otp/new-otp-mail-key replacing it outright, AC-384, ever touches the key material). A contact with bytes still left in only one direction is left alone entirely - only nothing left in *either* direction triggers anything. What does react is the *session* riding on an exhausted live contact: if it was active, it ends immediately on this side (is_otp_active cleared, exactly like discovering the peer's key is missing already does, AC-380) and this side tries to tell the peer directly too (the same sealed, unpadded OtpEndSession notice AC-380 uses, with the same PqWrapped-only limit), so both sides converge on ended rather than the peer being left to believe the session still works. A mail key has no session to end, only the key, so its notice says only that the key is gone and points at /new-otp-mail-key. Every contact is keyed by its own distinct contact_name, so exhausting one live session or mail key never touches a different contact, purpose, or peer."
evidence = "src/client/otp.rs is_contact_exhausted, end_live_session_if_exhausted (reuses pause_session_locally/try_notify_peer_session_ended from AC-380), and their six call sites; src/client/otp_mail.rs notify_if_mail_key_exhausted and its two call sites; tests is_contact_exhausted_requires_both_directions_at_zero, an_exhausted_active_session_ends_on_both_sides_when_the_peer_is_reachable, an_exhausted_active_session_ends_locally_even_when_the_peer_cannot_be_reached, an_exhausted_contact_with_no_active_session_is_left_alone, a_live_contact_that_still_has_key_is_never_touched, an_exhausted_mail_key_is_announced_but_not_removed, a_mail_key_that_still_has_key_produces_no_notice, exhausting_one_contact_never_touches_a_different_one (otp_key_exhaustion_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-310"
description = "/endotp is a synchronised, two-party operation: it requires the peer online (an offline peer, who could confirm nothing, refuses the whole request up front - out loud, with nothing spent and the session untouched on both sides), and it takes local effect only when the peer's proof-carrying OtpDeliveryAck of the end notice arrives - until that confirmation the initiator's side stays fully in the session, new sends to that contact are refused with 'the session is ending - waiting for their confirmation', a repeat /endotp reports 'already ending', and /otp cancels the pending end. The receiving side pauses the moment the notice lands; the initiating side pauses the moment the confirmation lands - so the two sides always leave the session together, never one paused while the other unknowingly keeps spending the pad at it."
evidence = "docs/PROTOCOL.md 16.6; src/client/otp.rs handle_end_otp_command's guards and mark_end_requested request phase, on_delivery_ack's confirmation teardown, send_or_queue's ending refusal; src/client/otp_store.rs mark_end_requested; src/client/tui/ui.rs submit_input's /endotp offline refusal (checked against link_status_of, not only ui_state.offline - the server's HEARTBEAT_TIMEOUT lags real reachability by up to 30s); tests endotp_while_the_peer_is_offline_is_refused_with_nothing_spent, end_session_both_pq_hybrid_travels_under_the_pad, end_session_no_pq_hybrid_anywhere_still_reaches_the_peer, a_send_after_endotp_no_longer_rides_the_paused_pad (otp_ack_wiring_test.rs), endotp_while_the_open_dm_peer_is_offline_is_refused_with_a_notice, endotp_in_an_open_dm_room_produces_end_otp_session_for_that_peer (ui_direct_message_test.rs); scenarios message_encryption.feature 'Ending a session travels under the pad it is ending', '/endotp is refused while the peer is offline', 'Ending needs the peer reachable, and a refusal spends nothing'"

