# aloo requirement model
# ============================================================================
# The single source of truth for *requirement definitions*: which user
# stories exist, which acceptance criteria and technical behaviours belong to
# each, and what each one means.
#
# It deliberately does NOT list which tests cover what. That linkage lives
# next to the executable code and is derived from it:
#
#   * Gherkin scenarios  -> `@AC-001` / `@TB-051` tags in `features/**/*.feature`
#   * Rust tests         -> `/// @requirement AC-001, TB-051` above the test fn
#
# `cargo test --test traceability` reads all three sources, cross-checks them,
# and regenerates the reports under `target/traceability/`. Keeping the links
# in one place (the code) and the definitions in another (here) is what stops
# the matrix from being a second copy of the truth that silently rots.
#
# Every entry below carries `evidence`, naming where the requirement was
# reconstructed from - a documentation section, a production-code contract, or
# the pre-migration test that encoded it. Nothing here was invented: see
# docs/TESTING.md#known-coverage-gaps for behaviour that looked like a
# requirement but lacked the evidence to become one.
#
# ID namespaces are flat and global: US-xxx, AC-xxx, TB-xxx. IDs are stable -
# renumbering one breaks every link to it, so retire an ID rather than reuse it.

