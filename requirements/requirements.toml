[[user_story.acceptance_criteria]]
id = "AC-146"
description = "While OTP is active for a DM peer, sending that peer a file protects both the offer naming it and the file's actual bytes under the pad - two independent pad spends, not one: the offer (filename + size) is wrapped through the pad exactly like a text message the moment it is sent (a deliberate choice, AC-148, to keep the filename off the wire even at the cost of pad on offers that are later rejected), and the file's content is a second, later pad spend, reserved only once the offer is accepted, encrypting the whole file into a temp file that the existing chunked transport streams unchanged; the receiving side decrypts the reassembled temp file whole once it fully arrives, then acknowledges that second slot. A voice message under OTP is never live-streamed - it is recorded fully first, encrypted whole the moment recording stops (no consent step to defer to, since voice auto-accepts either way, so there is only ever one slot for it), and sent the same way a file's content is; once decrypted on arrival it becomes an ordinary, already-finished voice message, playable on Enter exactly like any other. Both directions clean up their temporary plaintext/ciphertext staging files regardless of outcome, and this layer stays DM-only for both, matching text."
