[[user_story.acceptance_criteria]]
id = "AC-280"
description = "Three genuine failed checks - the user agreed to check, the scan ran, nothing matched - from the same source IP, spanning at least two different clock minutes, within a rolling 10-hour window, bans that IP. Three crammed into the same minute do not ban, and failures older than the window are pruned and stop counting."
evidence = "docs/PROTOCOL.md 7.1.5 (No-IP updates section's IP ban list); src/client/ip_ban.rs IpBanList::record_failed_check; tests three_failures_spanning_two_minutes_within_the_window_bans_the_ip, three_failures_inside_one_minute_do_not_ban, failures_older_than_the_rolling_window_are_pruned_and_do_not_count; scenarios features/direct_punch/ip_banning.feature 'Three failed checks spanning two clock minutes bans the source', 'Three failed checks crammed into the same minute do not ban', 'Failed checks older than the rolling window are forgotten'"

[[user_story.acceptance_criteria]]
id = "AC-281"
description = "A banned IP's direct-punch requests are dropped outright, before any nickname is even looked at - no popup, no scan, no strike recorded - checked first thing in on_direct_ping. An already-banned IP asked for one more check stays banned without a fresh strike being counted."
evidence = "src/client/p2p.rs PeerLinkManager::on_direct_ping (the ip_bans check), is_ip_banned; src/client/ip_ban.rs IpBanList::is_banned; tests an_already_banned_ip_stays_banned_and_is_not_recounted; scenario features/direct_punch/ip_banning.feature 'A banned source cannot be checked again to shake off the ban'"

[[user_story.acceptance_criteria]]
id = "AC-282"
description = "A ban survives a restart: ~/.aloo/banned_ips.log persists every ban with its date, ip and reason, plus a running '<n> banned' header line, reloaded at startup. The ban itself has no auto-expiry and is lifted only by editing the file by hand."
evidence = "src/client/ip_ban.rs IpBanList::load/save, default_path; tests a_banned_ip_stays_banned_across_a_reload, the_header_line_reports_the_running_count_and_is_recomputed_on_every_ban, loading_a_missing_file_starts_empty_rather_than_erroring; scenarios features/direct_punch/ip_banning.feature 'A ban outlives the process that recorded it', 'The file names how many sources are banned, recomputed each time'"

[[user_story.technical_behavior]]
id = "TB-248"
description = "The file's entry lines are the one source of truth; the header count is a best-effort display value recomputed on every save and never trusted on load, so a hand-edited removal of a line takes effect immediately even though the header may briefly disagree until the next ban. A line that does not parse as date/ip/reason, or whose ip does not parse, is skipped rather than failing the whole load."
evidence = "src/client/ip_ban.rs IpBanList::load, save; tests a_hand_edited_removal_of_an_entry_is_trusted_over_a_stale_header, an_unparseable_ban_line_is_skipped_rather_than_failing_the_whole_load; scenarios features/direct_punch/ip_banning.feature 'Removing a line by hand lifts that ban immediately', 'A corrupted line in the file is skipped, not fatal'"

[[user_story.technical_behavior]]
id = "TB-269"
description = "IpBanList::record_strike/is_banned_at generalize record_failed_check/is_banned into a config-driven (StrikeConfig) rolling-window strike counter whose ban can expire (ban_duration) rather than only ever being permanent - reused as-is (not reimplemented) by server::mod's login-failure and registration-abuse gates, each with their own threshold/window/duration/reason. The on-disk format grows an optional fourth expires_at field; a line with none (every ban recorded before this existed, or hand-edited without it) reads back as permanent, so the direct-punch gate's own bans and its file format are unaffected."
evidence = "src/client/ip_ban.rs StrikeConfig, record_strike, is_banned_at, LOGIN_FAILURE_STRIKES, REGISTRATION_ABUSE_STRIKES; tests a_time_limited_ban_lifts_once_its_duration_has_elapsed, a_permanent_ban_never_expires, an_already_banned_address_stays_banned_without_a_fresh_strike_or_a_later_expiry, a_time_limited_bans_expiry_survives_a_reload, a_pre_existing_three_field_ban_line_loads_as_permanent (ip_ban_test.rs)"


