description = "A .txt file offer, once fully accepted, stages into a scratch directory rather than the real download directory, so it can be previewed without being considered saved. Its row reads '(Enter: preview)' instead of settling to the plain filename; Enter opens a full-width, scrollable, read-only popup with the file's content and a bottom hint naming its keys ('d: save', 'Esc: close'). The popup absorbs every other key while open and is the same priority tier as the message-details popup. Opening it sends the sender one Viewed receipt, the first time only - reopening the same preview sends nothing further. A non-.txt file's accept-and-save behaviour is completely unaffected, and an OTP-protected transfer is unaffected regardless of extension, since its own acknowledgement already depends on decrypting straight to its final destination."
