[[user_story.acceptance_criteria]]
id = "AC-158"
description = "A selected voice recording or file attachment is removed with 'd', and only after a confirmation popup whose safe default is Cancel."
evidence = "docs/SPEC.md Functionality; src/client/tui/otp_mail.rs handle_mail_compose_key's delete_confirm branch; test d_removes_the_selected_attachment_only_after_confirming; scenario features/messaging/otp_mail.feature 'Removing an attachment needs confirmation'"

[[user_story.acceptance_criteria]]
id = "AC-159"
description = "Sending happens only through an explicit confirm popup (Ctrl+S opens it; Cancel is the default). On confirm the mail is one-time-pad encrypted through the otp CLI, uploaded as OtpMailSend, and a local reference is stored on disk; the server's OtpMailResult acknowledgement moves it to stored-on-server, and a mail whose acknowledgement never arrived is re-uploaded on the next connect with the exact ciphertext recovered from the keychain's .last_sent copy, under the same mail id - never a fresh encode."
evidence = "docs/PROTOCOL.md 17.2; src/client/otp_mail.rs handle_send, resend_pending, on_mail_result; src/client/tui/otp_mail.rs handle_mail_compose_key's send_confirm branch; tests ctrl_s_opens_the_send_confirm_only_when_valid, send_emits_only_after_confirming, a_mails_last_sent_copy_replays_byte_identically_for_retry; scenarios features/messaging/otp_mail.feature 'Sending needs explicit confirmation', 'A retry re-uploads the recovered ciphertext, never a fresh encode'"

[[user_story.acceptance_criteria]]
id = "AC-160"
description = "The server stores an undelivered mail's ciphertext on disk and acknowledges storage to the sender; when the recipient connects (OtpMailFetch, or immediately if already connected) every pending mail addressed to their nickname is delivered in per-sender sequence order, and the recipient's OtpMailAck deletes the stored ciphertext from the server's disk."
evidence = "docs/PROTOCOL.md 17.2, 17.3; src/server/mail.rs MailStore, on_mail_send, on_mail_fetch, on_mail_ack; tests store_and_pending_for_round_trip_on_disk, pending_for_orders_one_senders_mails_by_seq, mark_delivered_deletes_the_pending_file_and_records_a_receipt, on_mail_send_stores_and_acknowledges, on_mail_send_pushes_immediately_to_a_connected_recipient, on_mail_fetch_delivers_pending_and_receipts; scenarios features/messaging/otp_mail.feature 'A mail for an offline recipient waits on the server disk', 'The recipient fetches, acknowledges, and the server copy is deleted', 'Mails queued out of arrival order are still delivered oldest sequence first'"

[[user_story.acceptance_criteria]]
id = "AC-161"
description = "The server keeps a delivery receipt for every acknowledged mail and notifies the sender (immediately if connected, otherwise on their next OtpMailFetch); the sender updates the mail's local reference to delivered and answers OtpMailDeliveredAck, after which the server forgets the receipt."
evidence = "docs/PROTOCOL.md 17.3; src/server/mail.rs mark_delivered, receipts_from, forget_receipt, on_mail_delivered_ack; src/client/otp_mail.rs on_mail_delivered; tests on_mail_ack_notifies_a_connected_sender, on_mail_send_answers_a_retry_after_delivery_with_delivered, forget_receipt_only_for_the_original_sender, on_mail_delivered_ack_forgets_the_receipt; scenario features/messaging/otp_mail.feature 'The sender learns of delivery on their next connect'"

[[user_story.acceptance_criteria]]
id = "AC-162"
description = "The /mailbox command opens the mailbox popup (over the mail view it opens as the popup's backdrop; Esc out of the popup closes an untouched backdrop with it): every sent mail with its delivery status (awaiting server / on server / delivered / failed - never its content) and every received mail; Enter on a received mail decrypts it in memory and opens it for reading, voice parts playable and attachments savable."
evidence = "docs/SPEC.md Functionality; src/client/tui/otp_mail.rs handle_mailbox_key, handle_mail_reader_key, render_mailbox, render_mail_reader; src/client/otp_mail.rs mailbox_rows, handle_read; tests slash_mailbox_opens_the_mailbox, esc_from_the_mailbox_keeps_a_draft_in_progress, the_mailbox_lists_sent_status_and_received_rows, enter_on_a_received_row_asks_to_read_it, the_reader_plays_voice_parts_and_saves_attachments; scenario features/messaging/otp_mail.feature 'The mailbox shows delivery status, and a received mail can be read'"

[[user_story.acceptance_criteria]]
id = "AC-163"
description = "A received mail rests on disk only as a ciphertext file plus the pad used for its decryption (the payload re-encrypted under fresh local randomness the moment it arrived, since the keychain pad that carried it is destroyed by the decrypt); reading XORs the two in memory only, and removing the mail overwrites and deletes both files, making its content unrecoverable."
evidence = "docs/PROTOCOL.md 17.3; src/client/otp_mail_store.rs store_received_payload, read_received_payload, remove_received; src/crypto/otp.rs repad, xor_pad; tests received_payload_stores_ciphertext_and_pad_and_reads_back_by_xor, stored_blob_files_are_never_the_plaintext, remove_received_destroys_both_files, d_on_a_mailbox_row_requires_confirm_before_delete, repad_round_trips_and_neither_half_alone_is_the_plaintext; scenario features/messaging/otp_mail.feature 'A received mail rests as ciphertext plus pad and dies with them'"

[[user_story.acceptance_criteria]]
id = "AC-335"
description = "The server has no way to tell which of a nickname's devices a mail was actually sealed for (contact_name is opaque storage-side, and StoredMail carries no device_id) - so it keeps offering the same still-pending mail on every fetch, whichever device is currently connected under that nickname, rather than consuming or marking it tried on a mere delivery attempt. On the receiving side, a mail whose carried contact_name does not match what this session derives for the claimed sender (device-pinning plan §4) is left untouched and unacknowledged rather than acked or decrypted - only a contact name matching exactly, via MailGate::AckOnly or ::Decrypt, ever produces an OtpMailAck, which is the only thing that ever deletes the mail from the server and tells the sender it was delivered."
evidence = "docs/PROTOCOL.md 17.3, 17.4; src/server/mail.rs on_mail_fetch:301, MailStore::pending_for:127, on_mail_ack:321; src/client/otp_mail.rs on_mail_deliver:654, mail_gate:98; tests on_mail_fetch_redelivers_the_same_pending_mail_until_acked, a_delivery_attempt_alone_never_removes_a_pending_mail (server_mail_test.rs), on_mail_deliver_never_acks_a_mail_sealed_for_a_different_device, on_mail_deliver_acks_a_mail_matching_the_locally_derived_contact (otp_mail_test.rs); scenarios features/messaging/otp_mail.feature 'A fetch with no acknowledgement is redelivered, never dropped', 'A mail sealed for a different device is never acknowledged, and stays pending', 'A mail sealed for bob's own connected device is acknowledged and removed'"

[[user_story.acceptance_criteria]]
id = "AC-336"
description = "The compose view shows a device selector below the To field, listing every device the resolved nickname has a pinned identity for with a check/cross for whether each carries a mail-purpose otp key; it defaults to the most-recently-seen device that has one (falling back to the most-recently-seen device overall only if none does, so the existing NoMailKey gate still explains why), Tab only stops there once at least one device is known, and Up/Down move the selection and re-run the recipient check against whichever device is now highlighted. Sending seals the mail under the explicitly selected device's own key, not an implicit 'most recently seen' guess."
