# US-035 - OTP mail: asynchronous, server-stored delivery
# ============================================================================
[[user_story]]
id = "US-035"
title = "Send OTP mail that waits on the server"
as_a = "user with an established one-time pad for a contact"
i_want = "to write them a mail - subject, text, voice recordings and file attachments - that waits encrypted on the server while they are offline"
so_that = "we can communicate with one-time-pad secrecy without both having to be online at the same moment"

