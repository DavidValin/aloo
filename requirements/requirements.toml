# ============================================================================
# US-039 - Keep a direct link to a peer with no server involved
# ============================================================================
[[user_story]]
id = "US-039"
title = "Keep a direct link to a peer with no server involved"
as_a = "user who already knows where a particular person's machine is on the internet"
i_want = "my client to punch a direct UDP link to them on a schedule we both keep, without any server arranging it"
so_that = "we can reach each other even when there is no server we both trust, or none running at all"

[[user_story.acceptance_criteria]]
id = "AC-206"
description = "With direct_punch=on, each direct_punch_to peer gets its own background attempt on a slot grid that restarts at every o'clock and steps by that peer's frequency - so both ends, running the same setting, probe at the same wall-clock moments with nothing coordinating them but the clock. An attempt punches straight at the configured host and port using the same Ping/Pong handshake a server-arranged link uses, and no candidate exchange is relayed through any server at any point."
evidence = "docs/PROTOCOL.md 7.1.5; docs/SPEC.md 'Direct punch settings'; src/settings.rs PunchFrequency::slot_of_hour, src/client/p2p.rs PeerLinkManager::configure_direct_punch/direct_tick/begin_direct_attempt/send_direct_ping, utc_second_of_hour; tests every_frequencys_slot_grid_restarts_at_the_top_of_the_hour, two_peers_punch_a_link_from_the_schedule_alone_and_carry_a_message; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-207"
description = "A link opened this way is an ordinary direct link: once it is up it carries the same reliably-delivered content (text, files, voice) over the same transport as one the server helped arrange, and is maintained by the same keepalive and liveness rules."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs PeerLinkManager::on_direct_pong (activation via the shared on_pong), send_reliable_or_queue; test two_peers_punch_a_link_from_the_schedule_alone_and_carry_a_message; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-208"
description = "A slot arriving for a peer whose link is already up does nothing at all - the link is never re-punched, re-nonced or interrupted on a schedule; only losing it re-opens the question."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs PeerLinkManager::direct_tick (the Established arm), begin_direct_attempt's already-Active guard; test a_slot_arriving_on_a_link_that_is_already_up_does_not_punch_again; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-209"
description = "One attempt probes for the whole of DIRECT_PUNCH_WINDOW and is then abandoned until that peer's next slot, rather than running until the next attempt would overlap it. The window really is spent probing: the link underneath has a much shorter punch timeout of its own, so an attempt spans as many link-level attempts (each with a fresh nonce) as the window has room for, instead of quietly falling silent after the first one."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs DIRECT_PUNCH_WINDOW, PeerLinkManager::direct_tick's Punching arm, rearm_direct_link, give_up_direct_attempt; tests an_attempt_probes_for_the_punch_window_and_is_then_abandoned_until_the_next_slot, probing_really_continues_for_the_whole_window_not_just_one_link_attempt; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-210"
description = "A direct link that was up and dropped accidentally is re-punched straight away, outside its schedule, for up to DIRECT_MAX_RECONNECTS attempts - but only for a peer no server could re-signal instead; the budget is forgiven the moment the link comes back, so it bounds one outage rather than the session."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs DIRECT_MAX_RECONNECTS, PeerLinkManager::on_direct_link_dropped, give_up_direct_attempt, on_direct_pong's reconnect reset; test a_direct_only_link_that_drops_is_reconnected_up_to_the_reconnect_budget; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-211"
description = "There is never more than one peer-to-peer link between two people, whichever way it was opened: while a direct punch owns a peer's link nothing is signalled through the server for them (not a send, not a retry backoff, not a relayed proposal from the peer), and a direct target for someone the server does name is filed under that same UserId so the two routes converge on one link rather than one each. An already-open link moves with that change rather than being left behind under the identity it was opened with - the ordering that makes this matter (a link punched to someone who is not on the server, who connects to it later) is the normal one in daemon mode, and leaving it behind is what would silently produce the second link this forbids. It moves back the same way when they leave the server again, since that says nothing about whether the direct path still works."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs PeerLinkManager::direct_owns, ensure_link, on_peer_candidates, retry_due, set_direct_peer_id, rekey_link, release_direct_peer_id, is_direct_peer_id; src/client/session.rs handle_server_message's UserJoined/UserOffline arms; tests a_peer_being_punched_directly_is_never_also_signalled_through_the_server, a_direct_target_moves_onto_the_user_id_the_server_gives_it, a_peer_who_joins_the_server_after_a_direct_link_is_up_gets_only_one_link; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-212"
description = "~/.aloo/settings accepts direct_punch=on plus one direct_punch_to=<nickname>,<host>,<frequency> line per peer, where the host is an IPv4 address, an IPv6 address or a hostname and may carry its own port (defaulting to DEFAULT_DIRECT_PUNCH_PORT), and the frequency is one of the documented values; all of it survives a save/load round trip."
evidence = "docs/SPEC.md 'Direct punch settings'; README.md 'Direct punching'; src/settings.rs DirectPunchTarget::parse/to_setting_value, PunchFrequency::parse, PUNCH_FREQUENCIES, Settings::parse/save; tests direct_punch_on_reads_one_target_per_line, a_target_host_may_be_ipv4_ipv6_or_a_name_and_may_carry_its_own_port, every_documented_frequency_parses_and_nothing_else_does, direct_punch_settings_survive_a_save_and_load_round_trip, direct_punch_is_off_and_targetless_unless_the_file_turns_it_on; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-213"
description = "A direct_punch_to line that does not parse is reported with the reason rather than silently ignored, and never costs the lines around it - a typo'd nickname, host or frequency must not be indistinguishable from a peer who simply never answers."
evidence = "docs/SPEC.md 'Direct punch settings'; src/settings.rs Settings::direct_punch_invalid; src/client/session.rs run_connected_session's settings load; test a_malformed_target_is_reported_rather_than_silently_dropped; direct_punch.feature"

[[user_story.technical_behavior]]
id = "TB-221"
description = "The slot grid is computed from the UTC second of the hour, and restarts at every o'clock rather than running continuously - which is what makes an interval that does not divide 60 (55m) well defined, and what keeps two peers in time zones with fractional-hour offsets on the same grid. A client started mid-slot waits for the next boundary rather than probing immediately, since a probe at any moment its peer has no reason to be probing back is wasted."
evidence = "docs/PROTOCOL.md 7.1.5; src/settings.rs PunchFrequency::slot_of_hour; src/client/p2p.rs utc_second_of_hour, PeerLinkManager::configure_direct_punch (last_slot seeding), direct_tick; tests every_frequencys_slot_grid_restarts_at_the_top_of_the_hour, an_interval_that_does_not_divide_the_hour_still_restarts_at_oclock, the_slot_clock_is_the_utc_second_of_the_hour"

[[user_story.technical_behavior]]
id = "TB-222"
description = "The serverless handshake carries the sender's nickname (DirectPing/DirectPong) because nothing else can identify them: no candidate exchange named a UserId, and the source address is exactly what the receiver is trying to learn. A probe is answered only for a nickname the receiver itself lists in direct_punch_to - anyone else gets nothing back, so the fixed port is no more discoverable by scanning it than an ephemeral one, and a nickname longer than MAX_DIRECT_PUNCH_NICK_LEN is dropped before it is looked up at all. A configured peer's probe also opens this side's own attempt, since their clock is as good an alarm as ours and without answering in kind there is no second direction to punch open."
evidence = "docs/PROTOCOL.md 7.1.5; src/p2p_proto.rs PunchDatagram::DirectPing/DirectPong, MAX_DIRECT_PUNCH_NICK_LEN; src/client/p2p.rs PeerLinkManager::on_direct_ping, on_direct_pong, on_datagram_at's direct arms; tests punch_datagrams_roundtrip, a_direct_ping_naming_a_nickname_that_is_not_configured_is_ignored, a_peers_probe_is_answered_and_opens_this_sides_attempt_too"

[[user_story.technical_behavior]]
id = "TB-223"
description = "A peer known only from settings is filed under a synthetic UserId derived from their nickname, with its top bit set so it can never collide with a server-assigned id (the server hands those out from a counter starting at 1). That bit is also the test for 'could a server re-establish this link at all', which is what decides whether an accidental loss spends the direct reconnect budget or is left to the ordinary re-signalling path - asked session-wide instead, a peer only ever reachable directly would be handed to a path that can never reach them."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs direct_peer_id, is_direct_peer_id, on_direct_link_dropped, retry_due, ensure_link; tests a_nickname_derived_peer_id_is_stable_and_never_collides_with_a_servers, a_peer_being_punched_directly_is_never_also_signalled_through_the_server"

[[user_story.acceptance_criteria]]
id = "AC-214"
description = "A peer reached with no server is placed in the channels both sides have joined, from a sealed ChannelPresence announcement they send when the link opens and again whenever their own membership changes. The list is authoritative rather than additive, so a channel dropped from it is how a peer says they left, and only channels this client has itself joined are ever considered. Once placed, nothing downstream can tell them apart from a peer a server introduced: the sidebar lists them, channel sends and voice address them, the call roster includes them, and --focus resolves to them - which is what makes a daemon's channel focus and its global push-to-talk work over a punched link. A peer sharing no channel is still registered as a DM peer."
evidence = "docs/PROTOCOL.md 7.1.5; docs/SPEC.md 'Direct punching'; src/proto.rs Content::ChannelPresence; src/p2p_proto.rs P2pPayload::ChannelPresence; src/client/session.rs reconcile_direct_membership, on_channel_presence, send_channel_presence, broadcast_channel_presence; src/client/tui/channel.rs channels_containing_member, is_member_of_channel; tests announced_membership_is_reconciled_against_our_own_joined_channels, content_channel_presence_envelope_roundtrips, and end to end between two whole serverless sessions in test/daemon_session_test.rs (two_serverless_sessions_punch_to_each_other_and_each_registers_the_other); becoming_a_real_peer.feature"

[[user_story.acceptance_criteria]]
id = "AC-215"
description = "A peer is registered only on the first payload that authenticates them - an envelope that opens under the key already pinned for their nickname - never on a DirectPing, whose nickname is unauthenticated and could be claimed by anyone able to reach the port. Registration therefore requires both a pinned identity for that nickname (there is otherwise nothing to encrypt to them with) and a pq_hybrid one, since only pq_hybrid signs its sends and so only there can an arriving envelope prove who sent it."
evidence = "docs/PROTOCOL.md 7.1.5, 13.4; src/client/session.rs direct_peer_identity, on_channel_presence (opens via decrypt_own_envelope before registering anything); src/client/idstore.rs IdStore::get; tests only_a_pinned_pq_hybrid_identity_can_become_an_addressable_peer, a_direct_ping_naming_a_nickname_that_is_not_configured_is_ignored, and end to end in two_serverless_sessions_punch_to_each_other_and_each_registers_the_other (whose pin, removed, is what makes it fail); becoming_a_real_peer.feature"

[[user_story.technical_behavior]]
id = "TB-224"
description = "A direct target's nickname is recoverable from the UserId its link is filed under (direct_nickname_of), which is what turns a link back into the name its key is pinned under, and the set of serverless peers whose links are up is enumerable (active_direct_peers) so a membership change can be announced to exactly them. Leaving a channel never forgets a link the direct scheduler owns: that link was opened from settings and a schedule, not from the channel, so a channel departure says nothing about whether to keep it."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs PeerLinkManager::direct_nickname_of, active_direct_peers; src/client/channel.rs handle_leave's direct-peer guard; tests a_direct_targets_nickname_and_live_peers_are_queryable; becoming_a_real_peer.feature"

[[user_story.acceptance_criteria]]
id = "AC-217"
description = "With no server there is nothing to join a channel through, so ~/.aloo/settings' direct_punch_channel lines are the channels this client is in: read one per line, validated against the same channel-name rules a server would apply, de-duplicated, kept in file order, and surviving a save/load round trip. They are seeded as joined at startup and are also the whole of the directory /channels and Ctrl+J browse, since no other channel exists."
evidence = "docs/SPEC.md 'Direct punching'; src/settings.rs Settings::parse/save (direct_punch_channels); src/client/session.rs run_connected_session's serverless seeding; src/client/tui/ui.rs UiState::serverless, the Ctrl+J branch; test direct_punch_channels_are_read_one_per_line_and_validated; no_server.feature"

[[user_story.acceptance_criteria]]
id = "AC-218"
description = "A session distinguishes having no server at all from having one that is currently unreachable, and explains each differently: the first is permanent and says so, the second reads as temporary - which it genuinely is, because a lost server is always being retried (4.2). Both refuse the same actions, but telling a user something needs a server while one is merely reconnecting, or that it is retrying when there is no server at all, would each be wrong. Losing the server mid-session is a degradation rather than an ending: direct links are punched peer-to-peer and are unaffected by it, so the session carries on with server-backed actions refused, instead of disconnecting the very peers the loss did not touch."
evidence = "docs/SPEC.md 'Running without a server', Functionality #19; docs/PROTOCOL.md 4.2; src/client/session.rs ServerState::is_absent/is_serverless/refusal, handle_server_event's Lost arm (degrades to Unreachable rather than ending the session), send_if_server; test server_state_distinguishes_no_server_from_an_unreachable_one; no_server.feature"

[[user_story.acceptance_criteria]]
id = "AC-219"
description = "An action needing a server is refused at the moment it is asked for, naming what it was and why, rather than being allowed to proceed into a control channel with nothing behind it - where a join would leave the popup closed and no channel ever appearing, and a mail would sit sending against a result that cannot arrive. The check sits at the single point every action passes through. Only genuinely server-backed actions are refused: joining a channel, and OTP mail. Text, voice, files, calls, live OTP sessions and leaving a channel are peer-to-peer and stay available, and joining a channel that direct_punch_channel already names is done locally rather than refused."
evidence = "docs/SPEC.md 'Running without a server'; src/client/tui/ui.rs UiAction::needs_server; src/client/session.rs handle_ui_action's refusal gate and its local-join branch; src/control.rs NullSink; test only_server_backed_actions_are_refused_without_one; no_server.feature"

[[user_story.acceptance_criteria]]
id = "AC-220"
description = "A channel or conversation that has nobody in it yet, while running with no server, says 'Waiting for other users to connect directly to you' rather than showing blank. Nothing else is going to explain the silence - no roster arrives and no presence notice is coming - so a correctly configured client that is merely early would otherwise be indistinguishable from a broken one. Shown only while genuinely unreachable: once a peer's link is up, an empty log means what it always meant."
evidence = "docs/SPEC.md 'Running without a server'; src/client/tui/channel.rs WAITING_FOR_DIRECT_PEERS, render_sidebar; src/client/tui/ui.rs render_messages; no_server.feature"

[[user_story.technical_behavior]]
id = "TB-225"
description = "An encryption-key rotation (13.10) is carried over the direct link when no server can relay it - either because there is none, or because the peer is one no server has ever named. The payload is exactly what the relayed form carries and the recipient verifies its signature itself, so the transport changes nothing about trust; without this, forward secrecy would silently stop for precisely the peers 7.1.5 exists for, while messages continued to encrypt and decrypt fine against the un-rotated bootstrap keys."
evidence = "docs/PROTOCOL.md 13.10, 7.1.5; src/p2p_proto.rs P2pPayload::KeyRotation; src/client/p2p.rs P2pEvent::KeyRotation; src/client/session.rs rotate_out_rx's dispatch and the KeyRotation arm (handle_pq_key_rotated, shared with ServerMessage::KeyRotated); test punch_datagrams_roundtrip and the existing rotation tests it reuses unchanged"

[[user_story.acceptance_criteria]]
id = "AC-221"
description = "A daemon can be started with no server at all: --no-server lifts the host requirement that every other start is held to, and is persisted like every other daemon field so a bare `aloo --daemon` at the next boot comes back serverless rather than failing for want of a host it never had. A serverless DM focus is given no discovery channel - the hall exists so a focus has somewhere to watch for presence, and with no server there is no presence and no hall to join, so adding one would only produce a tab that can never fill. The channels such a daemon was asked to join are driven at startup rather than off a ChannelList that will never arrive, and go through the same refusal gate every other action does, so --channel is never silently ignored on the one start where nobody is watching."
evidence = "docs/SPEC.md 'Running without a server'; README.md; src/client/daemon.rs DaemonConfig::resolve (host fallback, discovery-channel guard, no_server), DaemonConfig::persist, run's serverless branch; src/settings.rs daemon_no_server; src/client/session.rs request_daemon_joins and its serverless trigger; tests no_server_lifts_the_host_requirement, a_serverless_daemon_comes_back_serverless_after_a_restart, a_serverless_dm_focus_does_not_get_a_discovery_channel, and end to end against a real session in test/daemon_session_test.rs (a_serverless_daemon_shows_its_configured_channel_and_waits_for_peers, a_serverless_daemon_joins_the_channel_it_was_given, a_channel_that_is_not_configured_is_refused_with_a_reason)"


[[user_story]]
id = "US-040"
title = "Stay on the server, and say what is going on"
as_a = "someone whose network drops while aloo is running"
i_want = "aloo to get itself back on the server and show me where it is up to"
so_that = "I stay visible to everyone, including people who connect while I am away"

[[user_story.acceptance_criteria]]
id = "AC-222"
description = "A lost control connection is retried immediately, and every failure widens the wait: doubling from RECONNECT_FIRST_DELAY up to a ceiling of RECONNECT_MAX_DELAY, with no attempt limit and no giving up. From the client's side a server that is down, restarting, unreachable, or on the far end of a network that is off are indistinguishable, and every one of them ends with the server answering again. The schedule is saturating rather than shifting, so a session retrying for days cannot wrap back around into a tight loop."
evidence = "docs/PROTOCOL.md 4.2; docs/SPEC.md Functionality #19; src/client/reconnect.rs Backoff::delay_after, delay_after, RECONNECT_FIRST_DELAY, RECONNECT_MAX_DELAY, reconnect_loop; tests the_first_attempt_is_immediate_and_every_failure_widens_the_wait, the_wait_never_grows_past_the_ceiling; reconnecting.feature"

[[user_story.acceptance_criteria]]
id = "AC-223"
description = "The header's first element says what the control connection is doing, in green or red, and the selectors beside it start at the column the message list below them starts at. With a server it reads 'Connected to server!', 'Reconnecting...' while an attempt is in flight, 'Reconnecting in <n>s...' while waiting for the next one with the number counting down live, and 'Server down (reconnecting in <n> sec...)' once SERVER_DOWN_AFTER_ATTEMPTS attempts have failed - a reconnect reads as a hiccup until then, because most of them are. A label too long for the sidebar's width pushes the selectors right rather than being cut off: a countdown missing its number says nothing."
evidence = "docs/SPEC.md 'Connected UI', Functionality #19; docs/PROTOCOL.md 4.2; src/client/reconnect.rs ServerLinkState, waiting, label, seconds_left, SERVER_DOWN_AFTER_ATTEMPTS; src/client/tui/channel.rs server_state_line, server_link_color, server_state_width, messages_start_col; tests every_state_says_exactly_what_is_happening, a_reconnect_reads_as_a_hiccup_until_enough_attempts_have_failed, the_server_state_is_the_first_thing_on_the_header_row, the_selectors_start_where_the_message_list_below_them_does, a_state_too_long_for_the_sidebar_width_pushes_the_selectors_rather_than_truncating, every_server_state_renders_in_its_own_colour; reconnecting.feature"

[[user_story.acceptance_criteria]]
id = "AC-224"
description = "A session started with --no-server shows 'No server mode' in white instead of any reconnect state, and 'No server mode (punching)' while a direct UDP punch is in flight. There is nothing to reconnect to, so counting down at something that does not exist would be a lie; and with no server, punching is the only thing this client does to reach anybody, which is worth naming. With a server the same punch is the ordinary case and is not named there - the sidebar already colours the peer it belongs to."
evidence = "docs/SPEC.md 'Connected UI', Functionality #18/#19; docs/PROTOCOL.md 7.1.5; src/client/reconnect.rs ServerLinkState::NoServer, label; src/client/tui/ui.rs UiState::server_link_label; src/client/session.rs run_connected_session's serverless branch; tests a_punch_in_flight_is_only_worth_naming_when_there_is_no_server, no_server_mode_says_so_while_a_punch_is_in_flight; reconnecting.feature"

[[user_story.acceptance_criteria]]
id = "AC-225"
description = "A session whose server disappears is not ended: the loss is reported once, server-backed actions are refused as temporarily unavailable, direct links are untouched, and the connection is re-established on its own when the server comes back - the client then holding a fresh UserId, since a reconnect is an ordinary new connection as far as the server is concerned."
evidence = "docs/PROTOCOL.md 4.2, 4; src/client/reconnect.rs spawn_supervisor, ServerEvent; src/client/session.rs handle_server_event's Lost/Reconnected arms; test a_session_whose_server_disappears_gets_itself_back_on; reconnecting.feature"

[[user_story.acceptance_criteria]]
id = "AC-226"
description = "A nickname the server still holds is retried like any other failure rather than treated as fatal: the connection holding it is usually this client's own dead one, which the server frees within HEARTBEAT_TIMEOUT of it going quiet (5.4, 4.1). Giving up there would turn a network blink into being locked out of your own nickname."
evidence = "docs/PROTOCOL.md 4.2, 5.4, 4.1; src/client/reconnect.rs reconnect_loop (every Err is retried); test a_taken_nickname_is_an_ordinary_retryable_failure; reconnecting.feature"

[[user_story.acceptance_criteria]]
id = "AC-227"
description = "Reconnecting re-joins every channel the session was in, passwords included (remembered in memory for the session only, never written anywhere), so the client is put back into the member lists other clients are shown - including clients that connected while it was away. Everything the previous connection said about other people is dropped first - memberships, identities, and who among them had gone offline - since those UserIds were that connection's to hand out and the server behind the next one may not even be the same process. Nobody is marked offline by it: they did not go anywhere, this client stopped knowing. Whoever is still there comes back in the membership snapshot the re-joins bring."
evidence = "docs/PROTOCOL.md 4.2, 6.1; docs/SPEC.md Functionality #19; src/client/session.rs on_server_reconnected, forget_peer, channel_passwords; src/client/channel.rs handle_join; src/client/tui/ui.rs UiState::forget_server_presence; test a_session_reaped_by_the_server_reappears_in_a_later_arrival_s_member_list, a_reconnect_drops_what_the_old_connection_said_without_marking_anyone_offline; reconnecting.feature"

[[user_story.technical_behavior]]
id = "TB-226"
description = "The retry schedule is a value (Backoff) rather than two constants read directly, so a whole sequence of failures can be driven in milliseconds by a test instead of minutes - the same reason serve_with_heartbeat_timeout exists beside serve. Production always uses Backoff::default(), whose figures are the documented ones."
evidence = "docs/TESTING.md; src/client/reconnect.rs Backoff, ReconnectPlan::backoff; src/client/connect.rs connect_with_reconnect; test a_backoff_can_be_driven_faster_than_the_default_without_changing_its_shape"

[[user_story.technical_behavior]]
id = "TB-227"
description = "The session writes to a sink whose socket the supervisor replaces underneath it, so no call site knows a reconnect happened. A send with no connection installed is discarded rather than failed, exactly as NullSink discards one with no server at all and for the same reason: while the server is away ServerState is Unreachable, every action needing one is refused where it is asked for, and anything still arriving at the sink is a backstop rather than the mechanism."
evidence = "docs/PROTOCOL.md 4.2; src/client/reconnect.rs ServerSink, install, clear, is_connected; src/control.rs NullSink; tests a_sink_with_no_connection_installed_discards_instead_of_failing, installing_a_connection_makes_the_sink_usable_again"

[[user_story.technical_behavior]]
id = "TB-228"
description = "A control-channel write that fails drops the writer and wakes the supervisor instead of returning an error to the caller: with nothing arriving from the server there is nothing for the read half to fail on, so the heartbeat (4.1) is what finds a half-dead socket first - and every call site propagates with ?, which would end the very session reconnecting exists to keep."
evidence = "docs/PROTOCOL.md 4.2, 4.1; src/client/reconnect.rs ServerSink::send_control, spawn_supervisor's lost-channel select; test a_write_that_fails_drops_the_connection_and_reports_the_loss"

[[user_story]]
id = "US-041"
title = "Know whether the message you sent got there"
as_a = "someone who has just sent a message"
i_want = "to see whether it reached the people it was addressed to"
so_that = "I know whether silence means nobody answered or nobody got it"

[[user_story.acceptance_criteria]]
id = "AC-230"
description = "A message this client sent reads '<nickname> -> <body>', and that arrow is the indicator: it is coloured by how far the message has got. Text, voice messages and file transfers all carry one. Nothing else in the log does - a message from someone else, and the app's own system and presence lines, keep the plain ':' separator, because none of them has a delivery to report. In a private room the arrow has two states, gray while the one recipient has not confirmed decrypting it and green once they have. The OTP shield prefix stays where it always was, at the very start of the row."
evidence = "docs/SPEC.md 'Connected UI', Functionality #20; docs/PROTOCOL.md 7.2.1; src/client/tui/ui.rs LogEntry::delivery_status, DeliveryStatus::color, DELIVERY_ARROW, PLAIN_SEPARATOR, sender_prefix, render_messages; src/client/tui/direct_message.rs push_outgoing_dm; tests a_sent_direct_message_starts_undelivered_and_turns_delivered, the_arrow_is_coloured_by_how_far_the_message_has_got, only_messages_this_client_sent_carry_an_indicator, a_voice_row_and_a_file_row_carry_the_arrow_too, the_shield_prefix_stays_at_the_start_of_the_row; delivery_acknowledgment.feature"

[[user_story.acceptance_criteria]]
id = "AC-231"
description = "A channel message's arrow has three states rather than two, because one channel send is really one independently-addressed message per member: gray while no recipient has acknowledged it, orange once some but not all have, green once all have. A send that reached nobody at all reads gray rather than a vacuous green, and is additionally struck through with STRIKE_OVERLAY - it is not waiting on anybody's acknowledgement, so it must not look like it is."
evidence = "docs/SPEC.md 'Connected UI', Functionality #20; docs/PROTOCOL.md 7.2, 7.2.1; src/client/tui/ui.rs MessageDelivery::status, DeliveryStatus::color, LogEntry::reached_nobody, STRIKE_OVERLAY, strike_through, render_messages; src/client/tui/channel.rs push_outgoing_channel; tests a_channel_message_reads_orange_once_only_some_recipients_have_it, a_channel_message_addressed_to_nobody_is_not_delivered, a_message_that_reached_nobody_is_struck_through, a_message_that_reached_somebody_is_not_struck_through; delivery_acknowledgment.feature"

[[user_story.acceptance_criteria]]
id = "AC-232"
description = "Pressing i with the message log focused opens that message's details: sent_at, then one line per user it was sent to, each naming that user and, aligned to the right, that user's own coloured arrow followed by DELIVERED or UNDELIVERED. The popup absorbs every other key while open and closes on i or Escape. On a row that tracks no delivery it reads received_at and says so in place of the list, rather than showing an empty one."
evidence = "docs/SPEC.md 'Connected UI', Functionality #20; src/client/tui/ui.rs UiState::message_info, handle_messages_key, render_message_info_popup, SENT_AT_LABEL, RECEIVED_AT_LABEL, NO_DELIVERY_INFO, DELIVERED_LABEL, UNDELIVERED_LABEL; tests i_opens_the_details_of_the_selected_message, the_details_popup_names_every_recipient_with_its_own_state, the_details_popup_absorbs_other_keys_and_closes_on_escape, an_incoming_message_has_no_delivery_information_to_show; delivery_acknowledgment.feature"

[[user_story.acceptance_criteria]]
id = "AC-233"
description = "Delivery is a claim only the recipient can make, and it makes it explicitly: the sender names its message with a msg_id on what it sends, and the recipient answers DeliveryReceipt for that id once it has decrypted the content - never before, and never at all for content it could not open. A message held behind an identity review still counts as read: the gate decides whether to show it, not whether it made sense. The transport's own ack (7.1.1) is deliberately not used for this: it says a datagram arrived, which is a weaker claim than being able to read what was in it. A receipt is not a read receipt either, and does not survive a restart on either side."
evidence = "docs/PROTOCOL.md 7.1.1, 7.2.1; src/p2p_proto.rs P2pPayload::DeliveryReceipt, Envelope.msg_id; src/client/p2p.rs P2pEvent::Delivered; src/client/session.rs send_delivery_receipt; src/client/channel.rs on_message; src/client/direct_message.rs on_message; tests a_channel_message_is_receipted_once_it_has_been_decrypted, a_direct_message_is_receipted_once_it_has_been_decrypted, an_undecryptable_message_is_never_receipted, a_message_held_pending_a_trust_decision_is_still_receipted, a_message_carries_the_id_its_recipient_must_receipt, a_delivery_receipt_becomes_a_delivered_event_naming_its_sender; delivery_acknowledgment.feature"

[[user_story.technical_behavior]]
id = "TB-230"
description = "A msg_id is opaque to everything between the two ends: it is put on the wire by the sender, echoed back untouched by the recipient, and interpreted only by the sender that issued it. A payload carrying none asks for no receipt, which is what keeps the OTP layer's own provisioning traffic - envelopes nobody sees a row for - from generating receipts for rows that do not exist."
evidence = "docs/PROTOCOL.md 7.2.1; src/p2p_proto.rs P2pPayload::Envelope.msg_id, DeliveryReceipt; src/client/session.rs send_delivery_receipt; src/client/otp.rs (provisioning envelopes send msg_id None); tests a_message_that_names_nothing_is_never_receipted, a_payload_naming_no_message_earns_no_receipt, marking_delivered_is_idempotent_and_ignores_unknown_ids"

[[user_story.acceptance_criteria]]
id = "AC-235"
description = "A voice message and a file transfer are answered twice rather than once, because for them the interesting moment comes after decryption. The first answer is Decrypted: a file offer that opened, or a stream that ended having produced audio the receiver could decode. The second is Consumed, and comes later or never: the whole file written to disk, or the audio actually played. A transfer that fails part way, an offer that is rejected, a stream that decoded nothing, and a clip that is never played all earn no second answer - which is the truth about each of them. Both are different statements from the sending row's own completion, which is only about this side finishing sending."
evidence = "docs/SPEC.md 'Connected UI', Functionality #20; docs/PROTOCOL.md 7.2.1; src/p2p_proto.rs P2pPayload::FileOffer.msg_id, StreamStart.msg_id; src/client/session.rs remember_delivery_id, settle_delivery_id, handle_file_event; src/client/delivery.rs PendingReceipts, remember, settle; tests nothing_is_receipted_merely_for_arriving, a_file_is_receipted_only_once_it_has_all_arrived_decrypted, a_failed_transfer_is_never_receipted, a_voice_stream_that_decoded_nothing_is_never_receipted, one_transfer_earns_at_most_one_receipt; delivery_acknowledgment.feature"

[[user_story.acceptance_criteria]]
id = "AC-236"
description = "The details popup, and only the popup, shows what a recipient did with a message beyond being able to read it: DELIVERED+LISTENED in green for a voice message they have actually heard - on arrival, or later if it was muted at the time and they replayed it - and DELIVERED+SAVED in green for a file they have the whole of on disk. A text message never grows either, having nothing further to do, and the log's own arrow is unmoved by any of it: it stays a three-state summary of who has the message, not of what they did with it."
evidence = "docs/SPEC.md 'Connected UI', Functionality #20; docs/PROTOCOL.md 7.2.1; src/p2p_proto.rs ReceiptStage; src/client/tui/ui.rs LISTENED_LABEL, SAVED_LABEL, recipient_label, DeliveryRecipient.consumed, mark_delivered, owe_replay_receipt, LogEntry.owed_receipt, UiAction::ReplayVoice; src/client/session.rs handle_ui_action's ReplayVoice arm, the stream-finished arm; tests the_details_popup_distinguishes_heard_from_merely_decrypted, the_details_popup_says_saved_for_a_file_the_recipient_has_on_disk, a_text_message_has_no_extra_state_and_the_arrow_is_unchanged_by_one, replaying_a_clip_that_was_never_heard_pays_its_sender, replaying_a_clip_that_was_already_heard_owes_nothing; delivery_acknowledgment.feature"

[[user_story.technical_behavior]]
id = "TB-233"
description = "A session is constructible without a terminal, an audio device, a server or a peer (SessionState::for_test), so the receive paths that decide whether to acknowledge a message are tested through the real functions rather than around them. Every worker channel is created with its receiver dropped - safe because each is written to as a discarded send - and every on-disk store is pointed at a scratch directory, so a test can never touch real local state."
evidence = "docs/TESTING.md; src/client/session.rs SessionState::for_test, TestSessionSpec, peer_link_mut; src/client/p2p.rs PeerLinkManager::pending_payloads; tests a_channel_message_is_receipted_once_it_has_been_decrypted, a_message_held_pending_a_trust_decision_is_still_receipted"

[[user_story.technical_behavior]]
id = "TB-231"
description = "A message id is allocated by the UI and is unique across every channel log and private room in the session, which is what lets an acknowledgement - which names a peer and an id, never a conversation - be routed back to the one row that owns it. It is session-scoped and monotonic: nothing compares ids across restarts, so a message still unacknowledged when the client stops simply stays that way."
evidence = "docs/PROTOCOL.md 7.2.1; src/client/tui/ui.rs UiState::alloc_msg_id, mark_delivered, MessageDelivery.msg_id; tests an_acknowledgement_finds_its_row_in_any_conversation, marking_delivered_is_idempotent_and_ignores_unknown_ids, two_senders_using_the_same_stream_id_are_kept_apart"

[[user_story.acceptance_criteria]]
id = "AC-242"
description = "The message details popup names how that message's content was protected: the scheme by its mechanism (RSA-4096 OAEP/SHA-256, or ML-KEM-1024 + RSA-4096 -> AES-256-GCM with ML-DSA-87 signing) and a short fingerprint of the key it was sealed to (crypto::SHORT_FINGERPRINT_HEX characters). A channel send is sealed once per member with that member's own key, so it names no single key; a line this client wrote itself (a presence notice, the app's own OTP narration) reports no encryption at all."
evidence = "docs/SPEC.md 'Delivery acknowledgments'; src/client/tui/ui.rs MessageCrypto, LogEntry::crypto, UiState::message_crypto, crypto_lines, render_message_info_popup; src/crypto/mod.rs short_fingerprint_der; tests the_details_popup_names_the_scheme_and_the_key_a_dm_was_sealed_to, a_channel_send_to_several_people_names_no_single_key, a_presence_notice_reports_no_encryption_at_all; scenario features/messaging/delivery_acknowledgment.feature 'The details popup says how the message was encrypted'"


# ============================================================================
# US-042 - Read a warning without it wrecking the screen
# ============================================================================
[[user_story]]
id = "US-042"
title = "Read a warning without it wrecking the screen"
as_a = "user running aloo in a terminal"
i_want = "the app's own warnings to go somewhere I can read them rather than into the middle of the interface"
so_that = "the screen stays legible and the warning still reaches me"

[[user_story.acceptance_criteria]]
id = "AC-244"
description = "Nothing this app has to say about itself is ever written to the screen while the TUI owns it. Every diagnostic goes through log_warn!, whose sink is silenced for exactly as long as ratatui holds the terminal (client::tui::terminal::setup / restore) and writes one 'aloo:'-prefixed line to stderr everywhere else - a --server, --daemon or --foreground start, and every one-shot CLI subcommand. Lines emitted while silenced are replayed to stderr once the terminal has been handed back, so a warning worth emitting is still readable rather than dropped."
evidence = "docs/SPEC.md 'Where diagnostics go'; src/log.rs; src/client/tui/terminal.rs setup, restore; test a_silenced_sink_collects_every_line_and_replays_them_on_the_way_out; scenario features/diagnostics/where_warnings_go.feature 'A warning raised while the interface is up waits for the terminal'"

[[user_story.technical_behavior]]
id = "TB-235"
description = "The silenced sink keeps at most log::RING_CAPACITY lines and drops the oldest, so a session warning about the same thing for hours cannot grow it without bound; draining empties it, so a replay never happens twice."
evidence = "src/log.rs RING_CAPACITY, warn, take_collected, drain; test a_silenced_sink_collects_every_line_and_replays_them_on_the_way_out"
