[[user_story.technical_behavior]]
id = "TB-017"
description = "Registration records the client's display name, public key and key mode, and reports them back via user_info."
evidence = "docs/PROTOCOL.md 3 UserInfo; tests register_stores_user_info, user_info_reflects_registered_key_mode"

[[user_story.technical_behavior]]
id = "TB-018"
description = "Nickname matching is case-sensitive and reflects only currently-registered clients."
evidence = "docs/PROTOCOL.md 5.4; test name_taken_reflects_currently_registered_clients"

[[user_story.technical_behavior]]
id = "TB-019"
description = "A rejected registration does not register a second holder, leaving the original entry intact."
evidence = "docs/PROTOCOL.md 5.4 (atomic check-and-register); test try_register_rejects_a_nickname_already_in_use"

[[user_story.technical_behavior]]
id = "TB-020"
description = "A UserId is never reused, so the same nickname reconnecting is always a brand-new identity."
evidence = "docs/PROTOCOL.md 3; tests end_to_end_resume_rotation_after_reconnect_verifies_against_the_continuity_key, user_offline_is_permanent_for_the_session_since_a_user_id_is_never_reused"

[[user_story.technical_behavior]]
id = "TB-191"
description = "Any message received on a connection, not only Heartbeat, resets the server's per-connection heartbeat-timeout clock."
evidence = "docs/PROTOCOL.md 4.1; test ordinary_traffic_resets_the_heartbeat_timeout_clock"

