[[user_story.technical_behavior]]
id = "TB-192"
description = "otp --show-contact is the only place the real otp command reports each direction's byte offset into its pad - '--status --porcelain' (the interface every other read here uses) has no such field - and its own exit code cannot be used to detect a missing contact (verified directly against the installed binary: it prints an error to stderr but still exits 0), unlike --status's exit 1. So show_contact parses the command's human-readable 'Label: value' output instead of an exit code, and treats an output that doesn't start with 'Contact:' as 'no such contact' rather than trusting the process result."
evidence = "src/client/otp_cli.rs show_contact, parse_show_contact, ContactDetail; tests show_contact_is_none_for_an_unknown_contact"

[[user_story.technical_behavior]]
id = "TB-182"
description = "Per-contact OTP state (provisioned, the pending-ack sequence, the next outgoing/expected-incoming sequence) is a small flat file under ~/.aloo/, saved synchronously after every mutation rather than batched - unlike id_store's laxer cadence - because losing this state must never let aloo pass -y to otp --encrypt without real proof of delivery. A malformed line is skipped rather than failing the whole load."
evidence = "src/client/otp_store.rs OtpStore, OtpContactState; tests loading_a_missing_file_starts_empty_not_an_error, mark_provisioned_round_trips_through_save_and_load, a_malformed_line_is_skipped_rather_than_failing_the_whole_load, setup_payload_round_trips_through_the_wire_encoding, setup_ack_payload_round_trips_through_the_wire_encoding"

[[user_story.technical_behavior]]
id = "TB-183"
description = "The otp CLI subprocess wrapper maps the real binary's exit codes (0 success, 3 KEYCHAIN_REDELIVERED - no new key consumed, re-invoke - any other value an error) to a typed outcome, and parses --status --porcelain's stable key=value fields (including enc_ack_outstanding/dec_ack_outstanding) as the ground truth for whether a contact's previous message still awaits confirmation. The binary is only ever detected (PATH/ALOO_OTP_BIN/settings), never fetched, downloaded, or built."
evidence = "src/client/otp_cli.rs OtpCliConfig::resolve, binary_available, status, encrypt, decrypt; tests binary_available_is_true_for_the_real_installed_otp, status_is_none_for_an_unknown_contact, recover_last_sent_replays_without_consuming_key"

[[user_story.technical_behavior]]
id = "TB-184"
description = "An OTP session proposal that has not yet been answered (Content::OtpKeySetup carrying fresh pad bytes, or Content::OtpSessionRequest carrying none) is staged as a PendingOtpInvite in UI state rather than acted on immediately - nothing is written to the keychain and no reply is sent until the user's Accept/Reject reaches client::otp::accept_invite/reject_invite. Raw pad bytes held in that staged invite are zeroized on drop, the same standard crypto::otp::OtpKeySetupPayload holds itself to. The 'OTP session started at <timestamp>' notice formats the local wall-clock time when it can be read safely, falling back to labeled UTC when it can't (time::OffsetDateTime::now_local's own documented multithreading restriction, which this async app always trips)."
evidence = "src/client/tui/ui.rs PendingOtpInvite, push_otp_invite, take_otp_invite; src/client/otp.rs on_key_setup, on_session_request, format_now; tests an_invite_holding_key_material_is_zeroized_on_drop, format_now_never_panics_and_always_returns_something"

[[user_story.technical_behavior]]
id = "TB-185"
description = "Every piece of this app's local state - id_store, the connect cache, settings, and the OTP layer's own otp_store/otp/.keychain/ - lives under one directory, resolved from ALOO_HOME when set (the exact directory, never joined with .aloo) or else the platform home directory joined with .aloo. Two aloo clients on the same machine - the ordinary way to test or demo two peers before deploying across real machines, and how a stuck OTP ack-gate from exactly this kind of collision was first found - otherwise silently share that directory: harmless for most of those stores, but actively corrupting for the OTP layer, whose keychain and per-contact ack-gate state each only ever represent one party's own view."
evidence = "src/platform.rs aloo_dir, resolve_aloo_dir; tests resolve_aloo_dir_prefers_aloo_home_over_the_derived_dot_aloo, resolve_aloo_dir_treats_an_empty_aloo_home_as_unset, resolve_aloo_dir_falls_back_to_home_dot_aloo_when_aloo_home_is_unset"

[[user_story.technical_behavior]]
id = "TB-186"
description = "A freshly generated one-time-pad (2MB by default, both keys combined) is never sent as a single pq_hybrid envelope - it rides one UDP datagram with no fragmentation of its own below this layer, and a payload that size silently fails the underlying send (past the OS's ~65KB ceiling, discarded rather than erroring, since transmission uses best-effort try_send_to). Instead it is split into many small OtpKeySetupChunk envelopes and reassembled on the receiving side by OtpKeySetupReassembly, keyed per sender, before ever being staged as an invite. A chunk that does not continue the accumulation in progress for that sender (wrong contact_name, wrong total_len, or an offset that doesn't pick up exactly where the last accepted chunk left off) is rejected rather than spliced in, so a stale or unrelated attempt can never produce a corrupted 'complete' payload."
evidence = "src/crypto/otp.rs OtpKeySetupChunk, OtpKeySetupReassembly; src/client/otp.rs send_key_setup_chunked, on_key_setup, OTP_SETUP_CHUNK_BYTES; src/client/session.rs SessionState.otp_incoming_setup; tests key_setup_chunk_round_trips_through_the_wire_encoding, reassembly_of_a_multi_megabyte_pad_split_into_many_small_chunks_matches_the_original, reassembly_is_not_complete_until_the_last_chunk_lands, reassembly_rejects_a_chunk_that_does_not_continue_it"

[[user_story.technical_behavior]]
id = "TB-187"
description = "otp --remove-contact <name> deletes a keychain entry outright (pad material and all) and is only ever invoked in response to something already authenticated over the pq_hybrid channel - the peer's own signed report that they have no matching key. A failure to remove is treated as best-effort (logged, not fatal): the worst case is the next --add-contact failing the exact same way it already was, not corruption. Removing a name that never existed is itself still an error the caller must check, unlike --has-contact's plain boolean."
evidence = "src/client/otp_cli.rs remove_contact; tests remove_contact_deletes_an_existing_contact, remove_contact_on_an_unknown_contact_fails, a_removed_contacts_name_can_be_reprovisioned_from_scratch"

