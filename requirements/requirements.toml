# US-044 - Encrypt the connection to the server with TLS
# ============================================================================
[[user_story]]
id = "US-044"
title = "Encrypt the connection to the server with TLS"
as_a = "user or operator on a network I do not fully trust"
i_want = "the option to run the control connection over TLS"
so_that = "a certificate - not just the sealed control channel's own ephemeral offer - vouches for the server I am actually talking to"

[[user_story.acceptance_criteria]]
id = "AC-262"
description = "server_ssl=on serves the control connection under the certificate pair named by server_ssl_fullchain/server_ssl_privkey; a certificate and key that do not load or do not match each other refuse the server's startup outright, naming the problem, rather than falling back to plaintext. A client with ssl on and the certificate's own root trusted completes a real TLS handshake and exchanges bytes over it; one that does not trust the root refuses the handshake."
evidence = "docs/PROTOCOL.md 1.4; src/server/ssl.rs SslFiles, load_acceptor, accept, connect; src/main.rs run_server; tests server_ssl_on_without_a_certificate_refuses_to_start, a_real_tls_handshake_carries_bytes_both_ways, a_client_with_the_wrong_trust_root_refuses_the_handshake, load_acceptor_reports_which_file_is_missing, ssl_files_from_settings_is_none_unless_server_ssl_is_on"

[[user_story.acceptance_criteria]]
id = "AC-263"
description = "A client trusts the public roots it ships with plus, optionally, one PEM file of extra roots (connect_ssl_ca) for a self-signed or privately issued server certificate; the certificate is checked against the host the user typed. `connect_using_ssl` - the one setting for this, shared by a normal connect and a daemon start, with no popup field and no CLI flag able to override it - carries this choice through to the same connect path either way."
evidence = "docs/PROTOCOL.md 1.4; src/server/ssl.rs client_connector, connector_from_roots, server_name; src/client/connect.rs open_control_channel; src/client/daemon.rs DaemonConfig; tests connector_from_roots_rejects_an_unparsable_extra_ca_file, server_name_accepts_a_hostname_and_an_ip_and_refuses_the_empty_string, ssl_is_settings_only_and_cannot_be_toggled_from_the_popup (ui_connect_popup_test.rs), ssl_comes_only_from_the_settings_file (daemon_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-261"
description = "A daemon connects over TLS when `connect_using_ssl=on` and otherwise over plain TCP - the only place this is decided for a daemon start, with no `--ssl` flag able to override it; either way the choice is carried into the same ConnectRequest a foreground client builds, so the handshake itself is shared rather than reimplemented for headless use."
evidence = "src/client/daemon.rs DaemonConfig::resolve, to_connect_request; tests ssl_comes_only_from_the_settings_file, the_daemon_connects_with_the_resolved_password"

[[user_story.acceptance_criteria]]
id = "AC-365"
description = "`connect_with_reconnect`'s own first connect attempt is bounded by `CONNECT_TIMEOUT` (15s) - a client that skips TLS against an SSL-only server, or the reverse, does not fail cleanly on its own, it deadlocks (the server's TLS accept waits for a `ClientHello` that never comes; the client waits for a `Hello` that never comes either), so this is what actually resolves it. Whether the attempt fails outright or times out, and the reason is not already meaningful on its own (not a wrong password, a taken nickname, a deactivated account, or a pending activation code - reaching any of those already proves the transport mode was right), `with_ssl_diagnosis` makes one further bounded-time (~4s, `SSL_DIAGNOSIS_TIMEOUT`) diagnostic attempt at the same host/port with the opposite of `connect_using_ssl`, purely to explain the failure - never to actually connect that way. If that opposite attempt gets a real `Hello` back, the original error is wrapped in a distinct `SslMismatchError` naming a specific reason (\"this server appears to require SSL\" / \"...appears to reject SSL\", naming `connect_using_ssl`) - the connect popup catches it by type and loops back into the form with the reason shown in red (the same way a wrong password already does), rather than exiting the client the way an unclassified connect failure still does; a daemon start just propagates it and fails with the same reason. If the opposite attempt also fails, the original error is returned unchanged. The real session that follows, if any, always uses exactly what `connect_using_ssl` said - never the probed alternative. A later automatic reconnect hitting the same kind of mismatch is AC-390's, not this one's."
evidence = "src/client/connect.rs connect_with_reconnect, with_ssl_diagnosis, diagnose_ssl_mismatch, SslMismatchError, CONNECT_TIMEOUT, SSL_DIAGNOSIS_TIMEOUT; tests a_plain_attempt_against_an_ssl_only_server_is_diagnosed, an_ssl_attempt_against_a_plain_server_is_diagnosed, a_password_failure_is_never_probed_for_an_ssl_mismatch (reconnect_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-390"
description = "An *automatic* reconnect (`reconnect::reconnect_loop`, after the first connection already succeeded) is bounded and diagnosed exactly like the first connect attempt (AC-365), not left to hang: `handshake_as_bounded_and_diagnosed` wraps `handshake_as` in the same `CONNECT_TIMEOUT` and runs it through the same `with_ssl_diagnosis`. Before this, a transport-mode mismatch discovered mid-session (the operator flips `server_ssl`, or a client's `connect_using_ssl` disagrees with a server it reconnects to) parked the supervisor task on that one `.await` forever - no `ServerEvent::Waiting`, no status notice, no further retries, nothing short of killing the process. Now the mismatch surfaces the same specific reason a first connect would, on the very next `ServerEvent::Waiting`, and retries continue on the ordinary backoff schedule afterward."
evidence = "docs/PROTOCOL.md 1.4; src/client/connect.rs handshake_as_bounded_and_diagnosed; src/client/reconnect.rs reconnect_loop; tests a_reconnect_across_a_plain_to_ssl_only_flip_is_diagnosed_not_hung, a_reconnect_across_an_ssl_to_plain_flip_is_diagnosed_not_hung (reconnect_test.rs)"

[[user_story.technical_behavior]]
id = "TB-241"
description = "server_ssl, server_ssl_fullchain, server_ssl_privkey, server_allow_registration and the four server_smtp_* keys all round-trip through ~/.aloo/settings, and are written - even to an empty value - on the very first save, so an operator setting a server up finds every one of them already named in the file."
evidence = "src/settings.rs Settings::server_ssl and neighbours; tests server_ssl_registration_and_smtp_keys_are_written_even_when_unset, server_ssl_registration_and_smtp_keys_round_trip, server_switches_accept_every_documented_spelling, server_start_writes_the_ssl_and_registration_keys_and_keeps_them"

