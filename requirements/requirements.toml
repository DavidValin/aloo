[[user_story.technical_behavior]]
id = "TB-191"
description = "Any message received on a connection, not only Heartbeat, resets the server's per-connection heartbeat-timeout clock."
evidence = "docs/PROTOCOL.md 4.1; test ordinary_traffic_resets_the_heartbeat_timeout_clock"

