[[user_story.technical_behavior]]
id = "TB-190"
description = "A duplicate UserJoined for someone already listed as a member logs no second notice, and the existing-member snapshot a fresh join receives logs none at all - both keyed off whether the channel was already ChannelTab::joined before the call, mirroring the ordering TB-159 already establishes."
