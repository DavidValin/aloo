[[user_story.acceptance_criteria]]
id = "AC-364"
description = "When a surface's history reader first opens, it skips exactly `log.len()` of the file's newest records only if `autosave_messages` is on for this session - that many, and no more, are guaranteed to be this session's own live entries already mirrored to the file's tail (every append this session was hooked through `export::autosave_entry`). With `autosave_messages` off, nothing this session reached disk, so no records are skipped regardless of how many entries a surface's live log already holds when history-reading starts - skipping unconditionally would silently drop that many genuine, never-seen historical records instead."
