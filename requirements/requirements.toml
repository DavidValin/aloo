[[user_story.technical_behavior]]
id = "TB-168"
description = "bundle_fingerprint covers the identity fields (ML-DSA verifying key, RSA signing key, bootstrap encryption keys) and excludes the continuity certificate - otherwise a certificate would have to sign the fingerprint of a bundle that already contains it. fingerprint_of_encoded is the same value computed from a bundle still in announced form, returning None if those bytes are not a bundle."
