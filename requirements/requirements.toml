[[user_story.acceptance_criteria]]
id = "AC-240"
description = "The host, port and nickname a connection was last made with are recorded in ~/.aloo/settings (connect_host / connect_port / connect_nickname) whether or not that connection then succeeded, and prefill the connect popup next time. The nickname lives only here - the connect cache is keyed by (host, port) and holds keybundle paths, with no slot for the one field that is about the person rather than the server - so without it every fresh start would propose $USER. Recording merges into the file rather than rewriting it, and a start with no host to record (--no-server) leaves the recorded host alone."
evidence = "docs/SPEC.md 'Not connected UI'; src/settings.rs Settings::remember_connection; src/client/connect.rs run_client_inner, prefill_connect_defaults; tests the_last_connection_is_remembered_and_read_back, a_second_connection_replaces_what_the_first_recorded, remembering_a_connection_leaves_every_other_key_alone, a_connection_with_no_host_leaves_the_recorded_host_alone, prefill_connect_defaults_restores_the_last_nickname_from_settings, settings_beat_the_cache_for_host_and_port_but_not_for_the_keybundle, an_empty_settings_file_leaves_the_proposed_nickname_alone; scenario features/connecting/connect_form.feature 'The form comes back as whoever connected last'"


# ============================================================================
# US-002 - Authenticate to the server
# ============================================================================
[[user_story]]
id = "US-002"
title = "Authenticate to the server"
as_a = "server operator"
i_want = "to gate who may connect, by shared password or RSA keypair"
so_that = "only clients I have authorised can join"

[[user_story.acceptance_criteria]]
id = "AC-013"
description = "A client presenting the correct credential is let in; one presenting a wrong credential is rejected."
evidence = "docs/PROTOCOL.md 5; tests password_auth_accepts_correct_and_rejects_wrong, rsa_auth_accepts_valid_challenge_response_and_rejects_wrong_key, end_to_end_wrong_password_is_rejected"

[[user_story.acceptance_criteria]]
id = "AC-014"
description = "A server started with no auth accepts any client without a credential."
evidence = "docs/PROTOCOL.md 5.1; test none_auth_kind_and_no_challenge"

[[user_story.technical_behavior]]
id = "TB-013"
description = "The advertised AuthKind matches the configured mode, and a challenge nonce is issued for rsa only."
evidence = "docs/PROTOCOL.md 5.1-5.3; tests none_auth_kind_and_no_challenge, password_auth_accepts_correct_and_rejects_wrong, rsa_auth_accepts_valid_challenge_response_and_rejects_wrong_key"

[[user_story.technical_behavior]]
id = "TB-014"
description = "An AuthResponse of the wrong variant for the advertised AuthKind is treated as an authentication failure."
evidence = "docs/PROTOCOL.md 5; tests rsa_auth_rejects_response_of_the_wrong_kind, none_auth_kind_and_no_challenge"

[[user_story.technical_behavior]]
id = "TB-015"
description = "Credential comparison is constant-time, including for unequal lengths and empty inputs."
evidence = "docs/PROTOCOL.md 5.2; src/crypto/mod.rs constant_time_eq; test constant_time_eq_matches_regular_equality"

[[user_story.technical_behavior]]
id = "TB-016"
description = "A challenge nonce is freshly drawn random bytes of the requested length, differing between draws."
evidence = "docs/PROTOCOL.md 5.3 (32 random bytes per connection); test random_bytes_have_requested_length_and_are_not_trivially_constant"

[[user_story.technical_behavior]]
id = "TB-112"
description = "A stray Auth or Identify sent after the handshake is already complete gets Error { message: \"unexpected message after handshake\" }, and the connection stays open afterward - unlike the pre-handshake failures, which close it."
evidence = "docs/PROTOCOL.md 4; test end_to_end_stray_auth_and_identify_after_handshake_error_but_stay_connected"

[[user_story.technical_behavior]]
id = "TB-114"
description = "The server's --bind and --port flags default to 0.0.0.0 and 7878 respectively, and are parsed into the address it listens on."
evidence = "docs/SPEC.md 'Server startup'; tests help_advertises_the_documented_bind_and_port_defaults, server_bind_and_port_flags_are_parsed_into_the_listen_address"

