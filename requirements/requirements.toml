[[user_story.technical_behavior]]
id = "TB-219"
description = "Attach-protocol messages and key events round-trip through the same length-prefixed bincode framing the network protocol uses. Every named key code, modifier set and event kind survives intact; an unnamed key code arrives as Other rather than vanishing, and an unknown modifier bit is dropped rather than failing the keystroke. A partial frame decodes to 'not yet' rather than an error, and several frames in one read are consumed one at a time."
evidence = "src/client/daemon_ipc.rs KeyWire, KeyCodeWire, AttachMessage, DaemonMessage, encode_frame, decode_frame; tests every_named_key_code_round_trips, modifiers_and_event_kinds_round_trip, an_unnamed_key_code_becomes_other_rather_than_being_dropped, an_unknown_modifier_bit_is_dropped_not_fatal, attach_messages_round_trip_through_a_frame, daemon_messages_round_trip_through_a_frame, a_partial_frame_decodes_to_nothing_yet_rather_than_an_error, several_frames_in_one_buffer_are_consumed_one_at_a_time"

[[user_story.technical_behavior]]
id = "TB-220"
description = "The attach channel is created private to its owner - on Unix, a socket mode 0600; on Windows (no Unix domain sockets), a named pipe with a DACL (SDDL D:(A;;GA;;;OW)) granting access to its creator alone, overriding the OS default of read-access-to-everyone - and connect refuses one owned by (Unix: uid; Windows: token SID) a different user. The pid and log files live beside it (the socket path, on Unix) under the same ~/.aloo directory so ALOO_HOME separates two daemons; Windows' bind_listener/connect never read or write that path at all, since the channel there is the pipe, not a file. Whether a daemon is running is decided by connecting rather than by the socket file existing, so a second daemon refuses while one is listening - naming the pid that holds it - while the debris a SIGKILLed daemon leaves behind is replaced rather than treated as a live instance (Unix only - a killed daemon's named pipe leaves no such debris on Windows). The pid and, on Unix, socket files are removed when the daemon exits."
evidence = "docs/SPEC.md 'Running in background mode' 'Files it owns'; docs/SECURITY.md; src/client/daemon_ipc.rs bind_listener, connect, is_daemon_running, socket_path, pid_path, log_path, owner_only_security_descriptor, create_owner_only_pipe_instance, verify_pipe_owner_is_current_user; src/client/daemon.rs SingleInstance; tests the_socket_is_created_private_to_this_user, the_daemon_files_sit_together_under_the_aloo_directory, a_stale_socket_file_is_replaced_rather_than_refused, a_running_daemon_is_detected_by_connecting_not_by_the_file, acquiring_records_the_pid_and_releasing_cleans_up, a_second_daemon_refuses_while_one_is_listening, a_daemon_starts_over_the_debris_of_a_killed_one, a_running_daemon_is_detected_and_its_pid_file_cleaned_up_windows"

[[user_story.acceptance_criteria]]
id = "AC-204"
description = "The join sound (assets/joined.wav) plays only in daemon mode, only while no terminal is attached, and only for the *current* focus rather than the --initial-focus the daemon started with. On a channel focus every arrival in that channel is announced; on a DM focus the focused person coming online is announced once however many shared channels the arrival reaches us through, and again the next time they come online after going offline. A foreground client, an attached one, an unfocused channel, anyone but the focused person, and having nothing focused at all are all silent."
evidence = "docs/SPEC.md 'Running in background mode'; src/client/daemon.rs DaemonPlan::should_play_joined_chime; src/client/tui/ui.rs UiState::current_focus, CurrentFocus; src/client/session.rs on_daemon_peer_appeared, SessionState::viewer_attached/announced_online; scenarios features/daemon/the_join_sound.feature"

[[user_story.acceptance_criteria]]
id = "AC-205"
description = "When a --otp daemon proposes an OTP session to the peer it is focused on and that session does not start - they decline, this side cannot store its half of the pad, or the proposal is refused before it is even sent (no otp binary, either side not pq_hybrid, an unreadable identity) - it plays the alert sound and raises a notification, since the shortcut is now ready to send voice that is not pad-protected. A session that starts is silent, a session somebody typed /otp for themselves is never announced, and the outcome is reported once rather than once per message mentioning it."
evidence = "docs/SPEC.md 'Running in background mode'; src/client/session.rs daemon_otp_outcome, SessionState::daemon_awaiting_otp, handle_ui_action's RequestOtpSession arm; src/client/otp.rs on_key_setup_ack; scenarios features/daemon/the_otp_alert.feature"

[[user_story.technical_behavior]]
id = "TB-215"
description = "A detached surface draws nothing at all rather than rendering to a sink - the state a daemon spends nearly all its life in has to be free, not merely quiet. An attached one emits exactly one message per frame (not one per internal write), and a frame written after its viewer has gone is dropped rather than raised as an error, so a viewer vanishing mid-frame cannot fail the session."
evidence = "src/client/tui/surface.rs Surface::draw, AttachWriter::flush, Surface::detach; tests a_detached_surface_draws_nothing_at_all, an_attached_surface_emits_one_message_per_frame, detaching_closes_the_frame_channel_and_stops_drawing, a_frame_written_after_the_viewer_is_gone_is_dropped_not_an_error, detaching_a_surface_that_was_never_attached_is_a_no_op"

[[user_story.technical_behavior]]
id = "TB-216"
description = "The attach backend answers from what its viewer reported the three questions CrosstermBackend answers by querying its own stdout - which in a daemon is /dev/null: terminal size, window size, and cursor position (whose real implementation would block reading a Device Status Report reply from a stdin nobody is writing to). A zero dimension reported mid-resize is clamped to 1 rather than trusted."
evidence = "src/client/tui/surface.rs AttachBackend::size/window_size/get_cursor_position, TerminalSize::new, Surface::resize; tests the_attach_backend_reports_the_size_its_viewer_declared, the_attach_backend_tracks_the_cursor_instead_of_asking_for_it, a_zero_dimension_is_clamped_rather_than_trusted, resizing_an_attached_surface_redraws_at_the_new_size, resizing_a_detached_surface_is_a_no_op"

[[user_story.acceptance_criteria]]
id = "AC-241"
description = "A daemon start with no flags and no daemon_* keys of its own falls back to the connection the connect popup last recorded (connect_host / connect_port / connect_nickname) before reaching the connect cache - so a first `aloo --daemon` on a machine that has only ever been used interactively comes back on the same server as the same person, with nothing to supply on the command line. A flag given this run still wins, and a previous daemon start's own daemon_* keys still come first."
evidence = "docs/SPEC.md 'Running in background mode'; src/client/daemon.rs DaemonConfig::resolve; tests the_last_interactive_connection_fills_in_what_no_daemon_start_ever_recorded, a_previous_daemon_start_still_beats_the_last_interactive_connection, a_flag_beats_the_last_interactive_connection_too; scenario features/daemon/starting_a_daemon.feature 'A first daemon reuses the last connection made by hand'"


# ============================================================================
# US-039 - Keep a direct link to a peer with no server involved
# ============================================================================
[[user_story]]
id = "US-039"
title = "Keep a direct link to a peer with no server involved"
as_a = "user who already knows where a particular person's machine is on the internet"
i_want = "my client to punch a direct UDP link to them on a schedule we both keep, without any server arranging it"
so_that = "we can reach each other even when there is no server we both trust, or none running at all"

[[user_story.acceptance_criteria]]
id = "AC-206"
description = "With direct_punch=on, each direct_punch_to peer gets its own background attempt on a slot grid that restarts at every o'clock and steps by that peer's frequency - so both ends, running the same setting, probe at the same wall-clock moments with nothing coordinating them but the clock. An attempt punches straight at the configured host and port using the same Ping/Pong handshake a server-arranged link uses, and no candidate exchange is relayed through any server at any point."
evidence = "docs/PROTOCOL.md 7.1.5; docs/SPEC.md 'Direct punch settings'; src/settings.rs PunchFrequency::slot_of_hour, src/client/p2p.rs PeerLinkManager::configure_direct_punch/direct_tick/begin_direct_attempt/send_direct_ping, utc_second_of_hour; tests every_frequencys_slot_grid_restarts_at_the_top_of_the_hour, two_peers_punch_a_link_from_the_schedule_alone_and_carry_a_message; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-207"
description = "A link opened this way is an ordinary direct link: once it is up it carries the same reliably-delivered content (text, files, voice) over the same transport as one the server helped arrange, and is maintained by the same keepalive and liveness rules."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs PeerLinkManager::on_direct_pong (activation via the shared on_pong), send_reliable_or_queue; test two_peers_punch_a_link_from_the_schedule_alone_and_carry_a_message; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-208"
description = "A slot arriving for a peer whose link is already up does nothing at all - the link is never re-punched, re-nonced or interrupted on a schedule; only losing it re-opens the question."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs PeerLinkManager::direct_tick (the Established arm), begin_direct_attempt's already-Active guard; test a_slot_arriving_on_a_link_that_is_already_up_does_not_punch_again; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-209"
description = "One attempt probes for the whole of DIRECT_PUNCH_WINDOW and is then abandoned until that peer's next slot, rather than running until the next attempt would overlap it. The window really is spent probing: the link underneath has a much shorter punch timeout of its own, so an attempt spans as many link-level attempts (each with a fresh nonce) as the window has room for, instead of quietly falling silent after the first one."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs DIRECT_PUNCH_WINDOW, PeerLinkManager::direct_tick's Punching arm, rearm_direct_link, give_up_direct_attempt; tests an_attempt_probes_for_the_punch_window_and_is_then_abandoned_until_the_next_slot, probing_really_continues_for_the_whole_window_not_just_one_link_attempt; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-210"
description = "A direct link that was up and dropped accidentally is re-punched straight away, outside its schedule, for up to DIRECT_MAX_RECONNECTS attempts - but only for a peer no server could re-signal instead; the budget is forgiven the moment the link comes back, so it bounds one outage rather than the session."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs DIRECT_MAX_RECONNECTS, PeerLinkManager::on_direct_link_dropped, give_up_direct_attempt, on_direct_pong's reconnect reset; test a_direct_only_link_that_drops_is_reconnected_up_to_the_reconnect_budget; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-211"
description = "There is never more than one peer-to-peer link between two people, whichever way it was opened: while a direct punch owns a peer's link nothing is signalled through the server for them (not a send, not a retry backoff, not a relayed proposal from the peer), and a direct target for someone the server does name is filed under that same UserId so the two routes converge on one link rather than one each. An already-open link moves with that change rather than being left behind under the identity it was opened with - the ordering that makes this matter (a link punched to someone who is not on the server, who connects to it later) is the normal one in daemon mode, and leaving it behind is what would silently produce the second link this forbids. It moves back the same way when they leave the server again, since that says nothing about whether the direct path still works."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs PeerLinkManager::direct_owns, ensure_link, on_peer_candidates, retry_due, set_direct_peer_id, rekey_link, release_direct_peer_id, is_direct_peer_id; src/client/session.rs handle_server_message's UserJoined/UserOffline arms; tests a_peer_being_punched_directly_is_never_also_signalled_through_the_server, a_direct_target_moves_onto_the_user_id_the_server_gives_it, a_peer_who_joins_the_server_after_a_direct_link_is_up_gets_only_one_link; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-212"
description = "~/.aloo/settings accepts direct_punch=on plus one direct_punch_to=<nickname>,<host>,<frequency> line per peer, where the host is an IPv4 address, an IPv6 address or a hostname and may carry its own port (defaulting to DEFAULT_DIRECT_PUNCH_PORT), and the frequency is one of the documented values; all of it survives a save/load round trip."
evidence = "docs/SPEC.md 'Direct punch settings'; README.md 'Direct punching'; src/settings.rs DirectPunchTarget::parse/to_setting_value, PunchFrequency::parse, PUNCH_FREQUENCIES, Settings::parse/save; tests direct_punch_on_reads_one_target_per_line, a_target_host_may_be_ipv4_ipv6_or_a_name_and_may_carry_its_own_port, every_documented_frequency_parses_and_nothing_else_does, direct_punch_settings_survive_a_save_and_load_round_trip, direct_punch_is_off_and_targetless_unless_the_file_turns_it_on; direct_punch.feature"

[[user_story.acceptance_criteria]]
id = "AC-213"
description = "A direct_punch_to line that does not parse is reported with the reason rather than silently ignored, and never costs the lines around it - a typo'd nickname, host or frequency must not be indistinguishable from a peer who simply never answers."
evidence = "docs/SPEC.md 'Direct punch settings'; src/settings.rs Settings::direct_punch_invalid; src/client/session.rs run_connected_session's settings load; test a_malformed_target_is_reported_rather_than_silently_dropped; direct_punch.feature"

[[user_story.technical_behavior]]
id = "TB-221"
description = "The slot grid is computed from the UTC second of the hour, and restarts at every o'clock rather than running continuously - which is what makes an interval that does not divide 60 (every_55m) well defined, and what keeps two peers in time zones with fractional-hour offsets on the same grid. A client started mid-slot waits for the next boundary rather than probing immediately, since a probe at any moment its peer has no reason to be probing back is wasted."
evidence = "docs/PROTOCOL.md 7.1.5; src/settings.rs PunchFrequency::slot_of_hour; src/client/p2p.rs utc_second_of_hour, PeerLinkManager::configure_direct_punch (last_slot seeding), direct_tick; tests every_frequencys_slot_grid_restarts_at_the_top_of_the_hour, an_interval_that_does_not_divide_the_hour_still_restarts_at_oclock, the_slot_clock_is_the_utc_second_of_the_hour"

[[user_story.technical_behavior]]
id = "TB-222"
description = "The serverless handshake carries the sender's nickname (DirectPing/DirectPong) because nothing else can identify them: no candidate exchange named a UserId, and the source address is exactly what the receiver is trying to learn. A probe is answered only for a nickname the receiver itself lists in direct_punch_to - anyone else gets nothing back, so the fixed port is no more discoverable by scanning it than an ephemeral one, and a nickname longer than MAX_DIRECT_PUNCH_NICK_LEN is dropped before it is looked up at all. A configured peer's probe also opens this side's own attempt, since their clock is as good an alarm as ours and without answering in kind there is no second direction to punch open."
evidence = "docs/PROTOCOL.md 7.1.5; src/p2p_proto.rs PunchDatagram::DirectPing/DirectPong, MAX_DIRECT_PUNCH_NICK_LEN; src/client/p2p.rs PeerLinkManager::on_direct_ping, on_direct_pong, on_datagram_at's direct arms; tests punch_datagrams_roundtrip, a_direct_ping_naming_a_nickname_that_is_not_configured_is_ignored, a_peers_probe_is_answered_and_opens_this_sides_attempt_too"

[[user_story.technical_behavior]]
id = "TB-223"
description = "A peer known only from settings is filed under a synthetic UserId derived from their nickname, with its top bit set so it can never collide with a server-assigned id (the server hands those out from a counter starting at 1). That bit is also the test for 'could a server re-establish this link at all', which is what decides whether an accidental loss spends the direct reconnect budget or is left to the ordinary re-signalling path - asked session-wide instead, a peer only ever reachable directly would be handed to a path that can never reach them."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs direct_peer_id, is_direct_peer_id, on_direct_link_dropped, retry_due, ensure_link; tests a_nickname_derived_peer_id_is_stable_and_never_collides_with_a_servers, a_peer_being_punched_directly_is_never_also_signalled_through_the_server"

[[user_story.acceptance_criteria]]
id = "AC-214"
description = "A peer reached with no server is placed in the channels both sides have joined, from a sealed ChannelPresence announcement they send when the link opens and again whenever their own membership changes. The list is authoritative rather than additive, so a channel dropped from it is how a peer says they left, and only channels this client has itself joined are ever considered. Once placed, nothing downstream can tell them apart from a peer a server introduced: the sidebar lists them, channel sends and voice address them, the call roster includes them, and --initial-focus resolves to them - which is what makes a daemon's channel focus and its global push-to-talk work over a punched link. A peer sharing no channel is still registered as a DM peer."
evidence = "docs/PROTOCOL.md 7.1.5; docs/SPEC.md 'Direct punching'; src/proto.rs Content::ChannelPresence; src/p2p_proto.rs P2pPayload::ChannelPresence; src/client/session.rs reconcile_direct_membership, on_channel_presence, send_channel_presence, broadcast_channel_presence; src/client/tui/channel.rs channels_containing_member, is_member_of_channel; tests announced_membership_is_reconciled_against_our_own_joined_channels, content_channel_presence_envelope_roundtrips, and end to end between two whole serverless sessions in test/daemon_session_test.rs (two_serverless_sessions_punch_to_each_other_and_each_registers_the_other); becoming_a_real_peer.feature"

[[user_story.acceptance_criteria]]
id = "AC-215"
description = "A peer is registered only on the first thing that authenticates them, never on a DirectPing, whose nickname is unauthenticated and could be claimed by anyone able to reach the port. Registration always requires a pinned identity for that nickname - a nickname alone names nobody - and then one of two proofs: an envelope that opens under that pin, or, for a pin that is not a keybundle, the pad opening a message sent under it (AC-259). Either way the proof is what registers them, and the pin is where their key comes from."
evidence = "docs/PROTOCOL.md 7.1.5, 13.4; src/client/session.rs direct_peer_identity, on_channel_presence (opens via decrypt_own_envelope before registering anything); src/client/idstore.rs IdStore::get; tests a_nickname_names_someone_only_once_something_is_pinned_for_it, a_direct_ping_naming_a_nickname_that_is_not_configured_is_ignored, and end to end in two_serverless_sessions_punch_to_each_other_and_each_registers_the_other (whose pin, removed, is what makes it fail); becoming_a_real_peer.feature"

[[user_story.technical_behavior]]
id = "TB-224"
description = "A direct target's nickname is recoverable from the UserId its link is filed under (direct_nickname_of), which is what turns a link back into the name its key is pinned under, and the set of serverless peers whose links are up is enumerable (active_direct_peers) so a membership change can be announced to exactly them. Leaving a channel never forgets a link the direct scheduler owns: that link was opened from settings and a schedule, not from the channel, so a channel departure says nothing about whether to keep it."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs PeerLinkManager::direct_nickname_of, active_direct_peers; src/client/channel.rs handle_leave's direct-peer guard; tests a_direct_targets_nickname_and_live_peers_are_queryable; becoming_a_real_peer.feature"

[[user_story.acceptance_criteria]]
id = "AC-217"
description = "With no server there is nothing to join a channel through, so ~/.aloo/settings' direct_punch_channel lines are the channels this client is in: read one per line, validated against the same channel-name rules a server would apply, de-duplicated, kept in file order, and surviving a save/load round trip. They are seeded as joined at startup and are also the whole of the directory /channels and Ctrl+J browse, since no other channel exists."
evidence = "docs/SPEC.md 'Direct punching'; src/settings.rs Settings::parse/save (direct_punch_channels); src/client/session.rs run_connected_session's serverless seeding; src/client/tui/ui.rs UiState::serverless, the Ctrl+J branch; test direct_punch_channels_are_read_one_per_line_and_validated; no_server.feature"

[[user_story.acceptance_criteria]]
id = "AC-218"
description = "A session distinguishes having no server at all from having one that is currently unreachable, and explains each differently: the first is permanent and says so, the second reads as temporary - which it genuinely is, because a lost server is always being retried (4.2). Both refuse the same actions, but telling a user something needs a server while one is merely reconnecting, or that it is retrying when there is no server at all, would each be wrong. Losing the server mid-session is a degradation rather than an ending: direct links are punched peer-to-peer and are unaffected by it, so the session carries on with server-backed actions refused, instead of disconnecting the very peers the loss did not touch."
evidence = "docs/SPEC.md 'Running without a server', Functionality #19; docs/PROTOCOL.md 4.2; src/client/session.rs ServerState::is_absent/is_serverless/refusal, handle_server_event's Lost arm (degrades to Unreachable rather than ending the session), send_if_server; test server_state_distinguishes_no_server_from_an_unreachable_one; no_server.feature"

[[user_story.acceptance_criteria]]
id = "AC-219"
description = "An action needing a server is refused at the moment it is asked for, naming what it was and why, rather than being allowed to proceed into a control channel with nothing behind it - where a join would leave the popup closed and no channel ever appearing, and a mail would sit sending against a result that cannot arrive. The check sits at the single point every action passes through. Only genuinely server-backed actions are refused: joining a channel, and OTP mail. Text, voice, files, calls, live OTP sessions and leaving a channel are peer-to-peer and stay available, and joining a channel that direct_punch_channel already names is done locally rather than refused."
evidence = "docs/SPEC.md 'Running without a server'; src/client/tui/ui.rs UiAction::needs_server; src/client/session.rs handle_ui_action's refusal gate and its local-join branch; src/control.rs NullSink; test only_server_backed_actions_are_refused_without_one; no_server.feature"

[[user_story.acceptance_criteria]]
id = "AC-220"
description = "A channel or conversation that has nobody in it yet, while running with no server, says 'Waiting for other users to connect directly to you' rather than showing blank. Nothing else is going to explain the silence - no roster arrives and no presence notice is coming - so a correctly configured client that is merely early would otherwise be indistinguishable from a broken one. Shown only while genuinely unreachable: once a peer's link is up, an empty log means what it always meant."
evidence = "docs/SPEC.md 'Running without a server'; src/client/tui/channel.rs WAITING_FOR_DIRECT_PEERS, render_sidebar; src/client/tui/ui.rs render_messages; no_server.feature"

[[user_story.technical_behavior]]
id = "TB-225"
description = "An encryption-key rotation (13.10) is carried over the direct link when no server can relay it - either because there is none, or because the peer is one no server has ever named. The payload is exactly what the relayed form carries and the recipient verifies its signature itself, so the transport changes nothing about trust; without this, forward secrecy would silently stop for precisely the peers 7.1.5 exists for, while messages continued to encrypt and decrypt fine against the un-rotated bootstrap keys."
evidence = "docs/PROTOCOL.md 13.10, 7.1.5; src/p2p_proto.rs P2pPayload::KeyRotation; src/client/p2p.rs P2pEvent::KeyRotation; src/client/session.rs rotate_out_rx's dispatch and the KeyRotation arm (handle_pq_key_rotated, shared with ServerMessage::KeyRotated); test punch_datagrams_roundtrip and the existing rotation tests it reuses unchanged"

[[user_story.acceptance_criteria]]
id = "AC-221"
description = "A daemon can be started with no server at all: --no-server lifts the host requirement that every other start is held to, and is persisted like every other daemon field so a bare `aloo --daemon` at the next boot comes back serverless rather than failing for want of a host it never had. A serverless DM focus is given no discovery channel - the hall exists so a focus has somewhere to watch for presence, and with no server there is no presence and no hall to join, so adding one would only produce a tab that can never fill. The channels such a daemon was asked to join are driven at startup rather than off a ChannelList that will never arrive, and go through the same refusal gate every other action does, so --channel is never silently ignored on the one start where nobody is watching."
evidence = "docs/SPEC.md 'Running without a server'; README.md; src/client/daemon.rs DaemonConfig::resolve (host fallback, discovery-channel guard, no_server), DaemonConfig::persist, run's serverless branch; src/settings.rs daemon_no_server; src/client/session.rs request_daemon_joins and its serverless trigger; tests no_server_lifts_the_host_requirement, a_serverless_daemon_comes_back_serverless_after_a_restart, a_serverless_dm_focus_does_not_get_a_discovery_channel, and end to end against a real session in test/daemon_session_test.rs (a_serverless_daemon_shows_its_configured_channel_and_waits_for_peers, a_serverless_daemon_joins_the_channel_it_was_given, a_channel_that_is_not_configured_is_refused_with_a_reason)"

[[user_story.acceptance_criteria]]
id = "AC-272"
description = "~/.aloo/settings accepts noip_when_no_server_and_direct_punch_is_active=on/off plus noip_hostname/noip_username/noip_password, all four off/empty by default and surviving a save/load round trip. A usable configuration needs all three of the latter filled in - a toggle left on with any of them empty, or with direct_punch naming no target, is reported once at session start and the updater never runs."
evidence = "docs/SPEC.md 'Direct punch settings' (No-IP updates); README.md 'Direct punching'; src/settings.rs Settings::parse/save (noip_*); src/client/noip.rs NoipConfig::from_settings; src/client/session.rs run_connected_session's noip_config resolution (the two log_warn branches); tests noip_settings_default_off_and_empty, noip_settings_round_trip_through_save_and_load, noip_config_from_settings_requires_all_three_fields"

[[user_story.acceptance_criteria]]
id = "AC-274"
description = "One No-IP update is an HTTP GET to https://dynupdate.no-ip.com/nic/update?hostname=<noip_hostname>, HTTP Basic-authenticated with noip_username/noip_password. No-IP reports its own outcome in the response body of an ordinary 200 - good/nochg on success, a documented failure code otherwise - so only a non-200 exchange (a transport or proxy failure, not a No-IP-level refusal) is treated as an error by the client itself; a body that is not good/nochg is logged rather than retried early, since the next scheduled fire is only minutes away regardless."
evidence = "docs/PROTOCOL.md 7.1.5 (No-IP updates); src/client/noip.rs build_request, parse_response, update_once, run; tests build_request_carries_the_hostname_and_the_basic_auth_header, parse_response_returns_the_trimmed_body_on_200, parse_response_rejects_a_non_200_status, parse_response_rejects_an_empty_response"

[[user_story.technical_behavior]]
id = "TB-245"
description = "The No-IP updater is started and stopped to track whether there is a server to hear from, not merely whether its own setting is on: it runs while --no-server or the server connection is lost and a usable configuration exists, and is torn down the moment the server is reachable again - so its credentials only ever leave the machine while a peer could actually need this side's address to reach it directly."
evidence = "docs/PROTOCOL.md 7.1.5 (No-IP updates); src/client/session.rs SessionState::sync_noip_job, handle_server_event's Lost arm, on_server_reconnected, ServerState::is_absent; tests server_state_distinguishes_no_server_from_an_unreachable_one, noip_config_from_settings_requires_all_three_fields"

[[user_story.technical_behavior]]
id = "TB-246"
description = "The updater fires once as soon as it starts, then every 5 or 6 minutes alternately, forever - never a flat 5.5-minute period, since 330 seconds is not a multiple of 60 and so cannot land on the same wall-clock second every time on its own. Alternating a 5-minute gap with a 6-minute one is what keeps every single fire on second 50 of its minute while still averaging exactly 5.5 minutes over every pair of them - landing there specifically so the update completes before the direct-punch slot grid's own boundaries, which always fall on second 0 of some minute."
evidence = "docs/PROTOCOL.md 7.1.5 (No-IP updates); src/client/noip.rs NOIP_SECOND_OF_MINUTE, NOIP_GAP_SHORT, NOIP_GAP_LONG, seconds_until_next_noip_mark, run; tests seconds_until_next_noip_mark_computes_the_gap_to_the_next_mark, the_two_gaps_average_five_and_a_half_minutes_and_stay_on_the_mark"

[[user_story.acceptance_criteria]]
id = "AC-275"
description = "A direct_punch_to nickname whose punch succeeds but who has no key pinned at all - a gap that otherwise leaves the link a silent transport-only stub forever - is asked whether to check local keys for a match, the moment it sends whatever would normally prove its identity (a ChannelPresence envelope, or an OTP-wrapped message). Never triggered for a nickname that is not itself a direct_punch_to target, and never for a server-introduced peer, since neither can ever reach the code path this depends on (direct_nickname_of succeeding)."
evidence = "docs/PROTOCOL.md 7.1.5 (unknown-nickname reconciliation); src/client/tui/ui.rs UnverifiedDirectProof, UnknownPeerReview, push_unknown_peer_review; src/client/session.rs on_channel_presence's unpinned branch; src/client/otp.rs on_message's unpinned branch; test an_unknown_but_matching_nickname_is_offered_and_then_pinned; scenarios features/direct_punch/becoming_a_real_peer.feature 'A configured but unpinned nickname's pq_hybrid proof asks first', 'A configured but unpinned nickname's pad-wrapped proof asks first'"

[[user_story.acceptance_criteria]]
id = "AC-276"
description = "Agreeing to check runs a real cryptographic scan against every other nickname already pinned locally that decodes as a pq_hybrid keybundle, stopping at the first one that genuinely verifies the received proof - an ordinary envelope signature check for a ChannelPresence proof, or just the outer pq_hybrid seal for an OTP-wrapped one (covering a peer running an OTP session on top of a real identity). A candidate whose pin does not decode is never tried for either proof kind: that would mean running every locally-held one-time pad's own decrypt against an unverified ciphertext to find out who is speaking, a materially different cost than a signature check. A wrong candidate has no side effect either way, so trying several in a row costs nothing, and at most one can ever succeed; the pad itself is touched only once, for the one candidate the outer seal already proved correct."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/session.rs scan_pinned_keys_for_match, ScanMatch; src/client/tui/ui.rs UnknownPeerStage::ConfirmMatch, RecoveredProof; tests an_unknown_but_matching_nickname_is_offered_and_then_pinned; scenario features/direct_punch/becoming_a_real_peer.feature 'Confirming a found match asks to use it, then reports it chosen'"

[[user_story.acceptance_criteria]]
id = "AC-277"
description = "Confirming a found match pins the matched key bytes under the new nickname too - legal without any IdStore schema change, since nothing ever required a key to be pinned under only one name - and finishes registration from the plaintext the scan already recovered, never decrypting a second time. For an OTP-wrapped match this automatically shares the existing pad session too, since a PqWrapped contact name is a pure function of both sides' fingerprints."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/idstore.rs IdStore::check_and_pin; src/client/session.rs handle_ui_action's ConfirmUnknownPeerKey arm, apply_channel_presence_plaintext; src/client/otp.rs apply_otp_message, recover_padded_otp_bytes, finish_opening_otp_envelope; test an_unknown_but_matching_nickname_is_offered_and_then_pinned; scenario features/direct_punch/becoming_a_real_peer.feature 'Confirming a found match asks to use it, then reports it chosen'"

[[user_story.acceptance_criteria]]
id = "AC-278"
description = "When the scan finds no match among any locally pinned key or pad, the user is told plainly that communication is impossible without a key and what would fix it - a server, or manually exchanging keys - as a status notice, not a popup that goes nowhere."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/session.rs handle_ui_action's CheckUnknownPeerIdentity arm (the None branch); test an_unknown_nickname_with_no_matching_key_is_told_its_impossible"

[[user_story.acceptance_criteria]]
id = "AC-279"
description = "Declining the first popup runs no check and costs nothing - no ban-counting, no lasting state - and a later, distinct proof from the same nickname asks again from scratch. Declining the offered match discards only that specific suggestion; the underlying verification already ran to produce it, but nothing is pinned."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/tui/ui.rs UiAction::DeclineUnknownPeerIdentity/DeclineUnknownPeerKey, resolve_unknown_peer_review; scenarios features/direct_punch/becoming_a_real_peer.feature 'Declining the first question leaves no review outstanding', 'Declining the offered match discards only that offer'"

[[user_story.technical_behavior]]
id = "TB-247"
description = "This whole mechanism is reachable only for a nickname that is itself a direct_punch_to target - direct_nickname_of succeeding is exactly what proves it, and it only ever resolves for a UserId filed under this client's own settings. A server-introduced peer's real UserId is never such a key, so the code path is structurally unreachable for one; for the one overlap case (a nickname that is both server-known and a direct_punch_to target), check_identity always pins the key before set_direct_peer_id could ever let the new branches see them, since both run inside the same synchronous handling of one ServerMessage::UserJoined."
evidence = "docs/PROTOCOL.md 7.1.5; src/client/p2p.rs PeerLinkManager::direct_nickname_of, set_direct_peer_id; src/client/session.rs handle_server_message's UserJoined arm (check_identity before set_direct_peer_id); tests a_direct_ping_naming_a_nickname_that_is_not_configured_is_ignored, a_peer_being_punched_directly_is_never_also_signalled_through_the_server"

