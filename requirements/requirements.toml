# ============================================================================
# US-042 - Read a warning without it wrecking the screen
# ============================================================================
[[user_story]]
id = "US-042"
title = "Read a warning without it wrecking the screen"
as_a = "user running aloo in a terminal"
i_want = "the app's own warnings to go somewhere I can read them rather than into the middle of the interface"
so_that = "the screen stays legible and the warning still reaches me"

[[user_story.acceptance_criteria]]
id = "AC-244"
description = "Nothing this app has to say about itself is ever written to the screen while the TUI owns it. Every diagnostic goes through log_warn!, whose sink is silenced for exactly as long as ratatui holds the terminal (client::tui::terminal::setup / restore) and writes one 'aloo:'-prefixed line to stderr everywhere else - a --server, --daemon or --foreground start, and every one-shot CLI subcommand. Lines emitted while silenced are replayed to stderr once the terminal has been handed back, so a warning worth emitting is still readable rather than dropped."
evidence = "docs/SPEC.md 'Where diagnostics go'; src/log.rs; src/client/tui/terminal.rs setup, restore; test a_silenced_sink_collects_every_line_and_replays_them_on_the_way_out; scenario features/diagnostics/where_warnings_go.feature 'A warning raised while the interface is up waits for the terminal'"

[[user_story.technical_behavior]]
id = "TB-235"
description = "The silenced sink keeps at most log::RING_CAPACITY lines and drops the oldest, so a session warning about the same thing for hours cannot grow it without bound; draining empties it, so a replay never happens twice."
evidence = "src/log.rs RING_CAPACITY, warn, take_collected, drain; test a_silenced_sink_collects_every_line_and_replays_them_on_the_way_out"

