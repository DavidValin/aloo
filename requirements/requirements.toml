[[user_story.acceptance_criteria]]
id = "AC-148"
description = "An OTP file offer's filename and size are deliberately kept off the wire in the clear: an OTP-active file offer spends its own independent unit of pad the instant it is sent, exactly like a text message - accepted as worth the cost even for an offer that ends up rejected, in favour of never letting the filename/size travel any less protected than the rest of an OTP conversation. This is why sending one file under OTP is two independent pad spends rather than one (AC-146): the offer's slot closes on its own ack the moment the peer's client decrypts and queues it for the popup - independent of whether the user has actually decided to accept - and the content's slot is only reserved afterward, once accepted. If the offer's own ack is lost (the peer never replies, or goes offline before it can), there is no local fallback: the pad was already genuinely spent the instant it left the machine, so the only path forward is the same recover-and-resend replay every other pad-protected send already relies on (AC-147) - never a fresh re-encode, which would desync the receiver's pad position permanently."
evidence = "src/client/otp.rs send_file_offer, on_file_offer, recover_and_resend_file_offer; src/client/otp_store.rs PendingOtpContent::File; src/p2p_proto.rs P2pPayload::OtpFileOffer; docs/PROTOCOL.md 16.2 'File content'; verified manually with two clients (docs/TESTING.md 'Known coverage gaps')"

[[user_story.acceptance_criteria]]
id = "AC-147"
description = "A send whose ciphertext has already left the machine - this app restarted before the peer's ack arrived, the connection dropped and reconnected, or the ack itself was simply lost - is recovered by replaying the exact ciphertext otp already kept a safety copy of (otp --recover-last), never by re-encoding the message fresh: encoding a second time before the first is genuinely acknowledged would desync the receiver's decode position from that point on, permanently, since the pad has no integrity check to catch it. Recovery is retried automatically every time a direct link to that contact genuinely becomes reachable again (not on a timer, not polled), covers text, a file's offer phase, a file's content phase, and voice content alike - each its own independently-recoverable pad slot - and resends under the exact same sequence number as the original attempt - so if the peer had actually already processed it and only the acknowledgement was lost, their own replay guard (AC-137/TB-188) rejects the resend as a harmless duplicate rather than decoding it a second time. A recovery attempt that finds nothing to recover, or that fails, leaves the ack-gate exactly as it was rather than falling back to a fresh encode."
evidence = "src/client/otp_cli.rs recover_last, recover_last_file, RecoverDirection; src/client/otp_store.rs OtpContactState.pending_content, PendingOtpContent, OtpStore::pending_sends; src/client/otp.rs recover_and_resend, recover_and_resend_text, recover_and_resend_file_offer, recover_and_resend_file_content, recover_and_resend_voice, peer_for_contact_name; src/client/session.rs handle_p2p_event's LinkStatusChanged arm; tests recover_last_sent_replays_without_consuming_key, recover_last_file_replays_the_last_sent_ciphertext_without_consuming_key, pending_content_round_trips_through_save_and_load, pending_sends_yields_only_contacts_with_something_outstanding, record_acked_clears_pending_content"

[[user_story.technical_behavior]]
id = "TB-188"
description = "otp itself has no integrity check on its ciphertext and no way to detect a duplicate input - feeding otp --decrypt the same ciphertext a second time (confirmed directly against the real binary) does not error, it silently advances past the correct pad range and returns garbage. Since AC-147's recovery deliberately creates situations where a message the peer may have already decrypted successfully gets resent (only the acknowledgement was lost), the receiving side's own per-contact sequence counter must reject a resend of an already-accepted sequence before otp --decrypt ever runs on it, not after - a read-only check separate from (and ordered strictly before) the existing accept-and-advance step, which only commits once decryption and local delivery have actually succeeded."
evidence = "src/client/otp_store.rs OtpStore::is_next_expected; src/client/otp.rs on_message (is_next_expected checked before unwrap_incoming); tests is_next_expected_is_read_only, is_next_expected_rejects_a_resend_of_an_already_accepted_sequence"

