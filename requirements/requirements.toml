[[user_story.acceptance_criteria]]
id = "AC-350"
description = "A channel with zero members is no longer removed the instant it empties (that replaces AC-107/TB-023's old behavior). Instead, once server_channel_deletion_unactivity_period is configured, an empty channel is swept away only after that whole period has passed with nobody having (re)joined it - any join, by anyone, at any point during the window, pushes the deadline back out from that moment rather than letting the original emptying's age win. A non-empty channel is never swept regardless of how long ago it was last joined, DEFAULT_CHANNEL_NAME (the-hall) is never swept even when a period is configured, and leaving the setting unconfigured turns the sweep off entirely - empty channels then simply persist forever, the same as the-hall always has."
evidence = "docs/PROTOCOL.md 6.8; src/settings.rs ChannelDeletionPeriod, Settings::server_channel_deletion_unactivity_period; src/server/channels_registry.rs ChannelRecord.last_join_at, ChannelsRegistry::sweep_inactive; src/server/mod.rs CHANNEL_SWEEP_INTERVAL, channel_sweep_loop; tests sweep_removes_a_channel_empty_and_inactive_past_its_configured_period, sweep_leaves_an_empty_channel_alone_before_its_period_elapses, sweep_never_removes_the_default_channel_even_when_configured, sweep_does_nothing_when_no_period_is_configured, sweep_leaves_a_non_empty_channel_alone_regardless_of_last_join_at, a_rejoin_resets_the_inactivity_clock (server_channels_registry_test.rs), server_channel_deletion_unactivity_period_parses_and_round_trips, server_channel_deletion_unactivity_period_defaults_to_no_sweep (settings_test.rs)"

[[user_story.technical_behavior]]
id = "TB-260"
description = "Inactivity is measured by (re-)join events, never by message content - the server has no visibility into P2P channel messages at all, so a join is the only activity signal it can observe. The sweep is a periodic background pass (CHANNEL_SWEEP_INTERVAL, every 5 minutes - plenty of margin for day/week/month-scale periods), not a per-message or per-leave check, and is skipped entirely when no period is configured rather than defaulting to some fallback duration."
evidence = "docs/PROTOCOL.md 6.8; src/server/channels_registry.rs ChannelsRegistry::sweep_inactive; src/server/mod.rs CHANNEL_SWEEP_INTERVAL, channel_sweep_loop, Registry::with_channel_deletion_period; tests sweep_does_nothing_when_no_period_is_configured, a_rejoin_resets_the_inactivity_clock"

[[user_story.technical_behavior]]
id = "TB-261"
description = "Every new channel-moderation UiAction (DeleteChannel, BanFromChannel, UnbanFromChannel, SetChannelJoinLock, AssignChannelAdmin) declares itself in UiAction::needs_server and is refused with a clear status-line message in --no-server mode, through the same central gate every other server-dependent action already uses - channel ownership and moderation need an authority both sides trust, which doesn't exist without a server."
