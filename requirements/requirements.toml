[[user_story.acceptance_criteria]]
id = "AC-201"
description = "A daemon resolves what to run as flag-first, then daemon_* keys in ~/.aloo/settings, then the last connection made from the connect screen (~/.aloo/.cache, host/port and the keybundle it used), then built-in defaults - and writes the merged result back, so a later bare aloo --daemon reproduces it. With no server named anywhere it refuses to start rather than guessing; --server-pwd and --server-key are mutually exclusive; and a malformed channel or focus is reported rather than ignored."
