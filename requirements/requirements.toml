# US-038 - Run aloo as a resumable background daemon
# ============================================================================
[[user_story]]
id = "US-038"
title = "Run aloo as a resumable background daemon"
as_a = "user who wants to talk without keeping a terminal open"
i_want = "aloo to connect at boot, join the channels I care about and focus where my voice should go, then let me take the session over from any terminal and hand it back"
so_that = "the global push-to-talk shortcut is always live without me having to start and stay in the app"

[[user_story.acceptance_criteria]]
id = "AC-199"
description = "--otp with a nickname --initial-focus makes sure an OTP session is running with that person: one that is already active is continued silently, with no invitation sent and no Accept/Reject popup on their side, since a session outlives disconnects and restarts and only /endotp ends one; only a peer with no live session is invited, and at most once per daemon run so a flapping connection cannot become a queue of popups."
evidence = "docs/SPEC.md 'Running in background mode' 'Focusing a person, with OTP'; docs/PROTOCOL.md 16.6; src/client/daemon.rs DaemonPlan::should_invite_otp; src/client/session.rs on_daemon_peer_appeared; tests an_already_active_otp_session_is_continued_not_re_invited, a_peer_with_no_otp_session_is_invited, without_otp_nobody_is_ever_invited, only_one_invitation_is_sent_per_daemon_run, someone_other_than_the_focused_peer_is_never_invited, a_channel_focus_never_invites_an_otp_session"

[[user_story.acceptance_criteria]]
id = "AC-200"
description = "--initial-focus is a starting position, not a standing instruction: it is placed once, at the first opportunity (which for a person may be long after startup, since they have to appear first), and never re-applied. Someone who attaches, moves to another channel or DM and detaches again keeps that position - a focused peer reconnecting, or a focused channel being rejoined, does not drag the focus back. The join sound and notification still fire for those events; only the focus move is suppressed."
