id = "AC-154"
description = "The /mail command opens a full-screen compose view - a command rather than a key chord, since the natural chord (Ctrl+M) is indistinguishable from Enter on terminals without the kitty keyboard protocol - with From fixed to the user's own nickname, To/Subtext/Content and an attachments pane fillable independently in any order, Tab cycling focus, and Esc discarding it."
evidence = "docs/PROTOCOL.md 17.1; docs/SPEC.md Functionality; src/client/tui/otp_mail.rs UiState::open_otp_mail, handle_mail_compose_key; src/client/tui/ui.rs handle_key's otp_mail routing, submit_input's /mail branch; tests slash_mail_opens_the_full_screen_compose_view, esc_discards_the_compose_view, fields_are_entered_independently_in_any_order; scenarios features/messaging/otp_mail.feature 'The /mail command opens a full-screen mail compose view', 'Escape discards the compose view'"

[[user_story.acceptance_criteria]]
