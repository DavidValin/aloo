[[user_story.technical_behavior]]
id = "TB-255"
description = "check_recipient no longer resolves a nickname's device on its own (the old 'most recently seen' default) - every call must now name an explicit device_id, resolved via IdStore::get_for_device. enumerate_mail_devices lists every one of a nickname's pinned devices (skipping the unbound/empty device_id, which can never be a valid mail target) with its own mail-key status, and is only ever re-run once per distinct nickname (ComposeState::devices_for's memoization), never per keystroke; Up/Down inside the selector re-checks just the newly highlighted device without a fresh enumeration."
