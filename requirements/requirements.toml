evidence = "docs/PROTOCOL.md's 'Direct peer-to-peer transport' section; src/client/p2p.rs PeerLinkManager::tick_at, expire_pending, src/client/tui/ui.rs UiState::p2p_link_failed; test undeliverable_queued_content_is_reported_once_it_ages_out"

[[user_story.technical_behavior]]
id = "TB-143"
description = "RequestPeerLink/PeerCandidates is an existence-check-only relay exactly like RotateKey's recipient check - the server neither validates nor stores the candidate addresses or link_nonce it relays."
evidence = "src/server/mod.rs Registry::route_peer_link_request; tests peer_link_request_relays_candidates_to_the_named_peer, peer_link_request_to_an_unknown_recipient_is_rejected, request_peer_link_and_peer_candidates_roundtrip"

[[user_story.technical_behavior]]
id = "TB-144"
description = "The reliable-delivery layer's receiver (ArqReceiver) delivers frames in order regardless of arrival order, drops duplicates without redelivering, and fails the link (rather than growing unbounded) once its reorder buffer is exceeded by a persistently out-of-order sender."
evidence = "src/client/p2p_reliable.rs ArqReceiver; tests in_order_frames_deliver_immediately, out_of_order_frames_are_buffered_then_delivered_once_the_gap_fills, duplicate_frames_are_dropped_without_redelivering, reorder_buffer_bound_fails_the_link_rather_than_growing_unbounded"

[[user_story.technical_behavior]]
id = "TB-145"
description = "The reliable-delivery layer's sender (ArqSender) retransmits an unacked frame only after its backoff elapses, never retransmits an acked one, and gives up (failing the whole send) once a frame exceeds MAX_RETRIES - there is no relay fallback to fall back on instead."
evidence = "src/client/p2p_reliable.rs ArqSender; tests unacked_frame_is_not_retransmitted_before_its_backoff_elapses, acked_frame_is_never_retransmitted, unacked_frame_is_retransmitted_after_its_backoff_elapses, frame_exceeding_max_retries_fails_the_sender"

[[user_story.technical_behavior]]
id = "TB-204"
description = "A server-reflexive observation that is not publicly routable is refused rather than advertised: a server that sees its clients through a Docker bridge reports the bridge's own address as everybody's public one, and since the reflexive candidate is advertised first, storing it poisons the candidate list with an address that can never work across networks. A refusal is not an address change, so it does not re-signal links the way a genuine move does, and it warns once rather than per probe. IPv4-mapped observations (the normal shape of an IPv4 client's address as seen by a dual-stack server, whose socket is bound to ::) are normalized to the IPv4 address they name before both the usability check and storage - judged as IPv6 they would pass every rule, since none of the IPv4 private/loopback/link-local rules have an IPv6 counterpart, and stored as IPv6 they would be discarded by every IPv4 peer's family filter, leaving reflexive discovery yielding nothing usable for every IPv4 client of a dual-stack server."
evidence = "docs/PROTOCOL.md 7.1; src/p2p_proto.rs is_usable_reflexive_observed; src/client/p2p.rs normalize_mapped, warn_unusable_reflexive, PeerLinkManager::on_rendezvous, learn_reflexive_candidate; tests usable_reflexive_observed_rejects_docker_bridge, usable_reflexive_observed_judges_an_ipv4_mapped_address_as_ipv4, usable_reflexive_observed_rejects_every_unroutable_ipv4_shape, usable_reflexive_observed_still_judges_real_ipv6_as_ipv6, a_bogus_reflexive_observation_is_refused_rather_than_advertised, a_mapped_reflexive_observation_is_advertised_as_plain_ipv4, a_mapped_bogus_reflexive_observation_is_refused_too"

[[user_story.technical_behavior]]
id = "TB-205"
description = "A server hostname that resolves to both families is connected to over IPv4, falling back to IPv6 only when there is no A record at all, and leaving the resolver's own ordering within a family untouched. The preference is about the UDP rendezvous riding the same host and port rather than the TCP connection: a dual-stack server behind Docker's default port publishing answers STUN over IPv6 with the bridge's address, which is unusable as a reflexive candidate (TB-204) and can only be refused, not repaired - while the same server's IPv4 path commonly reports the client's real public endpoint. An empty resolution is an error naming the host, never a connection to something arbitrary."
evidence = "src/client/connect.rs prefer_ipv4, resolve_server_prefer_ipv4, connect_and_handshake; tests a_host_with_both_families_resolves_to_its_ipv4_address, an_ipv6_only_host_still_resolves, resolver_order_within_ipv4_is_preserved, a_host_that_resolves_to_nothing_yields_no_address"

[[user_story.technical_behavior]]
id = "TB-202"
description = "The reliable-delivery layer's sender caps how many frames are in flight at once (SEND_WINDOW), holding the rest in a backlog that drains as acks retire the frames ahead of them, with sequence numbers assigned on the way out so the peer still sees one gapless ascending run. Without it a caller that hands over hundreds of frames in a single pass - an OTP pad provisioning is 64 envelopes per megabyte per key, all queued by one /otp confirmation - had every one of them put on the socket in the same instant; the tail of that burst is dropped, and since the receiver must buffer every frame after a lost one, it exceeds REORDER_BUFFER_LIMIT (TB-144) and fails the whole link. The window only bounds the receiver's buffer because acks are cumulative and name what has been *delivered in order* rather than what merely arrived: an ack for a frame sitting in the reorder buffer would retire a slot and slide the window forward over data the peer cannot yet use, so the burst streams out and blows that buffer anyway - and worse, the sender retires frames the peer discards when the failed link resets, so they are never retransmitted and the stream stops dead. Behind a gap the receiver repeats its frontier, which retires nothing and stalls the sender until a retransmission fills the gap. A duplicate or stale ack retires and releases nothing, and a re-punched link's reset hands back in-flight and backlogged frames together, in their original order."
evidence = "src/client/p2p_reliable.rs SEND_WINDOW, ArqSender::send/on_ack/reset, ArqReceiver::ack_seq; src/client/p2p.rs PeerLinkManager::transmit_reliable, transmit_frame, on_reliable, on_datagram_at's Ack arm; tests only_send_window_frames_go_out_at_once, an_ack_releases_the_next_backlogged_frame_in_order, a_duplicate_ack_does_not_pull_the_backlog_forward, reset_hands_back_in_flight_and_backlogged_frames_in_order, a_backlogged_frame_still_counts_as_pending, a_full_window_lost_in_flight_stays_within_the_receivers_reorder_bound, a_burst_larger_than_the_send_window_arrives_complete_and_in_order"

[[user_story.technical_behavior]]
id = "TB-203"
description = "A whole OTP pad must fit a link's pending queue (PENDING_MAX) intact: the chunks are queued in one burst, normally against a link still being punched, and queue overflow drops the *oldest* entries - the front of the pad - which leaves the receiving side reassembling from a chunk that isn't the first one, since a fresh OtpKeySetupReassembly only ever starts at offset zero. The smallest pad the size prompt allows therefore fits the queue with room to spare, and a pad too large for it is refused with a size-specific message before anything is sent rather than being truncated on the way out and reported as malformed on arrival. A setup whose first part never arrived is reported to the receiver as incomplete, naming the remedy (ask the sender to run /otp again)."
evidence = "src/client/p2p.rs PENDING_MAX; src/client/otp.rs send_key_setup_chunked's chunk-count guard, on_key_setup's missing-first-chunk branch; src/crypto/otp.rs OtpKeySetupReassembly::accept; tests the_smallest_pad_fits_a_links_pending_queue_whole, reassembly_cannot_start_from_anything_but_the_first_chunk"

[[user_story.technical_behavior]]
id = "TB-146"
description = "PeerLinkManager completes the full RequestPeerLink -> PeerCandidates -> Ping/Pong -> Active handshake over real (loopback) UDP sockets, delivers a reliable P2pPayload end to end once Active, and fails a link with a P2pEvent::LinkFailed once PUNCH_TIMEOUT elapses with nothing having answered."
evidence = "src/client/p2p.rs PeerLinkManager; tests direct_link_handshake_and_reliable_message_end_to_end, punch_timeout_fails_the_link_and_emits_link_failed (loopback only - see docs/TESTING.md known coverage gaps for real cross-NAT verification)"

[[user_story.technical_behavior]]
id = "TB-148"
description = "For every RSA-family (Rsa/Password/None/PerMessage) recipient, a single voice chunk (CHUNK_INTERVAL-sized) or file chunk (FILE_CHUNK_BYTES-sized), once worst-case RSA-OAEP encrypted and wrapped for the direct peer-to-peer transport, stays comfortably under p2p_proto::SAFE_DATAGRAM_BYTES - a conservative UDP payload ceiling chosen to avoid IP fragmentation, which many NATs/firewalls simply drop on any lost fragment. pq_hybrid is an explicit, documented exception: its per-chunk key-setup overhead is fixed and large regardless of chunk size (docs/PROTOCOL.md §13.3), so no chunk-size choice can bring it under this budget - see docs/TESTING.md's known coverage gaps."
evidence = "src/p2p_proto.rs SAFE_DATAGRAM_BYTES; src/client/file_transfer.rs FILE_CHUNK_BYTES; src/client/voice.rs CHUNK_INTERVAL; tests file_chunk_bytes_stays_under_the_p2p_safe_datagram_budget, chunk_interval_stays_under_the_p2p_safe_datagram_budget"

[[user_story.technical_behavior]]
id = "TB-149"
description = "A direct link's punch handshake is triggered eagerly, the moment a peer is learned about (ServerMessage::UserJoined), rather than lazily on first send - since voice (unlike text/file) excludes a recipient outright if its link isn't already Active at record-start, a lazy trigger meant the first voice message to any brand-new peer reliably missed them. The trigger fires on every UserJoined for that peer, not only the first: UserOffline forgets their link outright (TB-178), so gating it on 'a UserId we have never seen' would leave a peer who reconnected after any blip - including a heartbeat timeout on a slow link - with no link and nothing to re-arm it. A pre-warmed link that fails to punch with nothing ever queued against it fails silently (no visible LinkFailed banner) - only a link something was genuinely waiting on surfaces a visible failure. The trigger is equally independent of which channel is on screen: every member of every joined channel gets a link, not just the selected one's."
evidence = "src/client/session.rs handle_server_message's UserJoined arm (unconditional ensure_link call, distinct from the first-sighting-only identity pin beside it); src/client/p2p.rs PeerLinkManager::expire_pending (only content that was actually queued can age out into a P2pEvent::LinkFailed), forget; tests punch_timeout_with_nothing_pending_fails_silently, a_peer_who_reconnects_is_punched_again, shares_a_joined_channel_is_true_for_a_member_of_an_unselected_joined_channel"

[[user_story.technical_behavior]]
id = "TB-155"
description = "A client only responds to an incoming PeerCandidates (the P2P link handshake) from a peer it still has a reason to reach - a currently-joined channel in common, or DM history with them; a request from anyone else is silently dropped before it ever reaches PeerLinkManager, since the server's own relay performs no relationship checking of its own. This is deliberately the same bar TB-158 uses to decide whether to keep a link: the two must agree, or a DM that outlives every shared channel leaves both sides holding a link neither will ever re-signal, which survives only on already-learned addresses and can never be punched again once either peer's address moves."
evidence = "docs/PROTOCOL.md 7.1.2; src/client/session.rs handle_server_message's PeerCandidates arm; src/client/tui/channel.rs UiState::has_reason_to_keep_link, shares_a_joined_channel; tests shares_a_joined_channel_is_true_for_a_member_of_a_joined_channel, shares_a_joined_channel_is_false_for_a_stranger, shares_a_joined_channel_is_false_once_the_channel_is_left, a_link_request_is_answered_for_a_dm_peer_with_no_shared_channel"

[[user_story.acceptance_criteria]]
id = "AC-135"
description = "Each person in the sidebar is coloured by the state of the direct link to them rather than by their presence on the server, and by the only part of it anyone about to type needs: green once that link is established and content can actually reach them, gray until it is - a punch still in flight, a link that has gone, and a connection that has closed are one answer and one colour. A trust-gated peer keeps its own red, which takes priority: an unresolved identity is not a reachability state but the one thing here with something to do about it."
evidence = "docs/SPEC.md 'Connected UI'; docs/PROTOCOL.md 7.1; src/client/p2p.rs LinkStatus, src/client/tui/ui.rs UiState::set_link_status/link_status_of, src/client/tui/channel.rs render_sidebar; tests sidebar_colours_each_member_by_the_state_of_the_direct_link_to_them, a_member_with_no_link_record_yet_is_not_shown_as_reachable; direct_link_state.feature"

[[user_story.acceptance_criteria]]
id = "AC-228"
description = "How reachable a person is comes from the direct peer-to-peer link to them, not from their being connected: a live link reads as reachable, one being punched as connecting, and no link as unreachable. Two things override it, in order - an identity that is unresolved or rejected, which needs answering rather than waiting out, and a connection that has closed entirely, which leaves them listed only for the history worth reaching."
