# US-002 - Authenticate to the server
# ============================================================================
[[user_story]]
id = "US-002"
title = "Authenticate to the server"
as_a = "server operator"
i_want = "every client to log in with a registered nickname and its password"
so_that = "only people who hold an account I recognise can join"

[[user_story.acceptance_criteria]]
id = "AC-013"
description = "A client presenting a registered nickname and its correct password is let in - AuthResult { ok: true }, followed by an ordinary Identify."
evidence = "docs/PROTOCOL.md 5.1; src/server/mod.rs handle_connection; tests a_registered_nickname_with_its_password_is_let_in, register_manual_is_active_immediately_with_no_email_or_activation"

[[user_story.acceptance_criteria]]
id = "AC-014"
description = "A wrong password and a nickname nobody registered are refused with the identical AuthResult, so a login attempt cannot be used to discover which nicknames exist."
evidence = "docs/PROTOCOL.md 5.1; tests a_wrong_password_and_an_unknown_nickname_are_refused_alike, unknown_nickname_and_wrong_password_are_indistinguishable"

[[user_story.technical_behavior]]
id = "TB-013"
description = "check_credentials returns exactly one of AuthCheck::Ok, ActivationPending { expired }, or Rejected, and handle_connection's match on it is exhaustive - a fourth outcome cannot silently fall through to acceptance or rejection."
evidence = "src/server/users_registry.rs AuthCheck, UsersRegistry::check_credentials; src/server/mod.rs handle_connection; tests a_registered_nickname_with_its_password_is_let_in, a_pending_account_is_asked_for_its_code_and_activated_by_the_right_one, an_expired_activation_is_refused_with_a_reason"

[[user_story.technical_behavior]]
id = "TB-014"
description = "check_credentials derives the candidate key from whatever was sent before ever looking at whether the nickname is registered, so an unknown nickname and a real, wrong password cost the same PBKDF2 work and give the same answer."
evidence = "src/server/users_registry.rs UsersRegistry::check_credentials; test unknown_nickname_and_wrong_password_are_indistinguishable"

[[user_story.technical_behavior]]
id = "TB-015"
description = "Credential comparison - a login's derived key against the stored one, and an activation code against the pending one - is constant-time, including for unequal lengths and empty inputs."
evidence = "docs/PROTOCOL.md 5.1; src/crypto/mod.rs constant_time_eq; src/server/users_registry.rs check_credentials, activate; test constant_time_eq_matches_regular_equality"

[[user_story.technical_behavior]]
id = "TB-016"
description = "Freshly drawn random bytes differ between draws - what an activation code's digits and every ephemeral key this app generates rely on."
evidence = "docs/PROTOCOL.md 5.3; src/crypto/mod.rs random_bytes; src/server/users_registry.rs generate_activation_code; tests random_bytes_have_requested_length_and_are_not_trivially_constant, generated_activation_codes_are_the_documented_length_of_digits_and_differ_between_draws"

[[user_story.technical_behavior]]
id = "TB-112"
description = "A stray Auth or Identify sent after the handshake is already complete gets Error { message: \"unexpected message after handshake\" }, and the connection stays open afterward - unlike the pre-handshake failures, which close it."
evidence = "docs/PROTOCOL.md 4; test end_to_end_stray_auth_and_identify_after_handshake_error_but_stay_connected"

[[user_story.technical_behavior]]
id = "TB-114"
description = "The server's --bind and --port flags default to 0.0.0.0 and 7878 respectively, and are parsed into the address it listens on."
evidence = "docs/SPEC.md 'Server startup'; tests help_advertises_the_documented_bind_and_port_defaults, server_bind_and_port_flags_are_parsed_into_the_listen_address"

[[user_story.technical_behavior]]
id = "TB-266"
description = "`aloo --help` groups every flag under two headings via clap's help_heading rather than one flat list: 'Client Commands' (every flag that runs or configures the interactive client/daemon) listed first, 'Server Commands' (--server, --bind, --port, --register-user, --change-password) listed second."
evidence = "src/main.rs Cli; test help_groups_flags_under_client_commands_before_server_commands"

[[user_story.technical_behavior]]
id = "TB-238"
description = "A nickname must be 1-NICKNAME_MAX_LEN ASCII letters, digits, '-' or '_' to be registrable at all - checked before any path under the users registry's directory is built, so a name shaped like a traversal, an empty string, or one over the cap can never register, log in, or touch a file outside that directory. Also excludes Windows-reserved device names (CON, NUL, COM1-9, LPT1-9, is_windows_reserved_name): the registry ships for Windows too, and a directory literally named after one cannot be created there at all, so registering as one would break the account's own directory rather than merely mis-render."
evidence = "src/validation.rs NICKNAME_MAX_LEN, nickname_is_registrable, is_windows_reserved_name; src/server/users_registry.rs UsersRegistry::user_dir; tests an_unregistrable_nickname_touches_no_file_and_is_never_registered, an_unregistrable_nickname_is_refused_without_touching_the_registry, nickname_is_registrable_accepts_letters_digits_hyphen_and_underscore, nickname_is_registrable_rejects_disallowed_characters, nickname_is_registrable_rejects_empty, nickname_is_registrable_rejects_over_the_length_cap, nickname_is_registrable_rejects_windows_reserved_device_names, is_windows_reserved_name_matches_case_insensitively_and_only_the_whole_name"

[[user_story.technical_behavior]]
id = "TB-251"
description = "Every settings-file value that names a nickname is parsed through the same nickname_is_registrable rule the server itself enforces - connect_nickname, daemon_nickname, and a direct_punch_to line's nickname component - so a hand-edited settings file cannot configure a nickname that the client would then present to the server, or use in a serverless direct-punch link, in a shape the server would refuse anyway. An invalid value is simply skipped (or, for direct_punch_to, reported as a malformed target) rather than crashing the load. A daemon_channel= line's channel name gets the equivalent channel_name_is_valid check at daemon-start time, once the trailing [:password] is split off (TB-217) - the settings-parse layer itself only guards the line's storability, since the raw value may carry a password with its own charset."
evidence = "src/validation.rs nickname_is_registrable; src/settings.rs Settings::parse, DirectPunchTarget::parse; tests a_settings_file_skips_an_unregistrable_connect_nickname, a_settings_file_skips_an_unregistrable_daemon_nickname, a_direct_punch_to_nickname_must_be_registrable"

# ============================================================================
# US-043 - Register a nickname by email
# ============================================================================
[[user_story]]
id = "US-043"
title = "Register a nickname by email"
as_a = "user with no account on a server yet"
i_want = "to register a nickname and password and activate it with a code emailed to me"
so_that = "I can log in without the operator creating my account by hand"

[[user_story.acceptance_criteria]]
id = "AC-264"
description = "Hello.registration_open tells a client up front whether this server takes registrations at all. Register is refused - RegisterResult { ok: false }, connection closed - when registration is off, or when it is on but the server has no SMTP relay configured to send the activation code through; either way no account is created."
evidence = "docs/PROTOCOL.md 5.3; src/server/mod.rs register_account; tests registration_is_advertised_in_hello_and_refused_when_off, registration_without_a_relay_is_refused_and_creates_nothing"

[[user_story.acceptance_criteria]]
id = "AC-265"
description = "A successful Register writes the account with a pending activation and emails a fresh code to it; logging in with the right nickname and password before that code is used answers AuthResult { activation_pending: true } instead of ok, and the client's next message may be exactly one Activate. The right code activates the account (AuthResult { ok: true } and the handshake continues into Identify); a wrong code refuses and closes the connection; a code more than ACTIVATION_VALIDITY_SECS old is refused as expired UNLESS a fresh one can be reissued and resent on the spot (AC-367) - registering again with the same data always can (register); logging in can whenever there's somewhere to send it (reissue_and_resend_activation) and otherwise falls back to the same outright refusal."
evidence = "docs/PROTOCOL.md 5.2, 5.3; src/server/users_registry.rs UsersRegistry::register, activate, ACTIVATION_VALIDITY_SECS; src/server/mod.rs handle_connection; tests a_pending_account_is_asked_for_its_code_and_activated_by_the_right_one, an_expired_activation_is_refused_with_a_reason, register_writes_a_key_an_email_and_a_pending_activation, activate_accepts_the_right_code_once_and_refuses_a_wrong_or_expired_one"

[[user_story.acceptance_criteria]]
id = "AC-367"
description = "If a registered account's activation code has expired, both logging in and registering again with the same data send a fresh one, rather than requiring a whole new registration under different data: registering again already replaced the stale code (AC-265's 'account must be registered again'); logging in now does too - reissue_and_resend_activation reissues a fresh code (UsersRegistry::reissue_activation, leaving the account's key/email untouched, unlike a re-registration) and re-sends it to the email already on file, then the connection falls straight into the same 'wait for Activate' flow an unexpired pending activation already uses. Refuses with the unchanged AuthResult reason - exactly as if this behavior did not exist - whenever there's nowhere to actually send a fresh code: no SMTP relay configured, no email on file (a register_manual account, which can never have a pending activation to begin with), or the relay itself failing to accept the email."
evidence = "docs/PROTOCOL.md 5.1; src/server/mod.rs reissue_and_resend_activation, handle_connection's ActivationPending arm; src/server/users_registry.rs UsersRegistry::reissue_activation; tests reissue_activation_replaces_an_expired_pending_code_leaving_credentials_untouched, reissue_activation_is_a_no_op_unless_the_pending_code_has_actually_expired (server_users_registry_test.rs), an_expired_activation_still_refuses_when_the_configured_relay_is_unreachable (server_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-388"
description = "ACTIVATION_FAIL_LIMIT (5) wrong activation codes in a row against one still-pending account remove the account outright (UsersRegistry::remove) rather than leaving it open to indefinite guessing - the client's own popup retries with no limit of its own (AC-271), so this is what actually bounds it. The removing attempt's AuthResult names ACCOUNT_REMOVED_ACTIVATION_REASON specifically, distinct from an ordinary wrong-code refusal; connect::handshake_as matches that exact reason to stop reopening the activation popup for a code that can never work again, surfacing it as an ordinary refusal on the connect form instead (the same path a wrong password already takes). The count is per pending activation, cleared by a successful activation - it does not carry into whatever gets registered next under the same name."
evidence = "docs/PROTOCOL.md 5.2; src/server/users_registry.rs UsersRegistry::activate, record_wrong_activation_code, ACTIVATION_FAIL_LIMIT, ACCOUNT_REMOVED_ACTIVATION_REASON, ActivationOutcome::TooManyWrongCodesAccountRemoved; src/server/mod.rs handle_connection's Activate arm; src/client/connect.rs handshake_as; tests five_wrong_activation_codes_in_a_row_remove_the_account, fewer_than_the_limit_of_wrong_codes_does_not_remove_the_account, a_successful_activation_clears_the_wrong_code_count, the_account_removed_reason_constant_is_the_documented_wording (server_users_registry_test.rs), five_wrong_activation_codes_remove_the_account (server_test.rs)"

