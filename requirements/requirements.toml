[[user_story.acceptance_criteria]]
id = "AC-203"
description = "One terminal attaches at a time: an Attach is answered with Attached and the session starts drawing at the reported size, keys and resizes reach it, and Detach stops the drawing while leaving the session running - as does a viewer vanishing without notice. Asking for status tells the session nothing, and only Shutdown ends it, so quitting a viewer can never take the session with it."
