[[user_story.technical_behavior]]
id = "TB-218"
description = "--initial-focus reads a channel: prefix as a channel and anything else as a nickname (dm: being the explicit spelling of the latter), refuses an empty value, and refuses --otp against a channel since OTP is provisioned pairwise and has no channel-wide form. A DM focus then follows the person wherever they appear, while a channel focus follows arrivals in that channel."
