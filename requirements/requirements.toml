evidence = "src/client/tui/channel.rs select_channel_at, on_joined; src/client/tui/direct_message.rs select_dm; src/client/tui/ui.rs UiState.load_history_chunk, history_chunk_size, DEFAULT_HISTORY_CHUNK_LINES, render_messages (height capture); tests resume_from_log_seeds_the_initial_chunk_on_first_view (ui_channel_test.rs)"

[[user_story.acceptance_criteria]]
