description = "After confirming generation of a fresh pad, the user is asked to choose its size (MB per key, 1 to 900000) before anything is actually generated - a whole-number entry popup that absorbs input the same way every other OTP popup does, re-prompts on an out-of-range or unparseable value instead of silently failing, and lets Escape cancel the whole session rather than just the size step. The size chosen travels with the setup message and is shown to the deciding peer in their invite popup, so accepting isn't sight-unseen - a much larger pad takes longer to arrive and uses more local disk/keychain space than a small one."
