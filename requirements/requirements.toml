[[user_story.acceptance_criteria]]
id = "AC-202"
description = "A daemon joins exactly the channels it was given and never the-hall unless named, a focused channel is joined even when it was left off the list, and a nickname focus with no channels at all is given the-hall as a discovery channel - since presence is only ever announced within a shared channel, so a DM focus with nothing joined could never see its peer. A password containing a comma is settable from a settings line, where nothing splits on commas."
