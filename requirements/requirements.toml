[[user_story.acceptance_criteria]]
id = "AC-101"
description = "If a direct UDP link can't be punched open within the punch timeout (e.g. a symmetric NAT or a peer that never answers), whatever was pending against that peer fails visibly to the user - there is no relay-through-the-server fallback to silently paper over it."
evidence = "docs/PROTOCOL.md's 'Direct peer-to-peer transport' section; src/client/p2p.rs PeerLinkManager::tick_at, src/client/tui/ui.rs UiState::p2p_link_failed; test punch_timeout_fails_the_link_and_emits_link_failed"

[[user_story.technical_behavior]]
id = "TB-143"
description = "RequestPeerLink/PeerCandidates is an existence-check-only relay exactly like RotateKey's recipient check - the server neither validates nor stores the candidate addresses or link_nonce it relays."
evidence = "src/server/mod.rs Registry::route_peer_link_request; tests peer_link_request_relays_candidates_to_the_named_peer, peer_link_request_to_an_unknown_recipient_is_rejected, request_peer_link_and_peer_candidates_roundtrip"

[[user_story.technical_behavior]]
id = "TB-144"
description = "The reliable-delivery layer's receiver (ArqReceiver) delivers frames in order regardless of arrival order, drops duplicates without redelivering, and fails the link (rather than growing unbounded) once its reorder buffer is exceeded by a persistently out-of-order sender."
evidence = "src/client/p2p_reliable.rs ArqReceiver; tests in_order_frames_deliver_immediately, out_of_order_frames_are_buffered_then_delivered_once_the_gap_fills, duplicate_frames_are_dropped_without_redelivering, reorder_buffer_bound_fails_the_link_rather_than_growing_unbounded"

[[user_story.technical_behavior]]
id = "TB-145"
description = "The reliable-delivery layer's sender (ArqSender) retransmits an unacked frame only after its backoff elapses, never retransmits an acked one, and gives up (failing the whole send) once a frame exceeds MAX_RETRIES - there is no relay fallback to fall back on instead."
evidence = "src/client/p2p_reliable.rs ArqSender; tests unacked_frame_is_not_retransmitted_before_its_backoff_elapses, acked_frame_is_never_retransmitted, unacked_frame_is_retransmitted_after_its_backoff_elapses, frame_exceeding_max_retries_fails_the_sender"

[[user_story.technical_behavior]]
id = "TB-146"
description = "PeerLinkManager completes the full RequestPeerLink -> PeerCandidates -> Ping/Pong -> Active handshake over real (loopback) UDP sockets, delivers a reliable P2pPayload end to end once Active, and fails a link with a P2pEvent::LinkFailed once PUNCH_TIMEOUT elapses with nothing having answered."
evidence = "src/client/p2p.rs PeerLinkManager; tests direct_link_handshake_and_reliable_message_end_to_end, punch_timeout_fails_the_link_and_emits_link_failed (loopback only - see docs/TESTING.md known coverage gaps for real cross-NAT verification)"

[[user_story.technical_behavior]]
id = "TB-148"
description = "For every RSA-family (Rsa/Password/None/PerMessage) recipient, a single voice chunk (CHUNK_INTERVAL-sized) or file chunk (FILE_CHUNK_BYTES-sized), once worst-case RSA-OAEP encrypted and wrapped for the direct peer-to-peer transport, stays comfortably under p2p_proto::SAFE_DATAGRAM_BYTES - a conservative UDP payload ceiling chosen to avoid IP fragmentation, which many NATs/firewalls simply drop on any lost fragment. pq_hybrid is an explicit, documented exception: its per-chunk key-setup overhead is fixed and large regardless of chunk size (docs/PROTOCOL.md §13.3), so no chunk-size choice can bring it under this budget - see docs/TESTING.md's known coverage gaps."
evidence = "src/p2p_proto.rs SAFE_DATAGRAM_BYTES; src/client/file_transfer.rs FILE_CHUNK_BYTES; src/client/voice.rs CHUNK_INTERVAL; tests file_chunk_bytes_stays_under_the_p2p_safe_datagram_budget, chunk_interval_stays_under_the_p2p_safe_datagram_budget"

[[user_story.technical_behavior]]
id = "TB-149"
description = "A direct link's punch handshake is triggered eagerly, the moment a peer is first learned about (ServerMessage::UserJoined), rather than lazily on first send - since voice (unlike text/file) excludes a recipient outright if its link isn't already Active at record-start, a lazy trigger meant the first voice message to any brand-new peer reliably missed them. A pre-warmed link that fails to punch with nothing ever queued against it fails silently (no visible LinkFailed banner) - only a link something was genuinely waiting on surfaces a visible failure."
evidence = "src/client/session.rs handle_server_message's UserJoined arm (ensure_link call); src/client/p2p.rs PeerLinkManager::tick_at (had_pending gate on emitting P2pEvent::LinkFailed); test punch_timeout_with_nothing_pending_fails_silently"

[[user_story.technical_behavior]]
id = "TB-155"
description = "A client only responds to an incoming PeerCandidates (the P2P link handshake) from a peer it currently shares a joined channel with; a request from anyone else is silently dropped before it ever reaches PeerLinkManager, since the server's own relay performs no relationship checking of its own."
evidence = "docs/PROTOCOL.md 7.1.2; src/client/session.rs handle_server_message's PeerCandidates arm; src/client/tui/channel.rs UiState::shares_a_joined_channel"

# ============================================================================
# US-025 - Protect a private channel with a password
# ============================================================================
[[user_story]]
id = "US-025"
title = "Protect a private channel with a password"
as_a = "user creating or rejoining a private channel"
i_want = "to set a password when I create it, and be asked for it again to rejoin"
so_that = "someone who merely learns or guesses its name can't join it"

[[user_story.acceptance_criteria]]
id = "AC-104"
description = "Ctrl+J's popup offers a Public/Private selector and, while Private is selected, an optional password field capped at CHANNEL_PASSWORD_MAX_LEN characters of letters, digits, and a documented set of basic symbols; creating a private channel with a password lets a later client join it by supplying the same password."
evidence = "docs/SPEC.md Functionality #2; src/client/tui/channel.rs handle_join_popup_key, render_join_popup; tests private_channel_created_with_a_password_can_be_joined_by_a_second_client_with_the_right_one, end_to_end_password_protected_channel_join_flow, join_channel_with_password_roundtrips"

[[user_story.acceptance_criteria]]
id = "AC-105"
description = "Joining a password-protected private channel with no password, or the wrong one, opens a dedicated password-entry popup naming which problem occurred, distinct from any other join failure, and lets the user retype and resubmit."
evidence = "docs/PROTOCOL.md 6.5; src/client/tui/ui.rs Mode::ChannelPasswordPopup; src/client/tui/channel.rs handle_channel_password_popup_key, on_channel_join_rejected; tests private_channel_created_with_a_password_rejects_a_join_with_no_password, private_channel_created_with_a_password_rejects_a_join_with_the_wrong_password, end_to_end_password_protected_channel_join_flow, channel_join_rejected_roundtrips_all_three_kinds"

[[user_story.acceptance_criteria]]
id = "AC-106"
description = "More than CHANNEL_MAX_PASSWORD_ATTEMPTS wrong attempts to join one private channel from one source address bans further attempts against that channel from that address for CHANNEL_PASSWORD_BAN_DURATION, reported distinctly from a plain wrong-password reply."
evidence = "docs/PROTOCOL.md 6.6; src/server/mod.rs Registry::join_channel, CHANNEL_MAX_PASSWORD_ATTEMPTS, CHANNEL_PASSWORD_BAN_DURATION; test more_than_seven_wrong_attempts_from_one_ip_bans_that_ip_for_that_channel"

[[user_story.technical_behavior]]
id = "TB-151"
description = "Channel password comparison is constant-time, mirroring the credential check TB-015 already requires for server auth."
evidence = "docs/PROTOCOL.md 5.2, 6.5; src/crypto/mod.rs constant_time_eq; src/server/mod.rs Registry::join_channel"

[[user_story.technical_behavior]]
id = "TB-152"
description = "A successful password join resets that (source address, channel) pair's wrong-attempt counter to zero, so an earlier mistake never contributes toward a later, unrelated ban."
evidence = "src/server/mod.rs Registry::join_channel; test a_successful_password_join_resets_the_attempt_counter"

[[user_story.technical_behavior]]
id = "TB-153"
description = "The brute-force ban is keyed by (source IP address, channel name), not UserId, and tracked in server memory only with no persistence across a restart - a UserId is never reused (TB-020), so a per-UserId ban would be trivially bypassed by reconnecting."
evidence = "docs/PROTOCOL.md 6.6; src/server/mod.rs Registry::channel_password_attempts; test a_ban_is_scoped_to_ip_and_channel_not_userid"

[[user_story.technical_behavior]]
id = "TB-154"
description = "A ChannelJoinRejected (password-required, wrong-password, or banned) is sent to the requester only - a private channel's existence, membership, or password state never leaks to anyone else through this flow, the same guarantee TB-113 already gives ChannelJoinFailed."
evidence = "docs/PROTOCOL.md 6.3, 6.5; src/server/mod.rs Registry::join_channel; test channel_join_rejected_is_sent_to_the_requester_only"

# ============================================================================
# US-026 - Leave a channel
# ============================================================================
[[user_story]]
id = "US-026"
title = "Leave a channel"
as_a = "member of a channel"
i_want = "to stop being a member of it without disconnecting entirely"
so_that = "I can step away from a conversation I'm done with while staying connected to the rest"

[[user_story.acceptance_criteria]]
id = "AC-109"
description = "Typing /leave and pressing Enter leaves the currently selected channel tab, public or private. Leaving a private channel removes its tab entirely; leaving a public channel keeps its tab but the client is no longer a member of it."
evidence = "docs/SPEC.md Functionality; src/client/tui/ui.rs submit_input's /leave branch; src/client/tui/channel.rs UiState::leave_channel_locally; tests slash_leave_on_a_private_channel_removes_its_tab, slash_leave_on_a_public_channel_keeps_the_tab_but_marks_it_left"

[[user_story.acceptance_criteria]]
id = "AC-110"
description = "Selecting a public channel tab you've left shows a single centered screen - 'You left this public channel. Do you want to join?' - instead of the normal sidebar/messages/compose view, and pressing Enter there requests rejoining it."
evidence = "docs/SPEC.md Functionality; src/client/tui/channel.rs render_left_channel_screen; src/client/tui/ui.rs handle_key's left-channel branch; test left_channel_screen_enter_requests_rejoin"

[[user_story.technical_behavior]]
id = "TB-157"
description = "The dwell timer never re-fires a join for a channel the user explicitly left (ChannelTab::left) - only a channel that was simply never joined yet still dwell-auto-joins; a left channel only rejoins via the explicit Enter-to-rejoin action."
evidence = "src/client/tui/channel.rs UiState::tick_dwell; test dwell_does_not_refire_for_a_left_channel"

[[user_story.technical_behavior]]
id = "TB-158"
description = "Leaving a channel - locally via /leave, or being told a peer left via UserLeft - drops the P2P link to any peer with whom no joined channel or DM history remains (UiState::has_reason_to_keep_link), the same bar on_user_offline already uses to decide whether to keep a departed user listed."
evidence = "docs/PROTOCOL.md 7.1.3; src/client/channel.rs handle_leave; src/client/session.rs UserLeft arm; tests has_reason_to_keep_link_is_true_for_a_shared_channel, has_reason_to_keep_link_is_true_for_dm_history, has_reason_to_keep_link_is_false_with_neither"
