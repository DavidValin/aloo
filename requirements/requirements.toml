[[user_story.acceptance_criteria]]
id = "AC-142"
description = "An invitation that is never accepted leaves the initiating side exactly as it found it, and one that is owed to a peer is retried rather than regenerated. Nothing is written to the keychain until the peer actually accepts: the generated pad waits, both halves staged on disk, so a peer who refuses, never answers, or goes offline mid-transfer leaves no stale entry - and since the contact name is derived from both fingerprints (every attempt produces the identical name) and add_contact refuses to overwrite, that is what makes a later /otp from either side succeed instead of deadlocking. A pad still owed is re-offered from the staged bytes whenever a direct link to that peer becomes reachable again, byte-identical to the original, because two different pads under one contact name have no integrity check to tell them apart and would decode to silent garbage; the debt is keyed by contact name, so it survives the fresh UserId a reconnect brings and an app restart. A re-delivery that arrives when the contact is already provisioned is re-acknowledged rather than raising a second popup, which is what closes the lost-acknowledgement case. When both users invite each other before either answers, the two pads compete for the one fingerprint-derived contact name and the tie is broken as simultaneous link opens are - the smaller fingerprint's pad wins, computed identically on both sides with no round trip - so the pair can never end up holding halves of two different pads; the conceding side drops its own staged pad, and accepting any peer's pad retires whatever this side had staged for that contact. Content dropped when a link is forgotten is reported, so a peer vanishing mid-invitation is visible rather than an indefinite silent wait. Where a stale entry can still arise - a contact adopted from outside the app, or one whose counterpart later lost their half - the peer's 'no matching key found on my end' answer still clears it, and that answer is now given on reject as well as accept, since which button was pressed says nothing about whether the key exists."
evidence = "src/client/otp.rs own_pad_wins_glare, GLARE_REASON, pending_setup_dir, initiate_provisioning, commit_pending_setup, discard_pending_setup, read_pending_setup, resend_pending_setups, on_key_setup (re-delivery re-ack), reject_invite, on_key_setup_ack, NO_MATCHING_KEY_REASON; src/client/otp_store.rs pending_setup_size_mb, mark_setup_pending, clear_pending_setup, pending_setups; src/client/p2p.rs PeerLinkManager::forget; src/client/session.rs UserOffline (partial-reassembly cleanup), LinkStatusChanged; tests simultaneous_invitations_are_resolved_the_same_way_by_both_sides, a_glare_leaves_both_sides_holding_halves_of_one_pad, accepting_a_peers_pad_retires_this_sides_own_staged_one, an_invitation_that_is_never_accepted_leaves_no_stale_contact, a_pending_setup_is_re_readable_for_retries_and_identical_each_time, asymmetric_provisioning_recovers_once_the_stale_contact_is_removed, initiate_provisioning_and_apply_incoming_setup_leave_both_sides_usable, a_pending_setup_survives_save_and_load, clearing_a_pending_setup_reports_whether_anything_was_owed, pending_setups_yields_only_contacts_still_owed_a_pad, a_line_written_before_pending_setup_existed_still_loads, forgetting_a_link_reports_content_that_was_still_waiting_on_it, forgetting_an_empty_link_reports_nothing, ordinary_messages_still_arrive_while_a_pad_is_being_transferred, remove_contact_deletes_an_existing_contact, remove_contact_on_an_unknown_contact_fails, a_removed_contacts_name_can_be_reprovisioned_from_scratch, forget_removes_a_provisioned_entry, forget_returns_false_when_there_was_nothing_to_forget; message_encryption.feature"

