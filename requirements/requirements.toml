# ============================================================================
# US-030 - Keeping the setup conversation off the wire too
# ============================================================================
[[user_story]]
id = "US-030"
title = "Keeping the setup conversation off the wire too"
as_a = "user on a network I do not control"
i_want = "the conversation that sets my session up encrypted as well"
so_that = "someone watching the wire learns neither my password nor who I talk to"

[[user_story.acceptance_criteria]]
id = "AC-126"
description = "The server opens each connection with an ephemeral ML-KEM-1024 + X25519 offer in its Hello; the client transports a random secret to it (reusing crypto::pq's hybrid wrap, so recovering it needs both primitives) as ClientMessage::SecureChannel, and both sides derive two directional AES-256-GCM keys. Every frame after that, in both directions, is sealed; the length-prefix framing is unchanged. A client that sends anything but SecureChannel first is not talked to at all - there is no plaintext fallback to downgrade to."
evidence = "docs/PROTOCOL.md 1.3; src/control.rs ControlOffer, accept_offer, open_accept, ControlWriter, ControlReader, ControlEndpoint; src/server/mod.rs handle_connection; src/client/connect.rs connect_and_handshake; control_channel.feature 'The setup conversation is encrypted before anything is said'; tests both_sides_agree_on_the_same_keys, frames_are_sealed_once_the_tunnel_is_on, the_endpoint_handshake_turns_the_channel_on"

[[user_story.acceptance_criteria]]
id = "AC-127"
description = "The credential a --password deployment sends, previously in the clear, no longer appears anywhere in the bytes on the wire; the same applies to nicknames, channel names, membership and key-rotation traffic, all of which now travel inside the tunnel. What the server itself learns is unchanged (it still routes by these) - only what an observer in between learns."
evidence = "docs/PROTOCOL.md 1.3/10; src/control.rs (module doc), ControlWriter::send; control_channel.feature 'A password does not appear on the wire'; test the_password_is_not_recoverable_from_the_sealed_bytes"

[[user_story.acceptance_criteria]]
id = "AC-128"
description = "A server started with an RSA server key signs its per-connection offer with it, and a client configured with that key requires a valid signature - an unsigned offer, one signed by another key, or one whose keys were swapped after signing are all refused, since each is what a man in the middle would produce. A client with no server key has nothing to check against and accepts the offer: encrypted, but not authenticated, which is documented as the limit of that mode rather than implied away."
evidence = "docs/PROTOCOL.md 1.3; src/control.rs make_offer, verify_offer, offer_commitment; src/server/mod.rs AuthConfig::signing_key; control_channel.feature 'A server that can be identified must prove it'; tests a_client_holding_the_server_key_requires_a_valid_signature, an_offer_signed_by_another_key_is_refused, swapping_the_keys_inside_a_signed_offer_is_refused, a_client_without_a_server_key_accepts_any_offer"

[[user_story.technical_behavior]]
id = "TB-169"
description = "Each direction has its own key (so a captured frame cannot be reflected back) and its own counter, which forms the AES-GCM nonce - so identical plaintext sealed twice never produces identical bytes. A frame that fails its authentication tag is a hard error, never a skipped message: on an encrypted channel that means tampering or desynchronised counters, and both are fatal."
evidence = "docs/PROTOCOL.md 1.3; src/control.rs derive, nonce, seal, open; control_channel.feature 'The same message twice does not look the same twice'; tests repeating_a_message_does_not_repeat_the_ciphertext, a_tampered_frame_fails_to_authenticate"

[[user_story.technical_behavior]]
id = "TB-170"
description = "The server's control-channel keys are ephemeral per connection and discarded with it, so recording a session and later stealing the server's long-term key does not decrypt it. The long-term key only ever signs the offer, never encrypts anything."
evidence = "docs/PROTOCOL.md 1.3; src/server/mod.rs handle_connection (generate_encryption_keys per connection); src/control.rs (module doc); test a_different_server_cannot_recover_the_secret (TB-170)"

[[user_story.technical_behavior]]
id = "TB-171"
description = "Client send paths (joining a channel, requesting a peer link, rotating a key) take the control::ControlSink trait rather than naming a concrete writer, so the live client's split-stream ControlWriter and anything driving a connection sequentially (ControlEndpoint) share one set of call paths instead of duplicated ones."
evidence = "src/control.rs ControlSink; src/client/channel.rs, src/client/direct_message.rs, src/client/p2p.rs (send paths); test the_endpoint_handshake_turns_the_channel_on (TB-171)"

# ============================================================================
# US-031 - Surviving input nobody meant to send
# ============================================================================
[[user_story]]
id = "US-031"
title = "Surviving input nobody meant to send"
as_a = "user whose client talks to strangers over a network"
i_want = "malformed, truncated or hostile input to fail as an error"
so_that = "nobody can crash my client by sending it nonsense"

[[user_story.acceptance_criteria]]
id = "AC-129"
description = "Every decode path reachable by a remote peer or a local file - protocol messages, P2P payloads, punch datagrams, key bundles, send setups, rotations, control offers, frames, DER keys, hex - refuses random bytes, truncations and bit flips as errors rather than panicking or aborting."
evidence = "docs/SECURITY.md 'Robustness'; test/robustness_test.rs (random_bytes_never_panic_any_decoder, truncating_a_valid_message_never_panics, bit_flips_in_valid_messages_never_panic, opening_garbage_chunks_never_panics); malformed_input.feature 'Nonsense from a stranger is refused, not fatal'"

[[user_story.technical_behavior]]
id = "TB-172"
description = "The bincode decoder is capped at MAX_FRAME_LEN. Without the cap, decoding is a remote denial of service: bincode reserves whatever a length prefix claims, and those prefixes sit *inside* the payload where the frame-length check never sees them, so a dozen crafted bytes could abort the process on a failed allocation before any field was read. A length prefix past the cap is likewise a frame error, not an allocation."
evidence = "docs/SECURITY.md; src/proto.rs bincode_config (with_limit), parse_frame; tests random_bytes_never_panic_any_decoder, an_absurd_length_prefix_is_refused_not_allocated, bit_flips_in_valid_messages_never_panic"

[[user_story.technical_behavior]]
id = "TB-173"
description = "Local files a user may hand-edit or that arrive from elsewhere - the identity store and identity cards - load whatever survived rather than failing or crashing, and a card assembled from noise never verifies."
evidence = "docs/SECURITY.md; src/client/idstore.rs load; src/crypto/pq.rs load_identity_card, open_identity_card; tests a_damaged_identity_store_still_loads, a_garbage_identity_card_file_is_refused_without_panicking, a_card_decoded_from_noise_never_verifies"

[[user_story.technical_behavior]]
id = "TB-174"
description = "aloo's own constructions - the key-wrap combiner, send commitments, chunk nonces, control-channel key derivation and safety phrases - are pinned by committed test vectors, so an independent implementation can check itself and the wire format cannot drift unnoticed. The standard primitives (ML-KEM-1024, ML-DSA-87) are deliberately not re-tested here: their crates cover the NIST vectors upstream, and duplicating that would prove nothing about this codebase."
evidence = "docs/SECURITY.md 'Test vectors'; test/vectors_test.rs (chunk_nonce_vectors, key_wrap_combiner_vectors, send_commitment_vectors, sealed_chunk_vector, control_channel_key_vectors, safety_phrase_vectors)"

# ============================================================================
