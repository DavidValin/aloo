[[user_story.acceptance_criteria]]
id = "AC-100"
description = "When a client first addresses another one (a channel/DM send, a call, a file offer), the server relays only a proposal of candidate addresses between them (never message content); both clients then punch a direct UDP link to each other, and once it's active, every channel/DM message, voice chunk, and file chunk for that pair travels only over that link - never through the server, not even as ciphertext."
evidence = "docs/PROTOCOL.md's 'Direct peer-to-peer transport' section; src/server/mod.rs Registry::route_peer_link_request; src/client/p2p.rs PeerLinkManager; tests peer_link_request_relays_candidates_to_the_named_peer, direct_link_handshake_and_reliable_message_end_to_end; message_delivery.feature/private_delivery.feature/voice_delivery.feature (content now delivered end to end over this link)"

[[user_story.acceptance_criteria]]
id = "AC-101"
description = "If a direct UDP link can't be punched open, content addressed to that peer is held and the link keeps being retried rather than being dropped on the floor; once that content has been undeliverable for PENDING_MAX_AGE it fails visibly to the user, naming why. There is no relay-through-the-server fallback to silently paper over any of it."
evidence = "docs/PROTOCOL.md's 'Direct peer-to-peer transport' section; src/client/p2p.rs PeerLinkManager::tick_at, expire_pending, src/client/tui/ui.rs UiState::p2p_link_failed; test undeliverable_queued_content_is_reported_once_it_ages_out"

[[user_story.technical_behavior]]
id = "TB-143"
description = "RequestPeerLink/PeerCandidates is an existence-check-only relay exactly like RotateKey's recipient check - the server neither validates nor stores the candidate addresses or link_nonce it relays."
evidence = "src/server/mod.rs Registry::route_peer_link_request; tests peer_link_request_relays_candidates_to_the_named_peer, peer_link_request_to_an_unknown_recipient_is_rejected, request_peer_link_and_peer_candidates_roundtrip"

[[user_story.technical_behavior]]
id = "TB-144"
description = "The reliable-delivery layer's receiver (ArqReceiver) delivers frames in order regardless of arrival order, drops duplicates without redelivering, and fails the link (rather than growing unbounded) once its reorder buffer is exceeded by a persistently out-of-order sender."
evidence = "src/client/p2p_reliable.rs ArqReceiver; tests in_order_frames_deliver_immediately, out_of_order_frames_are_buffered_then_delivered_once_the_gap_fills, duplicate_frames_are_dropped_without_redelivering, reorder_buffer_bound_fails_the_link_rather_than_growing_unbounded"

[[user_story.technical_behavior]]
id = "TB-145"
description = "The reliable-delivery layer's sender (ArqSender) retransmits an unacked frame only after its backoff elapses, never retransmits an acked one, and gives up (failing the whole send) once a frame exceeds MAX_RETRIES - there is no relay fallback to fall back on instead."
evidence = "src/client/p2p_reliable.rs ArqSender; tests unacked_frame_is_not_retransmitted_before_its_backoff_elapses, acked_frame_is_never_retransmitted, unacked_frame_is_retransmitted_after_its_backoff_elapses, frame_exceeding_max_retries_fails_the_sender"

[[user_story.technical_behavior]]
id = "TB-146"
description = "PeerLinkManager completes the full RequestPeerLink -> PeerCandidates -> Ping/Pong -> Active handshake over real (loopback) UDP sockets, delivers a reliable P2pPayload end to end once Active, and fails a link with a P2pEvent::LinkFailed once PUNCH_TIMEOUT elapses with nothing having answered."
evidence = "src/client/p2p.rs PeerLinkManager; tests direct_link_handshake_and_reliable_message_end_to_end, punch_timeout_fails_the_link_and_emits_link_failed (loopback only - see docs/TESTING.md known coverage gaps for real cross-NAT verification)"

[[user_story.technical_behavior]]
id = "TB-148"
description = "For every RSA-family (Rsa/Password/None/PerMessage) recipient, a single voice chunk (CHUNK_INTERVAL-sized) or file chunk (FILE_CHUNK_BYTES-sized), once worst-case RSA-OAEP encrypted and wrapped for the direct peer-to-peer transport, stays comfortably under p2p_proto::SAFE_DATAGRAM_BYTES - a conservative UDP payload ceiling chosen to avoid IP fragmentation, which many NATs/firewalls simply drop on any lost fragment. pq_hybrid is an explicit, documented exception: its per-chunk key-setup overhead is fixed and large regardless of chunk size (docs/PROTOCOL.md §13.3), so no chunk-size choice can bring it under this budget - see docs/TESTING.md's known coverage gaps."
evidence = "src/p2p_proto.rs SAFE_DATAGRAM_BYTES; src/client/file_transfer.rs FILE_CHUNK_BYTES; src/client/voice.rs CHUNK_INTERVAL; tests file_chunk_bytes_stays_under_the_p2p_safe_datagram_budget, chunk_interval_stays_under_the_p2p_safe_datagram_budget"

[[user_story.technical_behavior]]
id = "TB-149"
description = "A direct link's punch handshake is triggered eagerly, the moment a peer is learned about (ServerMessage::UserJoined), rather than lazily on first send - since voice (unlike text/file) excludes a recipient outright if its link isn't already Active at record-start, a lazy trigger meant the first voice message to any brand-new peer reliably missed them. The trigger fires on every UserJoined for that peer, not only the first: UserOffline forgets their link outright (TB-178), so gating it on 'a UserId we have never seen' would leave a peer who reconnected after any blip - including a heartbeat timeout on a slow link - with no link and nothing to re-arm it. A pre-warmed link that fails to punch with nothing ever queued against it fails silently (no visible LinkFailed banner) - only a link something was genuinely waiting on surfaces a visible failure."
evidence = "src/client/session.rs handle_server_message's UserJoined arm (unconditional ensure_link call, distinct from the first-sighting-only identity pin beside it); src/client/p2p.rs PeerLinkManager::expire_pending (only content that was actually queued can age out into a P2pEvent::LinkFailed), forget; tests punch_timeout_with_nothing_pending_fails_silently, a_peer_who_reconnects_is_punched_again"

[[user_story.technical_behavior]]
id = "TB-155"
description = "A client only responds to an incoming PeerCandidates (the P2P link handshake) from a peer it still has a reason to reach - a currently-joined channel in common, or DM history with them; a request from anyone else is silently dropped before it ever reaches PeerLinkManager, since the server's own relay performs no relationship checking of its own. This is deliberately the same bar TB-158 uses to decide whether to keep a link: the two must agree, or a DM that outlives every shared channel leaves both sides holding a link neither will ever re-signal, which survives only on already-learned addresses and can never be punched again once either peer's address moves."
evidence = "docs/PROTOCOL.md 7.1.2; src/client/session.rs handle_server_message's PeerCandidates arm; src/client/tui/channel.rs UiState::has_reason_to_keep_link, shares_a_joined_channel; tests shares_a_joined_channel_is_true_for_a_member_of_a_joined_channel, shares_a_joined_channel_is_false_for_a_stranger, shares_a_joined_channel_is_false_once_the_channel_is_left, a_link_request_is_answered_for_a_dm_peer_with_no_shared_channel"

[[user_story.acceptance_criteria]]
id = "AC-135"
description = "Each person in the sidebar is coloured by the state of the direct link to them rather than by their presence on the server: green once that link is established and content can actually reach them, red once it is lost, and neither while it is still being established. A trust-gated or offline peer keeps its own existing colour, which takes priority."
evidence = "docs/SPEC.md 'Connected UI'; docs/PROTOCOL.md 7.1; src/client/p2p.rs LinkStatus, src/client/tui/ui.rs UiState::set_link_status/link_status_of, src/client/tui/channel.rs render_sidebar; tests sidebar_colours_each_member_by_the_state_of_the_direct_link_to_them, a_member_with_no_link_record_yet_is_not_shown_as_reachable; direct_link_state.feature"

[[user_story.technical_behavior]]
id = "TB-176"
description = "A Ping or Pong arriving from an address nobody advertised is attributed by its link_nonce to a link currently being established, that source is adopted as a peer-reflexive candidate, and it becomes usable for data frames - which is what makes a peer behind a NAT that maps a different external port per destination (symmetric/carrier-grade NAT) reachable at all. Attribution by nonce is limited to links being established, never an already-Active one, so an unauthenticated datagram can't move a live link's address; and a probe whose nonce matches no such link is ignored rather than answered, so this never becomes a reflector for anyone scanning the socket."
evidence = "docs/PROTOCOL.md 7.1; src/client/p2p.rs PeerLinkManager::attribute, adopt_candidate, on_datagram_at; tests a_ping_from_an_unadvertised_source_is_answered_and_adopted_as_a_candidate, a_pong_from_an_unadvertised_source_activates_the_link, a_ping_matching_no_link_is_ignored"

[[user_story.technical_behavior]]
id = "TB-177"
description = "Both sides converge on one shared link_nonce, which is what lets it serve as a link identifier for TB-176's attribution: the responder echoes the initiator's, and when both initiate at once - the normal case, since both pre-warm on UserJoined (TB-149) - both take the numerically smaller of the two while still establishing. Against an already-Active link a differing nonce instead means the peer has restarted, and is followed rather than tie-broken."
evidence = "docs/PROTOCOL.md 7.1; src/client/p2p.rs PeerLinkManager::on_peer_candidates; test simultaneous_open_converges_on_one_shared_nonce"

[[user_story.technical_behavior]]
id = "TB-178"
description = "Establishing a link is continuous, not a single attempt: a link that could not be punched is re-signalled through the server automatically on a backoff doubling from RETRY_BASE and capped at RETRY_MAX, with no user action and nothing queued against it, for as long as the peer is still known - only PeerLinkManager::forget (losing every shared channel and DM with them) stops it. A user-initiated send skips the remaining backoff, and a peer's own fresh invite re-arms a lost link immediately rather than being ignored."
evidence = "docs/PROTOCOL.md 7.1; src/client/p2p.rs PeerLinkManager::retry_due, mark_lost, retry_delay, ensure_link, on_peer_candidates; tests a_lost_link_is_re_signalled_automatically_on_a_backoff, the_retry_backoff_grows_and_stays_capped, a_lost_link_still_answers_a_fresh_invite_from_the_peer"

[[user_story.technical_behavior]]
id = "TB-179"
description = "An Active link's liveness is measured by anything received on it, Keepalive datagrams included rather than content alone, so a link that dies without either side sending (a NAT rebinding, a route changing) is noticed: receiving nothing for LINK_IDLE_TIMEOUT marks the link lost and puts it back into establishment, while a peer's keepalive beat alone is enough to keep an otherwise idle link up."
evidence = "docs/PROTOCOL.md 7.1; src/client/p2p.rs PeerLinkManager::note_received, tick_at (LINK_IDLE_TIMEOUT arm); tests an_active_link_that_goes_quiet_is_lost_and_re_established, a_peers_keepalive_keeps_an_otherwise_idle_link_alive"

[[user_story.technical_behavior]]
id = "TB-180"
description = "Content queued against a link that is not up survives that link failing and being punched again, and is flushed in order once it reopens - including frames that were still unacknowledged when the old link died, which are re-queued rather than lost with it. The ARQ sequence space belongs to one punched link and restarts with it on both sides, and the queue is bounded by PENDING_MAX and PENDING_MAX_AGE so nothing accumulates without bound or disappears without the user being told."
evidence = "docs/PROTOCOL.md 7.1.1; src/client/p2p.rs PeerLinkManager::send_reliable_or_queue, reset_transport, expire_pending; src/client/p2p_reliable.rs ArqSender::reset, ArqReceiver::reset; test content_queued_while_the_link_is_down_is_flushed_when_it_recovers"

[[user_story.technical_behavior]]
id = "TB-181"
description = "The client's own server-reflexive candidate is re-learned every REFLEXIVE_REFRESH_INTERVAL for the whole session rather than once at startup, which both keeps the NAT mapping it names from expiring while the client sits idle and keeps the address it advertises true. An observed address that has changed replaces it and re-signals every link that is not already up; links that are up are deliberately left alone, since on a symmetric NAT the server-facing mapping is independent of the peer-facing ones. That re-signal begins a fresh attempt through the same path every other re-attempt uses, resetting the reliable layer: a link that is not up may be lost rather than merely requested, still holding the ARQ state of traffic it carried, and the peer that follows the new nonce restarts its own sequence space - so a side that skipped its own reset would number frames from where the dead link stopped and have every one of them acked into the peer's reorder buffer and silently never delivered."
evidence = "docs/PROTOCOL.md 7.1; src/client/p2p.rs PeerLinkManager::refresh_reflexive, on_rendezvous, restart_attempt, learn_reflexive_candidate; tests a_changed_reflexive_address_re_signals_links_that_are_not_up, a_reflexive_change_restarts_the_sequence_space_of_a_link_that_carried_traffic"

[[user_story.technical_behavior]]
id = "TB-200"
description = "A candidate list is ordered and filtered so the CANDIDATES_MAX ceiling can never cost a link the one address that would have worked. The server-reflexive candidate - the only entry that can work between peers on different networks - is advertised ahead of the host ones, which are an unbounded list of whatever the machine's interfaces report (loopback, the LAN address, one gateway per Docker bridge, VPN or container network) and so can otherwise push it past a receiver's ceiling. Addresses of the family the session's socket is not bound to are advertised by neither side and stored by neither side: a send across families fails at the syscall, so such an address is not a worse candidate but an impossible one, and keeping it only spends a slot a reachable address needs."
evidence = "docs/PROTOCOL.md 7.1; src/client/p2p.rs local_candidates, host_candidates, PeerLinkManager::on_peer_candidates, CANDIDATES_MAX; tests the_reflexive_candidate_is_advertised_ahead_of_the_host_ones, candidates_of_the_wrong_address_family_are_never_advertised_or_stored"

[[user_story.technical_behavior]]
id = "TB-201"
description = "The server's UDP rendezvous loop treats a failed receive as recoverable and keeps listening, rather than ending. It is unauthenticated and answers whatever arrives, and it serves every client on the server at once, so ending the loop would silently leave every client that connects afterwards with host candidates only - able to punch on a LAN and nowhere else - for the rest of the server's uptime. Because it replies to whoever asked, an ordinary client disappearing can surface as an error on a later receive (on Windows, a connection-reset for the ICMP port-unreachable of an earlier reply, or a message-size error for a datagram larger than the buffer), which is exactly the case that must not be fatal. A short sleep before continuing keeps a permanently broken socket from busy-spinning the task, the same handling the client's own receive loop uses."
evidence = "docs/PROTOCOL.md 7.1; src/server/mod.rs udp_rendezvous_loop; src/client/p2p.rs spawn_receive_loop (same handling client-side); test the_rendezvous_socket_keeps_serving_after_junk_and_a_vanished_client"

