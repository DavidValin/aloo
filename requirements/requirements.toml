[[user_story.acceptance_criteria]]
id = "AC-120"
description = "An identity's fingerprint renders as an eight-word safety phrase drawn from a fixed 256-word list, stable for a given identity and different for a different one, so two people can confirm each other over any channel they already trust. The fingerprint covers the identity's keys only, not the continuity certificate, so attaching one never changes the phrase a user reads out."
