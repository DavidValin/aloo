description = "Revisiting an already-seeded surface (switching tabs away and back) never loads another chunk on top of what's there - only reaching the top of what's currently loaded does that, and only on `Up`/`PageUp`/`Home` while `message_selected` is already `0` (landing on `0` via a large jump doesn't itself cascade into a load; pressing the key again does). Exhausting the file (`LogHistoryCursor::has_more` false) makes further presses at the top a no-op again, same as before the feature existed."
