[[user_story.acceptance_criteria]]
id = "AC-371"
description = "Pressing Connect or Register does not freeze the screen on the popup's last drawn frame for however long the network round trip takes: both `register_account` and `connect_with_reconnect` run inside `run_with_processing_screen`, which hides the popup and its title banner, keeps the background animation moving, and shows a single centered yellow line in their place - \"connecting...\" for Connect, \"one moment...\" for Register - with a real clearing 3 rows/columns wide on every side of it where the animation draws nothing at all, restored to the popup (with the error shown) the moment the attempt resolves either way. Generic over any future, driven by the same `tokio::select!`-against-`ANIMATION_TICK` idiom the popup's own animation tick uses, so it never returns before the wrapped future actually does."
evidence = "docs/PROTOCOL.md; src/client/connect.rs run_with_processing_screen, run_client_inner; src/client/tui/ui_connect_popup.rs render_processing, PROCESSING_PAD, ANIMATION_TICK; tests run_with_processing_screen_returns_the_futures_own_output, run_with_processing_screen_waits_for_a_slow_future, run_with_processing_screen_tolerates_a_detached_surface (connect_test.rs), render_processing_does_not_panic_and_shows_the_label, render_processing_shows_whichever_label_it_was_given_padded_by_three, render_processing_clears_blank_rows_above_and_below_the_label_too, render_processing_does_not_panic_on_a_zero_sized_or_tiny_terminal, render_processing_animates_across_frames (ui_connect_popup_test.rs), register_account_does_not_freeze_the_animation (connect_processing_screen_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-372"
description = "The connect popup's background `DigitalRain` animation runs at a calm pace (ANIMATION_TICK 110ms, each column's own per-tick fall speed 1-2 rows) with a dense trail (8-12 rows per column, `DigitalRain::TRAIL_LEN`), and includes independently-flickering `0`/`1` glyphs scattered across cells outside every column's own falling trail (`background_glyph`, re-hashed on its own multi-tick cycle, not tied to any trail) - closer to a real \"matrix screen\" than sparse falling streaks over empty space. Each column's own fall speed and trail length reseed periodically, staggered per column, so the pattern keeps drifting rather than settling into one short repeating loop; a well-mixed hash (`DigitalRain::hash`, SplitMix64's finalizer) keeps neighbouring columns' speeds and phases independent of each other rather than correlated with their position. Same color palette throughout (white/bold head, light green near it, dim green trailing off, dim green too for the scattered background glyphs)."
evidence = "src/client/tui/ui_connect_popup.rs DigitalRain, TRAIL_LEN, RESEED_PERIOD, BACKGROUND_FLICKER_TICKS, BACKGROUND_DENSITY, background_glyph, hash, ANIMATION_TICK; tests the_background_animation_is_dense_with_scattered_glyphs_not_just_thin_streaks, the_background_animation_does_not_settle_into_a_short_repeating_cycle (ui_connect_popup_test.rs)"

[[user_story.acceptance_criteria]]
id = "AC-373"
description = "`run_with_processing_screen` only ever gets a chance to redraw/advance the animation at a genuine `.await` suspension point inside the wrapped future - it cannot preempt a long synchronous, CPU-bound stretch with no such point in it. `connect_and_handshake`'s own keypair resolution (`resolve_my_keypair`) is exactly that shape whenever the keybundle doesn't exist yet and has to be auto-generated (real ML-DSA-87/ML-KEM-1024/RSA-4096 keygen, several seconds), so it runs through `tokio::task::spawn_blocking` rather than being called directly - moving it off the task `run_with_processing_screen`'s own redraw+sleep loop runs on, so the animation keeps moving through it rather than freezing for however long keygen takes."
evidence = "src/client/connect.rs connect_and_handshake (spawn_blocking around resolve_my_keypair); test a_long_synchronous_stretch_must_be_moved_off_task_or_it_still_freezes (connect_test.rs), connect_with_reconnect_does_not_freeze_the_animation_through_real_keygen (connect_processing_screen_test.rs)"

