[[user_story.technical_behavior]]
id = "TB-220"
description = "The attach socket is created private to its owner (0600) since its permissions are the access control, and lives beside the pid and log files under the same ~/.aloo directory so ALOO_HOME separates two daemons. Whether a daemon is running is decided by connecting rather than by the socket file existing, so a second daemon refuses while one is listening - naming the pid that holds it - while the debris a SIGKILLed daemon leaves behind is replaced rather than treated as a live instance. Both files are removed when the daemon exits."
evidence = "docs/SPEC.md 'Running in background mode' 'Files it owns'; docs/SECURITY.md; src/client/daemon_ipc.rs bind_listener, connect, is_daemon_running, socket_path, pid_path, log_path; src/client/daemon.rs SingleInstance; tests the_socket_is_created_private_to_this_user, the_daemon_files_sit_together_under_the_aloo_directory, a_stale_socket_file_is_replaced_rather_than_refused, a_running_daemon_is_detected_by_connecting_not_by_the_file, acquiring_records_the_pid_and_releasing_cleans_up, a_second_daemon_refuses_while_one_is_listening, a_daemon_starts_over_the_debris_of_a_killed_one"

[[user_story.acceptance_criteria]]
id = "AC-204"
description = "The join sound (assets/joined.wav) plays only in daemon mode, only while no terminal is attached, and only for the *current* focus rather than the --focus the daemon started with. On a channel focus every arrival in that channel is announced; on a DM focus the focused person coming online is announced once however many shared channels the arrival reaches us through, and again the next time they come online after going offline. A foreground client, an attached one, an unfocused channel, anyone but the focused person, and having nothing focused at all are all silent."
evidence = "docs/SPEC.md 'Running in background mode'; src/client/daemon.rs DaemonPlan::should_play_joined_chime; src/client/tui/ui.rs UiState::current_focus, CurrentFocus; src/client/session.rs on_daemon_peer_appeared, SessionState::viewer_attached/announced_online; scenarios features/daemon/the_join_sound.feature"

[[user_story.acceptance_criteria]]
id = "AC-205"
description = "When a --otp daemon proposes an OTP session to the peer it is focused on and that session does not start - they decline, this side cannot store its half of the pad, or the proposal is refused before it is even sent (no otp binary, either side not pq_hybrid, an unreadable identity) - it plays the alert sound and raises a notification, since the shortcut is now ready to send voice that is not pad-protected. A session that starts is silent, a session somebody typed /otp for themselves is never announced, and the outcome is reported once rather than once per message mentioning it."
evidence = "docs/SPEC.md 'Running in background mode'; src/client/session.rs daemon_otp_outcome, SessionState::daemon_awaiting_otp, handle_ui_action's RequestOtpSession arm; src/client/otp.rs on_key_setup_ack; scenarios features/daemon/the_otp_alert.feature"

[[user_story.technical_behavior]]
id = "TB-215"
description = "A detached surface draws nothing at all rather than rendering to a sink - the state a daemon spends nearly all its life in has to be free, not merely quiet. An attached one emits exactly one message per frame (not one per internal write), and a frame written after its viewer has gone is dropped rather than raised as an error, so a viewer vanishing mid-frame cannot fail the session."
