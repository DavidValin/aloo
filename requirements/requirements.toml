[[user_story.acceptance_criteria]]
id = "AC-151"
description = "A user's connection closing entirely logs a yellow '<local time> <name> disconnected' line into every channel they were a member of, and into an already-open DM room with them - logged before membership bookkeeping runs, so it still happens even when they are then dropped from a channel's member list for lack of DM history."
evidence = "docs/SPEC.md Functionality #7; src/client/tui/ui.rs UiState::on_user_offline; test user_offline_logs_a_disconnected_notice_in_every_shared_channel_and_an_open_dm; scenario features/presence/presence_notices.feature 'A disconnect is announced in every shared channel and an open DM'"

[[user_story.technical_behavior]]
