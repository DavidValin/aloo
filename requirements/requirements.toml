so_that = "nobody can crash my client by sending it nonsense"

[[user_story.acceptance_criteria]]
id = "AC-129"
description = "Every decode path reachable by a remote peer or a local file - protocol messages, P2P payloads, punch datagrams, key bundles, send setups, rotations, control offers, frames, DER keys, hex - refuses random bytes, truncations and bit flips as errors rather than panicking or aborting."
evidence = "docs/SECURITY.md 'Robustness'; test/robustness_test.rs (random_bytes_never_panic_any_decoder, truncating_a_valid_message_never_panics, bit_flips_in_valid_messages_never_panic, opening_garbage_chunks_never_panics); malformed_input.feature 'Nonsense from a stranger is refused, not fatal'"

[[user_story.technical_behavior]]
id = "TB-172"
description = "The bincode decoder is capped at MAX_FRAME_LEN. Without the cap, decoding is a remote denial of service: bincode reserves whatever a length prefix claims, and those prefixes sit *inside* the payload where the frame-length check never sees them, so a dozen crafted bytes could abort the process on a failed allocation before any field was read. A length prefix past the cap is likewise a frame error, not an allocation."
evidence = "docs/SECURITY.md; src/proto.rs bincode_config (with_limit), parse_frame; tests random_bytes_never_panic_any_decoder, an_absurd_length_prefix_is_refused_not_allocated, bit_flips_in_valid_messages_never_panic"

[[user_story.technical_behavior]]
id = "TB-173"
description = "Local files a user may hand-edit or that arrive from elsewhere - the identity store and identity cards - load whatever survived rather than failing or crashing, and a card assembled from noise never verifies."
evidence = "docs/SECURITY.md; src/client/idstore.rs load; src/crypto/pq.rs load_identity_card, open_identity_card; tests a_damaged_identity_store_still_loads, a_garbage_identity_card_file_is_refused_without_panicking, a_card_decoded_from_noise_never_verifies"

[[user_story.technical_behavior]]
id = "TB-174"
description = "aloo's own constructions - the key-wrap combiner, send commitments, chunk nonces, control-channel key derivation and safety phrases - are pinned by committed test vectors, so an independent implementation can check itself and the wire format cannot drift unnoticed. The standard primitives (ML-KEM-1024, ML-DSA-87) are deliberately not re-tested here: their crates cover the NIST vectors upstream, and duplicating that would prove nothing about this codebase."
evidence = "docs/SECURITY.md 'Test vectors'; test/vectors_test.rs (chunk_nonce_vectors, key_wrap_combiner_vectors, send_commitment_vectors, sealed_chunk_vector, control_channel_key_vectors, safety_phrase_vectors)"

