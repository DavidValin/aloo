[[user_story.acceptance_criteria]]
id = "AC-121"
description = "A pin records how much it is worth: `tofu` for something believed because it turned up first, `verified` once a human has confirmed it out of band. Re-pinning never silently demotes a verified pin, the level survives save/load, and a store written before the column existed loads as `tofu` rather than being discarded - losing a user's pins would cost real security."
