# ============================================================================
# US-027 - One sealed layout for every kind of pq_hybrid content
# ============================================================================
[[user_story]]
id = "US-027"
title = "One sealed layout for every kind of pq_hybrid content"
as_a = "user of the quantum-resistant identity"
i_want = "everything I receive to name me as its intended recipient, whatever kind of content it is"
so_that = "nothing I am shown was ever meant for somebody else, and nothing I already read can be pushed at me again"

[[user_story.acceptance_criteria]]
id = "AC-111"
description = "A pq_hybrid send - text, file offer, voice stream or file transfer - is sealed as one setup naming its recipient, its room and its send counter, plus the content in chunks under the key that setup authorises. A one-chunk send is the whole of a text message; a stream is the same construction with more chunks."
evidence = "docs/PROTOCOL.md; src/crypto/pq.rs seal_send, seal_setup, seal_chunk; message_encryption.feature 'A sealed message reaches the person it was sealed for'; tests encrypt_then_decrypt_hybrid_round_trips, a_stream_of_chunks_opens_under_its_setups_key"

[[user_story.acceptance_criteria]]
id = "AC-112"
description = "A send names the identity it was sealed for, so a legitimate recipient cannot re-wrap it and pass it off as a message addressed to somebody else - the third party's own open fails closed rather than yielding a message they were never sent."
evidence = "docs/PROTOCOL.md; src/crypto/pq.rs SendBinding.recipient_fp, open_setup; message_encryption.feature 'A message sealed for someone else is refused'; tests a_send_sealed_for_one_recipient_does_not_open_for_another, open_setup_rejects_a_setup_sealed_for_someone_else"

[[user_story.acceptance_criteria]]
id = "AC-113"
description = "A send is bound to the room it belongs to: a private message replayed into a channel (or a channel message into a private room) is refused, because the receiving side compares the binding's channel against the payload the send actually arrived on."
evidence = "docs/PROTOCOL.md; src/crypto/pq.rs SendBinding.channel; src/client/session.rs decrypt_own_envelope; message_encryption.feature 'A private message replayed into a channel is refused'; test a_private_send_does_not_open_as_a_channel_send"

[[user_story.acceptance_criteria]]
id = "AC-114"
description = "A send that already arrived once is refused if it arrives again: a send_id must strictly exceed everything already accepted from that peer. Gaps are expected and accepted, since the counter is per connection rather than per recipient."
evidence = "docs/PROTOCOL.md; src/client/replay.rs ReplayGuard; message_encryption.feature 'A message that already arrived once is refused the second time'; tests a_repeated_send_id_is_refused, a_gap_in_send_ids_is_accepted"

[[user_story.acceptance_criteria]]
id = "AC-115"
description = "A voice or file stream is sealed by the identical construction a text message uses: one setup, then chunks. The setup travels once (P2pPayload::StreamKeySetup, reliably) rather than being repeated in every chunk, so a chunk carries ciphertext only and stays under SAFE_DATAGRAM_BYTES instead of fragmenting."
evidence = "docs/PROTOCOL.md; src/p2p_proto.rs P2pPayload::StreamKeySetup; src/client/voice_stream.rs PqStreamOut, ChunkDecryptor::install_setup; message_encryption.feature 'Streamed content is sealed exactly like a text message'; test a_stream_of_chunks_opens_under_its_setups_key"

[[user_story.technical_behavior]]
id = "TB-160"
description = "There is one seal/open pair for every pq_hybrid content type - text, file offers, voice and file chunks all go through seal_setup/open_setup plus seal_chunk/open_chunk, with seal_send/open_send as the one-chunk convenience. No content type has a layout of its own."
evidence = "docs/PROTOCOL.md; src/crypto/pq.rs (SendSetup, HybridSend); src/client/envelope.rs encrypt_hybrid_envelope_for; src/client/voice_stream.rs build_chunk_recipients; message_encryption.feature 'Streamed content is sealed exactly like a text message'"

[[user_story.technical_behavior]]
id = "TB-161"
description = "Every chunk's AES-256-GCM nonce is the deterministic big-endian send_id ++ seq, unique for the life of one send's freshly-random k_data - so no chunk needs fresh OS randomness, and two chunks of one send never repeat a nonce."
evidence = "docs/PROTOCOL.md; src/crypto/pq.rs chunk_nonce; message_encryption.feature 'Two chunks of one send never repeat a nonce'; tests same_plaintext_produces_different_ciphertext_under_different_seq, decrypting_a_chunk_with_the_wrong_seq_fails"

[[user_story.technical_behavior]]
id = "TB-162"
description = "Every RSA signature this app produces uses RSA-PSS with SHA-256 and a random salt (crypto::sign/verify), not PKCS#1 v1.5 - covering the pq_hybrid send commitment's classical half and the server auth control-channel signature, since both go through that one pair."
evidence = "docs/PROTOCOL.md; src/crypto/mod.rs sign, verify; tests signing_the_same_payload_twice_gives_different_signatures, a_pss_signature_does_not_verify_against_tampered_bytes, sign_verify_roundtrip"

[[user_story.technical_behavior]]
id = "TB-163"
description = "A pq_hybrid stream's chunks may outrun the reliable setup they depend on (voice chunks travel unreliably), so a receiver holds up to MAX_PENDING_CHUNKS of them and replays the backlog in arrival order once the setup verifies; beyond that bound further chunks are dropped rather than buffered without limit."
evidence = "docs/PROTOCOL.md; src/client/voice_stream.rs ChunkDecryptor (MAX_PENDING_CHUNKS, install_setup); test chunks_arriving_before_the_setup_are_replayed_once_it_lands"

# ============================================================================
# US-028 - Losing a key today does not expose what was said yesterday
# ============================================================================
[[user_story]]
id = "US-028"
title = "Losing a key today does not expose what was said yesterday"
as_a = "user of the quantum-resistant identity"
i_want = "the keys that unlock my messages thrown away as I go"
so_that = "someone who later steals my keybundle still cannot read what I already said"

[[user_story.acceptance_criteria]]
id = "AC-116"
description = "A pq_hybrid identity splits into a durable signing half (ML-DSA-87 + RSA-4096, in the keybundle file, pinned by contacts, never rotated) and an encryption half (ML-KEM-1024 + X25519) that is regenerated per peer relationship as messages are exchanged. Messages seal to the peer's current rotated key; a peer who has not rotated yet is still reachable on the bootstrap key from their bundle. Each relationship rotates independently."
evidence = "docs/PROTOCOL.md 13.10; src/crypto/pq.rs PqEncapKeys, generate_encryption_keys; src/client/pq_rekey.rs PqOwnKeys, PqPeerKeys; message_encryption.feature 'A message still reaches its recipient after keys have rotated'; tests a_message_opens_under_the_key_the_peer_rotated_to, the_bootstrap_key_still_opens_a_message_from_a_peer_who_never_rotated, rotation_is_independent_per_peer"

[[user_story.acceptance_criteria]]
id = "AC-117"
description = "A superseded encryption key is destroyed once it falls out of the retention window, so neither the keys still held nor the keybundle file on disk can open a message that was sealed to it. The exception, documented rather than hidden, is a first message exchanged before either side has rotated: that one is sealed to the bootstrap key the file does hold."
evidence = "docs/PROTOCOL.md 13.10; src/client/pq_rekey.rs PqOwnKeys::rotate_for, candidates_for, PQ_KEY_RETENTION; message_encryption.feature 'A stolen keybundle does not open yesterday''s message'; tests a_key_pushed_out_of_the_retention_window_cannot_open_its_message, forgetting_a_peer_drops_their_keys"

[[user_story.acceptance_criteria]]
id = "AC-118"
description = "Every rotation is signed by the sender's durable identity (both ML-DSA-87 and RSA-PSS) rather than by the key it replaces, so each one is independently verifiable against the bundle a contact already pinned - no chain to break, and no resume mechanism needed across a reconnect. A rotation signed by anyone else, or one whose generation is not newer than the last accepted, is dropped and leaves the trusted key untouched."
evidence = "docs/PROTOCOL.md 13.10; src/crypto/pq.rs sign_rotation, verify_rotation; src/client/pq_rekey.rs PqPeerKeys::install; src/client/session.rs handle_pq_key_rotated; message_encryption.feature 'A rotation is only trusted if the identity itself signed it'; tests a_rotation_is_trusted_only_if_the_identity_signed_it, an_older_rotation_generation_is_not_installed"

[[user_story.acceptance_criteria]]
id = "AC-119"
description = "A rotation commits to who it is for - both the recipient's live UserId and their durable identity fingerprint - so one peer cannot replay a rotation addressed to another as though it were meant for them."
evidence = "docs/PROTOCOL.md 13.10; src/crypto/pq.rs rotation_commitment; message_encryption.feature 'A rotation names who it is for'; test a_rotation_meant_for_one_peer_is_refused_by_another"

[[user_story.technical_behavior]]
id = "TB-164"
description = "Up to PQ_KEY_RETENTION superseded decryption keys are kept per peer so a burst of messages sent under one key, or a message already in flight when we rotate, still opens; anything older is discarded, and that bound is what the forward-secrecy guarantee rests on."
evidence = "docs/PROTOCOL.md 13.10; src/client/pq_rekey.rs PQ_KEY_RETENTION, candidates_for; message_encryption.feature 'A few recent keys are kept so a burst of messages still opens'; test recent_keys_are_retained_so_a_burst_still_opens"

[[user_story.technical_behavior]]
id = "TB-165"
description = "The per-recipient key wrap combines an ML-KEM-1024 shared secret with an X25519 shared secret from a per-send ephemeral keypair, via HKDF-SHA256 - so recovering the wrapped key needs both, and the ephemeral half gives forward secrecy on the sender's side too. This replaces the RSA-OAEP classical half used before rotation existed: X25519 keygen is fast enough to rotate per message, which RSA-4096 is not (the same pairing X-Wing uses, at a higher ML-KEM parameter set). RSA-4096 remains the classical hedge on the signing side."
evidence = "docs/PROTOCOL.md 13.3/13.10; src/crypto/pq.rs wrap_key_for, unwrap_key, hkdf_combine; tests the_wrap_needs_both_the_kem_and_the_x25519_halves, wrap_key_for_and_unwrap_key_round_trip"

[[user_story.technical_behavior]]
id = "TB-166"
description = "Rotation runs inline on the event loop rather than on a dedicated worker thread, because ML-KEM-1024 and X25519 keygen are microseconds - so pq_hybrid needs no rotation spinner and no carve-out exempting voice from per-message rotation. One trigger, session::request_rotation, drives it and is a no-op for the static modes."
evidence = "docs/PROTOCOL.md 13.10; src/client/session.rs request_rotation, request_rotation_if_pq_hybrid; src/client/pq_rekey.rs (module doc); test every_rotation_produces_new_keys_with_no_machinery_behind_it"

[[user_story.technical_behavior]]
id = "TB-167"
description = "The server relays RotateKey without inspecting it: it verifies nothing about the payload or the signature, and has no notion of which senders rotate - every client runs the one mode that does (13.10)."
evidence = "docs/PROTOCOL.md 7.5/13.10; src/server/mod.rs route_key_rotation; test the_server_relays_a_rotation_without_inspecting_it"

# ============================================================================
# US-029 - Proving an identity is still the same one
# ============================================================================
[[user_story]]
id = "US-029"
title = "Proving an identity is still the same one"
as_a = "user who has talked to someone before"
i_want = "a planned key change to prove itself, and a real identity to be verifiable"
so_that = "the warning I get means something when it finally appears"

[[user_story.acceptance_criteria]]
id = "AC-120"
description = "An identity's fingerprint renders as an eight-word safety phrase drawn from a fixed 256-word list, stable for a given identity and different for a different one, so two people can confirm each other over any channel they already trust. The fingerprint covers the identity's keys only, not the continuity certificate, so attaching one never changes the phrase a user reads out."
evidence = "docs/PROTOCOL.md 12.6; src/crypto/safety.rs phrase, WORDS; src/crypto/pq.rs bundle_fingerprint; identity_continuity.feature 'The same identity always reads out the same safety phrase'; tests a_safety_phrase_is_stable_and_distinguishes_identities, a_safety_phrase_is_eight_readable_words, a_single_changed_byte_changes_the_phrase, the_word_list_has_no_duplicates"

[[user_story.acceptance_criteria]]
id = "AC-121"
description = "A pin records how much it is worth: `tofu` for something believed because it turned up first, `verified` once a human has confirmed it out of band. Re-pinning never silently demotes a verified pin, the level survives save/load, and a store written before the column existed loads as `tofu` rather than being discarded - losing a user's pins would cost real security."
evidence = "docs/PROTOCOL.md 12.6; src/client/idstore.rs Trust, check_and_pin_with, mark_verified, trust; identity_continuity.feature 'A pin can be raised from trusted-on-sight to verified'; tests a_pin_starts_trusted_on_sight_and_can_be_raised_to_verified, re_pinning_does_not_silently_demote_a_verified_pin, trust_survives_a_save_and_load_round_trip, a_store_without_a_trust_column_loads_as_trusted_on_sight, on_disk_format_is_hex_encoded_not_raw_or_base64"

[[user_story.acceptance_criteria]]
id = "AC-122"
description = "A pq_hybrid identity generated by `aloo --rekey-pq-hybrid <old> <new>` carries a continuity certificate: the retired identity's ML-DSA-87 + RSA-PSS signature over the replacement's fingerprint. A peer holding the old pin verifies it and moves the pin across silently, with a status note and no review popup - so the review is left to mean 'this change is unexplained'."
evidence = "docs/PROTOCOL.md 12.6; src/crypto/pq.rs ContinuitySig, sign_continuity, verify_continuity, with_continuity; src/main.rs run_rekey_pq_hybrid; src/client/session.rs continuity_proven, check_identity; identity_continuity.feature 'A planned key change proves itself and raises no alarm'; tests a_replacement_identity_proves_it_succeeded_the_pinned_one, continuity_holds_across_successive_rekeys"

[[user_story.acceptance_criteria]]
id = "AC-123"
description = "Forging continuity needs the retired identity's private keys, which knowing its public fingerprint does not give. A bundle with no certificate, one signed by different keys, or a genuine certificate lifted onto another bundle all fail to verify, and a failure leaves the existing pin exactly as it was and opens the ordinary review."
evidence = "docs/PROTOCOL.md 12.6; src/crypto/pq.rs verify_continuity; identity_continuity.feature 'A stranger taking the nickname cannot fake continuity'; tests an_unrelated_identity_cannot_prove_continuity, a_certificate_signed_by_the_wrong_keys_is_refused, a_certificate_does_not_transfer_to_another_bundle"

[[user_story.acceptance_criteria]]
id = "AC-124"
description = "`aloo --export-identity-card <prefix> <nickname>` writes a small self-signed file pairing a nickname with an identity, shareable by any means. Importing one pins that nickname as verified before first contact - the one thing pinning alone can never do, since a first sighting has nothing to compare against."
evidence = "docs/PROTOCOL.md 12.6; src/crypto/pq.rs IdentityCard, make_identity_card, open_identity_card, save_identity_card, load_identity_card; src/main.rs run_export_identity_card; identity_continuity.feature 'An identity card pins someone before you ever speak'; tests an_identity_card_round_trips_and_names_its_owner, an_identity_card_survives_being_written_and_read_back"

[[user_story.acceptance_criteria]]
id = "AC-125"
description = "A card whose nickname was altered, whose bundle was swapped for someone else's, or whose bytes are corrupt is refused rather than pinned - the signature covers both the nickname and the identity fingerprint together."
evidence = "docs/PROTOCOL.md 12.6; src/crypto/pq.rs card_commitment, open_identity_card; identity_continuity.feature 'A tampered identity card is refused'; tests a_card_whose_nickname_was_altered_is_refused, a_card_whose_bundle_was_swapped_is_refused, a_corrupted_card_file_is_refused_rather_than_trusted"

[[user_story.technical_behavior]]
id = "TB-168"
description = "bundle_fingerprint covers the identity fields (ML-DSA verifying key, RSA signing key, bootstrap encryption keys) and excludes the continuity certificate - otherwise a certificate would have to sign the fingerprint of a bundle that already contains it. fingerprint_of_encoded is the same value computed from a bundle still in announced form, returning None if those bytes are not a bundle."
evidence = "docs/PROTOCOL.md 12.6/13.3; src/crypto/pq.rs bundle_fingerprint, fingerprint_of_encoded; test a_replacement_identity_proves_it_succeeded_the_pinned_one"

# ============================================================================
# US-030 - Keeping the setup conversation off the wire too
# ============================================================================
[[user_story]]
id = "US-030"
title = "Keeping the setup conversation off the wire too"
as_a = "user on a network I do not control"
i_want = "the conversation that sets my session up encrypted as well"
so_that = "someone watching the wire learns neither my password nor who I talk to"

[[user_story.acceptance_criteria]]
id = "AC-126"
description = "The server opens each connection with an ephemeral ML-KEM-1024 + X25519 offer in its Hello; the client transports a random secret to it (reusing crypto::pq's hybrid wrap, so recovering it needs both primitives) as ClientMessage::SecureChannel, and both sides derive two directional AES-256-GCM keys. Every frame after that, in both directions, is sealed; the length-prefix framing is unchanged. A client that sends anything but SecureChannel first is not talked to at all - there is no plaintext fallback to downgrade to."
evidence = "docs/PROTOCOL.md 1.3; src/control.rs ControlOffer, accept_offer, open_accept, ControlWriter, ControlReader, ControlEndpoint; src/server/mod.rs handle_connection; src/client/connect.rs connect_and_handshake; control_channel.feature 'The setup conversation is encrypted before anything is said'; tests both_sides_agree_on_the_same_keys, frames_are_sealed_once_the_tunnel_is_on, the_endpoint_handshake_turns_the_channel_on"

[[user_story.acceptance_criteria]]
id = "AC-127"
description = "A login's nickname and password, previously sent in the clear, no longer appear anywhere in the bytes on the wire; the same applies to channel names, membership and key-rotation traffic, all of which now travel inside the tunnel. What the server itself learns is unchanged (it still routes by these) - only what an observer in between learns."
evidence = "docs/PROTOCOL.md 1.3/10; src/control.rs (module doc), ControlWriter::send; control_channel.feature 'A password does not appear on the wire'; test the_password_is_not_recoverable_from_the_sealed_bytes"

[[user_story.acceptance_criteria]]
id = "AC-128"
description = "This layer's own offer is ephemeral and carries no signature - nothing at the control-channel level vouches for the server, which is a real, documented limit rather than one implied away. A deployment that needs the server authenticated runs the connection over TLS instead (server_ssl, US-044), whose certificate is checked before a single control-channel frame is exchanged."
evidence = "docs/PROTOCOL.md 1.3, 1.4; src/control.rs (module doc), ControlOffer; src/server/ssl.rs; tests a_real_tls_handshake_carries_bytes_both_ways, a_client_with_the_wrong_trust_root_refuses_the_handshake"

[[user_story.technical_behavior]]
id = "TB-169"
description = "Each direction has its own key (so a captured frame cannot be reflected back) and its own counter, which forms the AES-GCM nonce - so identical plaintext sealed twice never produces identical bytes. A frame that fails its authentication tag is a hard error, never a skipped message: on an encrypted channel that means tampering or desynchronised counters, and both are fatal."
evidence = "docs/PROTOCOL.md 1.3; src/control.rs derive, nonce, seal, open; control_channel.feature 'The same message twice does not look the same twice'; tests repeating_a_message_does_not_repeat_the_ciphertext, a_tampered_frame_fails_to_authenticate"

[[user_story.technical_behavior]]
id = "TB-170"
description = "The control channel's encryption keys are ephemeral per connection and discarded with it, so recording a session and later gaining any long-term key this server holds - a TLS private key included - still does not decrypt it."
evidence = "docs/PROTOCOL.md 1.3; src/server/mod.rs handle_connection (generate_encryption_keys per connection); src/control.rs (module doc); test a_different_server_cannot_recover_the_secret (TB-170)"

[[user_story.technical_behavior]]
id = "TB-171"
description = "Client send paths (joining a channel, requesting a peer link, rotating a key) take the control::ControlSink trait rather than naming a concrete writer, so the live client's split-stream ControlWriter and anything driving a connection sequentially (ControlEndpoint) share one set of call paths instead of duplicated ones."
evidence = "src/control.rs ControlSink; src/client/channel.rs, src/client/direct_message.rs, src/client/p2p.rs (send paths); test the_endpoint_handshake_turns_the_channel_on (TB-171)"

# ============================================================================
# US-031 - Surviving input nobody meant to send
# ============================================================================
[[user_story]]
id = "US-031"
title = "Surviving input nobody meant to send"
as_a = "user whose client talks to strangers over a network"
i_want = "malformed, truncated or hostile input to fail as an error"
so_that = "nobody can crash my client by sending it nonsense"

[[user_story.acceptance_criteria]]
id = "AC-129"
description = "Every decode path reachable by a remote peer or a local file - protocol messages, P2P payloads, punch datagrams, key bundles, send setups, rotations, control offers, frames, DER keys, hex - refuses random bytes, truncations and bit flips as errors rather than panicking or aborting."
evidence = "docs/SECURITY.md 'Robustness'; test/robustness_test.rs (random_bytes_never_panic_any_decoder, truncating_a_valid_message_never_panics, bit_flips_in_valid_messages_never_panic, opening_garbage_chunks_never_panics); malformed_input.feature 'Nonsense from a stranger is refused, not fatal'"

[[user_story.technical_behavior]]
id = "TB-172"
description = "The bincode decoder is capped at MAX_FRAME_LEN. Without the cap, decoding is a remote denial of service: bincode reserves whatever a length prefix claims, and those prefixes sit *inside* the payload where the frame-length check never sees them, so a dozen crafted bytes could abort the process on a failed allocation before any field was read. A length prefix past the cap is likewise a frame error, not an allocation."
evidence = "docs/SECURITY.md; src/proto.rs bincode_config (with_limit), parse_frame; tests random_bytes_never_panic_any_decoder, an_absurd_length_prefix_is_refused_not_allocated, bit_flips_in_valid_messages_never_panic"

[[user_story.technical_behavior]]
id = "TB-173"
description = "Local files a user may hand-edit or that arrive from elsewhere - the identity store and identity cards - load whatever survived rather than failing or crashing, and a card assembled from noise never verifies."
evidence = "docs/SECURITY.md; src/client/idstore.rs load; src/crypto/pq.rs load_identity_card, open_identity_card; tests a_damaged_identity_store_still_loads, a_garbage_identity_card_file_is_refused_without_panicking, a_card_decoded_from_noise_never_verifies"

[[user_story.technical_behavior]]
id = "TB-174"
description = "aloo's own constructions - the key-wrap combiner, send commitments, chunk nonces, control-channel key derivation and safety phrases - are pinned by committed test vectors, so an independent implementation can check itself and the wire format cannot drift unnoticed. The standard primitives (ML-KEM-1024, ML-DSA-87) are deliberately not re-tested here: their crates cover the NIST vectors upstream, and duplicating that would prove nothing about this codebase."
evidence = "docs/SECURITY.md 'Test vectors'; test/vectors_test.rs (chunk_nonce_vectors, key_wrap_combiner_vectors, send_commitment_vectors, sealed_chunk_vector, control_channel_key_vectors, safety_phrase_vectors)"

# ============================================================================
# US-032 - Documentation that can be trusted and acted on
# ============================================================================
[[user_story]]
id = "US-032"
title = "Documentation that can be trusted and acted on"
as_a = "person implementing this protocol, or deciding whether to trust it"
i_want = "the protocol described without reference to its implementation, and the bridge back kept accurate"
so_that = "I can write a second implementation without reading this codebase, and find the code when I need it"

[[user_story.acceptance_criteria]]
id = "AC-130"
description = "docs/PROTOCOL.md describes the protocol in neutral pseudocode with sequence diagrams and names no Rust item, type, syntax or source path; docs/SPEC.md carries a mapping from every protocol term to the item implementing it, and every mapped item exists in src/; docs/SECURITY.md keeps stating its limits (no independent review, partial post-compromise security, trust-on-first-use, no deniability) and not only its strengths. All three are machine-checked, because each is easy to break by accident and invisible in review."
evidence = "docs/PROTOCOL.md; docs/SPEC.md 'Protocol terms, and what implements them'; docs/SECURITY.md; test/docs_test.rs (the_protocol_document_contains_no_rust, every_mapped_item_exists_in_the_source, the_security_document_states_its_limits)"

[[user_story.acceptance_criteria]]
