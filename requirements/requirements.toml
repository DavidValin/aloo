[[user_story.technical_behavior]]
id = "TB-199"
description = "CallInvite, CallAccept, CallReject and CallEnd (the live-call signaling family) round-trip through bincode encode/decode intact, addressed point-to-point like the file-transfer message family."
evidence = "docs/PROTOCOL.md 'Live voice calls'; src/p2p_proto.rs P2pPayload::CallInvite/CallAccept/CallReject/CallEnd; test live_call_message_family_roundtrips"

[[user_story.technical_behavior]]
id = "TB-279"
description = "A call's capture stops sending once it has been below SILENCE_LEVEL for SILENCE_HANGOVER, and resumes the moment it is not - silence is not worth a packet to every participant of a mesh call. The hangover is what keeps the quiet moments inside speech (the closure before a plosive, the gap between words) from cutting the stream and making the receiver rebuild its prebuffer repeatedly. Deliberately not applied to a push-to-talk voice message: that is a recording the receiver reassembles chunk by chunk, so dropping its silence would shorten the message and pull the audio either side of a pause together."
evidence = "docs/SPEC.md 'Live voice calls'; src/client/voice.rs SilenceGate, SILENCE_LEVEL, SILENCE_HANGOVER; src/client/voice_call.rs spawn_call_audio_worker; test the_silence_gate_sends_speech_holds_through_a_pause_and_then_stops"

[[user_story.technical_behavior]]
id = "TB-207"
description = "CallMute and CallRoster - the roster-authority half of the live-call signaling family - round-trip through bincode encode/decode intact, including an empty roster."
evidence = "docs/PROTOCOL.md 7.7; src/p2p_proto.rs P2pPayload::CallMute/CallRoster; test host_mute_and_roster_messages_roundtrip"

[[user_story.technical_behavior]]
id = "TB-208"
description = "A voice level is the RMS of one chunk's samples scaled against LEVEL_FULL_SCALE_RMS and clamped to 0-100, so a single sample spike cannot paint a full meter the way a peak reading would."
evidence = "src/client/voice.rs level_from_pcm, LEVEL_FULL_SCALE_RMS; test level_from_pcm_reads_rms_loudness_clamped_to_a_hundred"

[[user_story.technical_behavior]]
id = "TB-209"
description = "A call participant's pq_hybrid StreamKeySetup arriving before that participant is in our roster is held (ActiveCall::pending_setups) and replayed into their decrypt worker the moment they are added, rather than dropped - the ordinary ordering, since a peer sends its setup the instant it adds us, before its own CallAccept has reached us."
evidence = "docs/PROTOCOL.md 7.7; src/client/voice_call.rs forward_key_setup, add_participant, is_call_stream; test a_call_key_setup_arriving_before_the_participant_is_replayed_once_they_join"

[[user_story.technical_behavior]]
id = "TB-268"
description = "A call participant's audio chunks arriving before that participant is in our roster - the same ordinary CallAccept-still-in-flight race TB-209 holds StreamKeySetup against, except a stream of chunks rather than one setup - are held (ActiveCall::pending_chunks, reusing voice_stream::PendingChunkBuffer verbatim) and replayed into their decrypt worker in arrival order, after their key setup and before any live chunk, the moment they are added - rather than dropped, which would otherwise mean a participant's first moment of audio is silently missing every time they join a call already in progress."
evidence = "docs/PROTOCOL.md 7.7; src/client/voice_call.rs ActiveCall::pending_chunks, forward_chunk, add_participant; PendingChunkBuffer itself is proven under TB-267 (tests chunks_arriving_before_stream_start_are_replayed_in_arrival_order, pending_chunks_are_isolated_by_both_sender_and_stream_id, a_stream_start_that_never_arrives_is_swept_after_its_timeout, pending_chunks_stay_bounded_under_a_flood) and reused unchanged here; the call-specific call sites are covered at the acceptance layer only (docs/TESTING.md), the same reason TB-209's own add_participant wiring is"

