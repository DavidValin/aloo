[[user_story.acceptance_criteria]]
id = "AC-048"
description = "A `(nickname, device_id)` pair returning under a different, unverifiable key opens a blocking Accept/Reject review naming the user - see US-017 for what Accept/Reject actually do. `Accept` replaces only that one device's entry, or adds a brand-new one, leaving every sibling device's own pin untouched (`IdStore::accept_identity_review`, device-pinning plan §2) - key and `key_mode` set atomically on the one resolved entry, which matters specifically for the rare case a review is accepted before this connection's device id was ever learned (`session.rs`'s `AcceptIdentity` arm falls back to the unbound `\"\"` sentinel): that sentinel is shared by *every* unbound entry regardless of `key_mode`, so a nickname that already has an unrelated unbound `Direct` pin (§16.2) must never have it silently corrupted by an unrelated `pq_hybrid` review being accepted."
