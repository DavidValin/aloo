[[user_story.technical_behavior]]
id = "TB-212"
description = "Ending a session (either side's /endotp, or the receiving side converging after being told) resets a contact's entire OTP record back to its never-provisioned defaults - not just the provisioned flag - including both sequence counters and any outstanding gate/setup state. This is what makes a later fresh pad, provisioned under the same deterministically-derived contact name, never inherit stale sequence or gate state from the session just ended - a wholly fresh pad always starts at Seq 0 on both sides, and never reuses any key material or bookkeeping another session (with this contact, or any other) already consumed."
