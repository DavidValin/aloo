[[user_story.acceptance_criteria]]
id = "AC-145"
description = "The one-time-pad layer can protect a whole file's/voice message's actual content, not just a message's worth of bytes: the otp CLI wrapper pipes a file straight through the real otp command's stdin/stdout (never buffering the whole thing in this process's own memory, preserving the existing no-size-cap guarantee), and a second encrypt attempted without genuine proof of the first one's delivery still fails closed, exactly as the in-memory path already does. A slot is only ever reserved (record_sent) once its genuine otp --encrypt has actually succeeded, never speculatively ahead of one - a failed encrypt simply never reserves anything in the first place, so nothing is ever left needing to be released."
