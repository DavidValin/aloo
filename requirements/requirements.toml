[[user_story.technical_behavior]]
id = "TB-278"
description = "When ducking is in force (TB-282 decides that under auto), captured audio is attenuated to ECHO_DUCK_GAIN while the speakers are playing above ECHO_DUCK_TRIGGER_LEVEL and left untouched otherwise, ramped across each chunk rather than stepped between them. The attack is near-immediate - useful attenuation within the first chunk or two - because a slow one leaves the microphone at nearly full gain through the opening of every far-end phrase, which leaks an echo burst on every utterance and is indistinguishable from no ducking at all; release stays an order of magnitude slower, where the cost is one quiet syllable rather than re-opening the microphone into the far end's own tail. Attenuation rather than a gate, so someone talking over the other side is still audible; applied to live calls and push-to-talk voice messages alike, since both capture through the same microphone while the same speakers play."
evidence = "docs/SPEC.md Functionality #4 'Echo'; src/client/voice.rs EchoDucker, publish_playback_level, mix_output; src/client/voice_call.rs spawn_call_audio_worker; src/client/voice_stream.rs spawn_record_stream_worker; tests the_ducker_reaches_useful_attenuation_within_the_first_chunks, the_ducker_attenuates_capture_while_the_speakers_are_playing, the_ducker_leaves_capture_untouched_when_nothing_is_playing, the_ducker_comes_back_to_full_gain_once_the_speakers_go_quiet"

[[user_story.technical_behavior]]
id = "TB-282"
description = "Under voice_echo_ducking=auto, whether an echo path exists is measured rather than declared: the microphone's own level is averaged separately over the chunks where the far end is talking and the chunks where it is not, and the *ratio* between those two averages is what decides - a fixed number of meter points only caught echo loud enough to be obnoxious and released ducking for every quieter room, which still echoes, just politely; a ratio also behaves the same in a noisy room and a silent one. Our own speech lands in both populations (we do not arrange our talking around theirs) and so drops out of the difference. Detection works on envelopes at chunk resolution, where no sample alignment between the two device clocks is needed - which is why detecting an echo path is tractable in pure Rust while cancelling one is not. The probe starts out ducking and needs ECHO_EVIDENCE_MIN_OBSERVATIONS of each kind before it will conclude anything, so a call where the far end has not spoken yet decides nothing; the engage and release thresholds differ, so a room sitting near the boundary keeps its previous answer instead of toggling every chunk; and it re-engages by itself when the room changes mid-call, which no setting can do. It must be fed the capture level from before EchoDucker attenuated it and not fed at all while muted - either would let ducking suppress the evidence it is judged by and turn the decision into a feedback loop."
evidence = "docs/SPEC.md Functionality #4 'Echo'; src/client/voice.rs EchoProbe, ECHO_EVIDENCE_ENGAGE/RELEASE/MIN_OBSERVATIONS; src/client/voice_stream.rs duck_capture; src/client/voice_call.rs spawn_call_audio_worker; tests the_probe_ducks_until_it_has_evidence_either_way, a_quiet_but_audible_echo_still_holds_ducking_on, the_probe_releases_on_headphones_where_the_microphone_hears_nothing, the_probe_keeps_ducking_on_speakers_where_the_microphone_hears_them, the_probe_re_engages_when_headphones_come_out_mid_call, the_probes_decision_has_hysteresis_so_it_cannot_flap"

[[user_story.technical_behavior]]
id = "TB-280"
description = "Both audio backends ask for a DEVICE_BUFFER_MS period explicitly instead of taking the device's default - a default ALSA period is commonly tens of milliseconds and a default pa_simple playback target latency far more, and both sit directly between someone speaking and someone hearing it. The frame count is clamped into the range the device supports; a device publishing no range at all is left on its own default rather than handed a number it may reject, and cpal falls back to that default if a fixed size is refused."
evidence = "src/client/voice.rs DEVICE_BUFFER_MS, device_buffer_frames, build_with_buffer_fallback; src/client/voice_pulse.rs playback_attr, capture_attr; test a_device_period_is_asked_for_explicitly_and_clamped_to_what_it_supports"

[[user_story.technical_behavior]]
id = "TB-281"
description = "A capture device whose name says it cancels echo (module-echo-cancel's source, or a driver exposing a cancelled endpoint) is preferred over the ordinary device choice, and turns EchoDucker off for that recording - real cancellation solves what ducking only mitigates, and solves it without costing full duplex. The name match is narrow enough that it cannot select a device the user did not mean."
evidence = "src/client/voice.rs is_echo_cancelling_device, preferred_input_device, Recorder::echo_cancelled; src/client/voice_pulse.rs PULSE_ECHO_CANCEL_SOURCE fallback; test an_echo_cancelling_capture_device_is_recognised_by_name_and_nothing_else_is"

[[user_story.technical_behavior]]
id = "TB-236"
description = "An incoming voice stream that has gone quiet past STREAM_IDLE_TIMEOUT is asked to end exactly once (its worker then finalizes the row from whatever partial audio arrived and its report removes the entry). A stream still there after that ask, whose worker has gone without answering, is given up on: the sweep closes the row itself, so a placeholder can never blink 'streaming...' for the rest of the session and the entry cannot leak. A stream still receiving, or one already asked whose worker is still there, is left alone."
evidence = "docs/PROTOCOL.md 7.3; src/client/voice_stream.rs IdleStreamAction, idle_stream_action, ActiveStream::end_requested; src/client/session.rs sweep_idle_streams; tests a_stream_that_is_still_arriving_is_never_swept, a_quiet_stream_is_asked_to_end_exactly_once, a_stream_whose_worker_is_gone_is_given_up_on"

[[user_story.technical_behavior]]
id = "TB-267"
description = "A chunk that reaches a receiver before its own StreamStart is processed (Chunk travels unreliable UDP while StreamStart travels the reliable channel over the same socket, so nothing orders one relative to the other) is held in a bounded PendingChunkBuffer keyed by (from, stream_id), and replayed in arrival order the moment that StreamStart actually starts the stream - rather than dropped, which would silently lose an entire recording short enough to finish before StreamStart lands. A buffer whose StreamStart never arrives is aged out after EARLY_CHUNK_TIMEOUT, and both the chunks per stream and the number of distinct never-started streams held at once are capped, so a lost or withheld StreamStart cannot grow this without bound."
