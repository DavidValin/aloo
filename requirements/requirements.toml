# ============================================================================
# US-050 - Restrict who may create new public channels
# ============================================================================
[[user_story]]
id = "US-050"
title = "Restrict who may create new public channels"
as_a = "server operator"
i_want = "to optionally stop ordinary users from minting brand-new public channels"
so_that = "the public channel directory doesn't fill up with clutter no one asked for"

[[user_story.acceptance_criteria]]
id = "AC-337"
description = "server_allow_create_public_channels (default on) gates only the creation of a brand-new public channel. When off: joining an already-existing public channel still works exactly as before, and creating or joining a private channel is entirely unaffected - the switch has no opinion about private channels at all, since nothing about them is ever publicly listed in the first place."
evidence = "docs/SPEC.md 'Server startup'; src/settings.rs Settings::server_allow_create_public_channels; src/server/mod.rs ServerOptions::with_create_public_channels_policy; src/main.rs run_server; tests creating_a_new_public_channel_is_refused_when_the_policy_is_off, joining_an_existing_public_channel_is_unaffected_by_the_policy, creating_a_private_channel_is_unaffected_by_the_policy (server_channels_registry_test.rs), server_allow_create_public_channels_defaults_on_and_is_always_written, server_allow_create_public_channels_round_trips_off (settings_test.rs)"

[[user_story.technical_behavior]]
id = "TB-256"
description = "The policy is enforced once, server-side, inside ChannelsRegistry::join itself - never client-side-only - so a modified or misbehaving client gains nothing by skipping its own check. A refusal is a plain free-text ChannelJoinFailed { name, reason }, the same shape TB-113's unregistered-user refusal already uses, not a new ChannelJoinRejection variant, since there is no retry-with-different-input flow to distinguish it for."
