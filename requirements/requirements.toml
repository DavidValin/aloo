[[user_story.acceptance_criteria]]
id = "AC-146"
description = "While OTP is active for a DM peer, sending that peer a file protects both the offer naming it and the file's actual bytes under the pad - two independent pad spends, not one: the offer (filename + size) is wrapped through the pad exactly like a text message the moment it is sent (a deliberate choice, AC-148, to keep the filename off the wire even at the cost of pad on offers that are later rejected), and the file's content is a second, later pad spend, reserved only once the offer is accepted, encrypting the whole file into a temp file that the existing chunked transport streams unchanged; the receiving side decrypts the reassembled temp file whole once it fully arrives, then acknowledges that second slot. A voice message under OTP is never live-streamed - it is recorded fully first and sent as the very same two spends a file uses: its offer (the duration) is wrapped through the pad the moment it is sent, and the recording is a second, later spend encrypted whole once that offer is acknowledged. The offer is padded rather than left to the envelope for the same reason a file's filename is - under Direct framing there is no envelope to hide the duration in, so nothing but the pad would protect it. The only difference from a file is that no popup asks: voice auto-accepts, so the receiving side stages and accepts in one step. Once decrypted on arrival it becomes an ordinary, already-finished voice message, playable on Enter exactly like any other. Both directions clean up their temporary plaintext/ciphertext staging files regardless of outcome, and this layer stays DM-only for both, matching text."
evidence = "src/client/otp.rs send_file_offer, on_file_offer, start_outgoing_file_content, finish_incoming_file, send_voice_offer, on_voice_offer, temp_content_path, secure_remove_file; src/client/session.rs accept_file_offer, handle_file_event, handle_p2p_event's FileAccepted/FileRejected/OtpFileContentSeq/OtpVoiceOffer arms, decrypt_voice_offer; src/client/voice_stream.rs OwnStreamTarget::DirectOtp, spawn_record_accumulate_worker; src/client/direct_message.rs handle_send_file, handle_voice_record_start; src/proto.rs Content::VoiceOffer; src/p2p_proto.rs P2pPayload::OtpFileOffer/OtpFileContentSeq/OtpVoiceOffer; src/client/file_transfer.rs OwnFileTarget.otp, OtpIncomingFileReceive, OtpIncomingKind, VoiceOfferPayload; docs/PROTOCOL.md 16.2; verified manually with two clients (docs/TESTING.md 'Known coverage gaps' - session.rs needs a live socket, same as the other wiring-only gaps documented there)"

[[user_story.acceptance_criteria]]
id = "AC-148"
description = "An OTP file offer's filename and size are deliberately kept off the wire in the clear: an OTP-active file offer spends its own independent unit of pad the instant it is sent, exactly like a text message - accepted as worth the cost even for an offer that ends up rejected, in favour of never letting the filename/size travel any less protected than the rest of an OTP conversation. This is why sending one file under OTP is two independent pad spends rather than one (AC-146): the offer's slot closes on its own ack the moment the peer's client decrypts and queues it for the popup - independent of whether the user has actually decided to accept - and the content's slot is only reserved afterward, once accepted. If the offer's own ack is lost (the peer never replies, or goes offline before it can), there is no local fallback: the pad was already genuinely spent the instant it left the machine, so the only path forward is the same recover-and-resend replay every other pad-protected send already relies on (AC-147) - never a fresh re-encode, which would desync the receiver's pad position permanently."
evidence = "src/client/otp.rs send_file_offer, on_file_offer, recover_and_resend_file_offer; src/client/otp_store.rs PendingOtpContent::File; src/p2p_proto.rs P2pPayload::OtpFileOffer; docs/PROTOCOL.md 16.2 'File content'; verified manually with two clients (docs/TESTING.md 'Known coverage gaps')"

[[user_story.acceptance_criteria]]
id = "AC-147"
description = "A send whose ciphertext has already left the machine - this app restarted before the peer's ack arrived, the connection dropped and reconnected, or the ack itself was simply lost - is recovered by replaying the exact ciphertext otp already kept a safety copy of (otp --recover-last), never by re-encoding the message fresh: encoding a second time before the first is genuinely acknowledged would desync the receiver's decode position from that point on, permanently, since the pad has no integrity check to catch it. Recovery is retried automatically every time a direct link to that contact genuinely becomes reachable again (not on a timer, not polled), covers text, a file's offer phase, a file's content phase, and voice content alike - each its own independently-recoverable pad slot - and resends under the exact same sequence number as the original attempt - so if the peer had actually already processed it and only the acknowledgement was lost, their own replay guard (AC-137/TB-188) rejects the resend as a harmless duplicate rather than decoding it a second time. A recovery attempt that finds nothing to recover, or that fails, leaves the ack-gate exactly as it was rather than falling back to a fresh encode."
evidence = "src/client/otp_cli.rs recover_last, recover_last_file, RecoverDirection; src/client/otp_store.rs OtpContactState.pending_content, PendingOtpContent, OtpStore::pending_sends; src/client/otp.rs recover_and_resend, recover_and_resend_envelope, recover_and_resend_file_offer, recover_and_resend_file_content, recover_and_resend_voice_offer, peer_for_contact_name; src/client/session.rs handle_p2p_event's LinkStatusChanged arm; tests recover_last_sent_replays_without_consuming_key, recover_last_file_replays_the_last_sent_ciphertext_without_consuming_key, pending_content_round_trips_through_save_and_load, pending_sends_yields_only_contacts_with_something_outstanding, record_acked_clears_pending_content"

[[user_story.acceptance_criteria]]
id = "AC-192"
description = "Either participant may end an active OTP session with /endotp - the peer is told, not asked (no accept/reject round trip the way starting one needs), though the end itself completes as the two-phase, confirmation-gated handshake AC-310 specifies rather than instantly. The pad is paused, never destroyed (TB-212), so a later /otp resumes it. /endotp is refused, out loud, when there is no active session with that peer, when the peer is offline, when an end is already in flight, or when a mail send to that exact contact is still awaiting the pad's stop-and-wait gate - a mail's server acknowledgement arrives on its own schedule and must not interleave with the end handshake over one gate (AC-159's mail-retry mechanism). Ending one contact's session never touches any other contact's independent session or pad."
evidence = "src/client/otp.rs handle_end_otp_command, decide_end_otp, EndOtpDecision, on_end_session, send_end_notice_now; src/client/otp_store.rs mark_end_requested, pause_after_peer_ended; src/client/tui/ui.rs UiAction::EndOtpSession, submit_input (/endotp), clear_otp_active; src/client/session.rs handle_ui_action's EndOtpSession arm; src/proto.rs Content::OtpEndSession/OtpEndSessionAck; src/crypto/otp.rs OtpEndSessionPayload; docs/PROTOCOL.md 16.6; tests decide_end_otp_refuses_when_nothing_is_provisioned, decide_end_otp_refuses_while_a_mail_is_in_flight, decide_end_otp_allows_ending_with_a_plain_pending_send, decide_end_otp_allows_ending_a_quiescent_session, end_session_payload_round_trips_through_the_wire_encoding, clear_otp_active_reverses_mark_otp_active_and_drops_the_key_status_snapshot, endotp_in_an_open_dm_room_produces_end_otp_session_for_that_peer, endotp_outside_any_open_dm_room_is_a_no_op; message_encryption.feature; end_session_both_pq_hybrid_travels_under_the_pad and its siblings (otp_ack_wiring_test.rs) cover the full send/receive/ack wiring"

[[user_story.acceptance_criteria]]
id = "AC-193"
description = "An active OTP session is never ended by either participant merely disconnecting and reconnecting - it stays active, with the shield prefix, the live key-metadata header, and the DM-only call restriction (AC-146) all still in force, until one side explicitly runs /endotp (AC-192). A peer's per-connection UserId changes on every reconnect, but the session's own state (whether the pad is still usable at all) is keyed by the pair's stable, fingerprint-derived contact name, so it survives independently of that; the moment a peer with an already-provisioned contact is seen again, the UI-facing 'active' flag is re-established for their new UserId."
