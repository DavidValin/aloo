evidence = "docs/PROTOCOL.md 17.1; src/client/otp_mail.rs check_recipient, RecipientCheck; src/client/tui/otp_mail.rs render_otp_mail_view's To field, check_failure_label; tests typing_in_to_emits_a_recipient_check_per_keystroke, a_failed_check_renders_the_to_field_red_with_a_cross, a_passing_check_renders_green_with_a_tick, a_stale_check_result_for_an_edited_nickname_is_ignored; scenarios features/messaging/otp_mail.feature 'An unpinned recipient renders invalid with a cross', 'A pinned recipient with enough key renders valid with a tick'"

[[user_story.acceptance_criteria]]
