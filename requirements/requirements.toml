[[user_story.acceptance_criteria]]
id = "AC-122"
description = "A pq_hybrid identity generated by `aloo --rekey-pq-hybrid <old> <new>` carries a continuity certificate: the retired identity's ML-DSA-87 + RSA-PSS signature over the replacement's fingerprint. A peer holding the old pin verifies it and moves the pin across silently, with a status note and no review popup - so the review is left to mean 'this change is unexplained'."
