# cpal's ALSA backend needs libasound's headers and a pkg-config file at
# build time. cross's Docker images don't ship them, so we install the
# target-arch package inside the build container before cargo runs.
#
# musl images don't preset PKG_CONFIG_PATH to the multiarch pkgconfig dir the
# way the gnu image does, so the .pc file is also copied into a directory
# pkg-config always searches by default, regardless of env vars.
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update && apt-get install --assume-yes libasound2-dev:arm64",
]

[target.x86_64-unknown-linux-musl]
pre-build = [
    "apt-get update && apt-get install --assume-yes libasound2-dev",
    "mkdir -p /usr/local/lib/pkgconfig && cp /usr/lib/x86_64-linux-gnu/pkgconfig/alsa.pc /usr/local/lib/pkgconfig/",
]

[target.aarch64-unknown-linux-musl]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update && apt-get install --assume-yes libasound2-dev:arm64",
    "mkdir -p /usr/local/lib/pkgconfig && cp /usr/lib/aarch64-linux-gnu/pkgconfig/alsa.pc /usr/local/lib/pkgconfig/",
]
