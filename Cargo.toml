[package]
name = "aloo"
version = "0.4.0-alpha.8"
edition = "2024"

authors = ["David Valin <hola@davidvalin.com>"]
homepage = "https://crates.io/crates/aloo"
repository = "https://github.com/DavidValin/aloo"
description = "ultra secure terminal walky-talky / chat / file transfer"
license-file = "LICENSE"
readme = "README.md"

# PQ-hybrid `my_key` (KeyMode::PqHybrid, see crypto/pq.rs): `ml-dsa`/`ml-kem`/`aes-gcm`
# sit on RustCrypto's newer trait generation (crypto-common 0.2, signature 3,
# hybrid-array, rand_core 0.10 - pulled in transitively, never named directly here
# since crypto/pq.rs only ever calls each crate's own zero-arg `getrandom`-feature
# convenience methods, e.g. `SigningKey::generate()`/`ek.encapsulate()`), while
# `rsa`/`sha2` below stay pinned to the older generation
# (crypto-common 0.1, signature 2, rand_core 0.6). Cargo resolves both generations
# side by side fine; crypto/pq.rs bridges the two only via raw `Vec<u8>`/`[u8; N]`
# bytes, never shared trait impls. `hkdf` stays on the *old* generation (built on
# the existing sha2 0.10/digest 0.10), so the HKDF combiner step has no version
# friction with the rest of this file.
[target.'cfg(target_os = "windows")'.dependencies]
# Win32_UI_WindowsAndMessaging: the global push-to-talk shortcut's message
# pump (`src/client/global_ptt.rs`). Same version `global-hotkey` itself
# pins, so cargo resolves one copy rather than two.
# Win32_Security(_Authorization)/Win32_System_Pipes/Win32_System_Threading:
# `src/client/daemon_ipc.rs`'s owner-only ACL on the daemon attach pipe and
# the SID check `connect` makes on it - the Windows counterpart of the Unix
# side's socket `0600` + uid check (see that module's doc comment).
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# `voice_pulse.rs`, used only on musl (see that module's doc comment for why
# cpal's ALSA/dlopen path can't reach PulseAudio/PipeWire from a fully static
# binary). `target_env` rather than `target_os`: every musl target here is
# already Linux-only, but this is the cfg that actually names the property
# that matters (libc, not OS) and matches `#[cfg(target_env = "musl")]` in
# the source and `Cross.toml`'s static libpulse build.
[target.'cfg(target_env = "musl")'.dependencies]
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

# The daemon's own socket ownership check and the `setsid` that detaches it
# from the launching terminal (`src/client/daemon_ipc.rs`,
# `src/client/daemon.rs`) - std exposes neither. Already in the tree
# transitively (cpal), so this only promotes it to a direct dependency.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
aes-gcm = "0.11"
bincode = { version = "2", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.18.1"
crossterm = "0.29.0"
global-hotkey = "0.8"
hkdf = "0.12"
# Local interface enumeration for direct peer-to-peer UDP hole punching's
# host candidates (`src/client/p2p.rs`) - std has no cross-platform way to list a
# machine's own network interfaces.
if-addrs = "0.13"
ml-dsa = "0.1"
ml-kem = { version = "0.3", features = ["getrandom"] }
rand_core = { version = "0.6", features = ["getrandom", "std"] }
ratatui = "0.30.2"
rsa = { version = "0.9.10", features = ["pem"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.10", features = ["oid"] }
sysinfo = "0.33"
thiserror = "2.0.20"
# Only for formatting the OTP session-established timestamp shown in the TUI
# (`client::otp::format_now`) - already pulled in transitively by ratatui at
# this exact version, so this promotes it to direct rather than growing the
# dependency tree.
time = { version = "0.3.55", features = ["local-offset", "formatting"] }
tokio = { version = "1.53.1", features = ["full"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Server-side TLS for the control connection and the activation endpoint
# (`src/server/ssl.rs`), and the client end of the same (`client::connect`).
# The `ring` provider rather than rustls' default `aws-lc-rs`: pure Rust plus
# a little portable C, which is what the fully static musl targets in
# `Cross.toml` can build without a cmake toolchain.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
# Password-to-key derivation for the server's users registry
# (`server::users_registry::derive_user_key`) - a deliberately slow KDF,
# since what it protects is a password.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# Wipes raw one-time-pad key bytes (`crypto::otp`, `client::otp`) from memory
# on drop - pad material is the literal one-time secret with no
# computational-hardness fallback, unlike every other key type this app
# handles, so it gets a stricter standard.
zeroize = { version = "1", features = ["derive"] }

# Test-only. None of these reach the shipped `aloo` binary or library.
[dev-dependencies]
# Gherkin runner for the acceptance layer in `features/`.
cucumber = "0.23"
# Parses `requirements/requirements.toml`, the requirement model that the
# traceability tool validates the suite against.
toml = "0.9"
# Self-signed certificates for the TLS tests (`test/ssl_test.rs`).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }


[lib]
name = "aloo"
path = "src/lib.rs"

